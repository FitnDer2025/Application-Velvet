name: Zwit final visible identity

on:
  push:
    branches:
      - feat/zwit-rebrand
    paths:
      - scripts/zwit-finalize-visible-brand.mjs
      - .github/workflows/zwit-finalize-visible-brand.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-visible-brand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rebrand branch
        uses: actions/checkout@v4
        with:
          ref: feat/zwit-rebrand
          fetch-depth: 0

      - name: Apply final visible identity corrections
        run: node scripts/zwit-finalize-visible-brand.mjs

      - name: Commit corrections
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: finaliser les libellés visibles Zwit [skip ci]"
          git push origin HEAD:feat/zwit-rebrand
