name: Zwit visible brand source fix

on:
  push:
    branches:
      - release/zwit-v1.5-seven-capitals
    paths:
      - '.github/workflows/zwit-visible-brand-source-fix.yml'

permissions:
  contents: write

jobs:
  fix-visible-brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/zwit-v1.5-seven-capitals
      - name: Replace only public Velvet strings
        run: |
          python - <<'PY'
          from pathlib import Path

          changes = {
              Path('apps/beta/static/assets/velvet-studio-v31-media.js'): [
                  ('démonstration fictive de Velvet.', 'démonstration fictive de Zwit.'),
                  ("seconds < 9.3 ? scenario.headline : 'Velvet.'", "seconds < 9.3 ? scenario.headline : 'Zwit.'"),
                  ('link.download = `velvet-${item.scenario}-${item.seed}.webm`;', 'link.download = `zwit-${item.scenario}-${item.seed}.webm`;'),
              ],
              Path('apps/beta/static/assets/velvet-waitlist-control.js'): [
                  ('link.download = `velvet-preinscriptions-${new Date().toISOString().slice(0, 10)}.csv`;', 'link.download = `zwit-preinscriptions-${new Date().toISOString().slice(0, 10)}.csv`;'),
              ],
          }

          for path, replacements in changes.items():
              source = path.read_text(encoding='utf-8')
              for old, new in replacements:
                  count = source.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one occurrence of {old!r}, found {count}')
                  source = source.replace(old, new)
              path.write_text(source, encoding='utf-8')
          PY
      - name: Verify visible source fixes
        run: |
          grep -F 'démonstration fictive de Zwit.' apps/beta/static/assets/velvet-studio-v31-media.js
          grep -F "scenario.headline : 'Zwit.'" apps/beta/static/assets/velvet-studio-v31-media.js
          grep -F 'link.download = `zwit-${item.scenario}-${item.seed}.webm`;' apps/beta/static/assets/velvet-studio-v31-media.js
          grep -F 'link.download = `zwit-preinscriptions-${new Date().toISOString().slice(0, 10)}.csv`;' apps/beta/static/assets/velvet-waitlist-control.js
      - name: Commit source fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/beta/static/assets/velvet-studio-v31-media.js apps/beta/static/assets/velvet-waitlist-control.js
          git commit -m 'fix(brand): remove remaining visible Velvet source strings'
          git push origin HEAD:release/zwit-v1.5-seven-capitals
