name: Zwit visible brand source fix

on:
  push:
    branches:
      - release/zwit-v1.5-seven-capitals
    paths:
      - '.github/workflows/zwit-visible-brand-source-fix.yml'

permissions:
  contents: write

jobs:
  fix-visible-brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/zwit-v1.5-seven-capitals
      - name: Replace remaining public Studio and messaging strings
        run: |
          python - <<'PY'
          from pathlib import Path

          changes = {
              Path('apps/beta/static/assets/velvet-marketing-pro-studio-bridge.js'): [
                  ('typography added later by Velvet.', 'typography added later by Zwit.', 1),
              ],
              Path('apps/beta/static/assets/velvet-mobile-feed-hotfix.js'): [
                  ('Conversation confidentielle Velvet.', 'Conversation confidentielle Zwit.', 1),
              ],
              Path('apps/beta/static/assets/velvet-pro-studio-ai.js'): [
                  ('teaser-velvet.webm', 'teaser-zwit.webm', 1),
              ],
              Path('apps/beta/static/assets/velvet-studio-sprint1.js'): [
                  ('Rassurer et différencier Velvet.', 'Rassurer et différencier Zwit.', 1),
                  ('Velvet. Là où les plus belles rencontres commencent.', 'Zwit. Là où les plus belles rencontres commencent.', 2),
                  ('Décris le plan ou sélectionne un asset Velvet.', 'Décris le plan ou sélectionne un asset Zwit.', 1),
                  ('Conçois, dirige et monte les campagnes Velvet.', 'Conçois, dirige et monte les campagnes Zwit.', 1),
                  ("'velvet-studio'", "'zwit-studio'", 1),
              ],
              Path('apps/beta/static/assets/velvet-studio-story-director.js'): [
                  ('Une envie.<br>Une histoire. Velvet.', 'Une envie.<br>Une histoire. Zwit.', 1),
                  ('véritable espace Membres Velvet.', 'véritable espace Membres Zwit.', 1),
              ],
          }

          for path, replacements in changes.items():
              source = path.read_text(encoding='utf-8')
              for old, new, expected in replacements:
                  count = source.count(old)
                  if count != expected:
                      raise SystemExit(f'{path}: expected {expected} occurrence(s) of {old!r}, found {count}')
                  source = source.replace(old, new)
              path.write_text(source, encoding='utf-8')
          PY
      - name: Verify copy
        run: |
          grep -F 'typography added later by Zwit.' apps/beta/static/assets/velvet-marketing-pro-studio-bridge.js
          grep -F 'Conversation confidentielle Zwit.' apps/beta/static/assets/velvet-mobile-feed-hotfix.js
          grep -F 'teaser-zwit.webm' apps/beta/static/assets/velvet-pro-studio-ai.js
          grep -F 'Rassurer et différencier Zwit.' apps/beta/static/assets/velvet-studio-sprint1.js
          grep -F 'Zwit. Là où les plus belles rencontres commencent.' apps/beta/static/assets/velvet-studio-sprint1.js
          grep -F 'asset Zwit.' apps/beta/static/assets/velvet-studio-sprint1.js
          grep -F 'campagnes Zwit.' apps/beta/static/assets/velvet-studio-sprint1.js
          grep -F "'zwit-studio'" apps/beta/static/assets/velvet-studio-sprint1.js
          grep -F 'Une histoire. Zwit.' apps/beta/static/assets/velvet-studio-story-director.js
          grep -F 'espace Membres Zwit.' apps/beta/static/assets/velvet-studio-story-director.js
      - name: Commit copy fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/beta/static/assets/velvet-marketing-pro-studio-bridge.js apps/beta/static/assets/velvet-mobile-feed-hotfix.js apps/beta/static/assets/velvet-pro-studio-ai.js apps/beta/static/assets/velvet-studio-sprint1.js apps/beta/static/assets/velvet-studio-story-director.js
          git commit -m 'fix(brand): finish remaining Zwit Studio and messaging copy'
          git push origin HEAD:release/zwit-v1.5-seven-capitals
