name: Zwit visible brand source fix

on:
  push:
    branches:
      - release/zwit-v1.5-seven-capitals
    paths:
      - '.github/workflows/zwit-visible-brand-source-fix.yml'

permissions:
  contents: write

jobs:
  fix-visible-brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/zwit-v1.5-seven-capitals
      - name: Replace remaining public legacy copy
        run: |
          python - <<'PY'
          from pathlib import Path

          changes = {
              Path('ios/Velvet/Core/System/BiometricLockService.swift'): [
                  ('Active \\(biometryName) pour protéger ton espace privé Velvet.', 'Active \\(biometryName) pour protéger ton espace privé Zwit.', 1),
                  ('Déverrouille ton espace privé Velvet.', 'Déverrouille ton espace privé Zwit.', 1),
              ],
              Path('apps/beta/static/assets/velvet-studio-v31-media.js'): [
                  ('velvet-${item.scenario}-${item.seed}.jpg', 'zwit-${item.scenario}-${item.seed}.jpg', 1),
              ],
              Path('apps/beta/static/assets/velvet-studio-v31-compat.js'): [
                  ('video-velvet', 'video-zwit', 2),
              ],
              Path('apps/beta/static/assets/velvet-studio-v3.js'): [
                  ('Votre invitation pour découvrir Velvet.', 'Votre invitation pour découvrir Zwit.', 1),
              ],
              Path('apps/beta/static/assets/velvet-studio-v2.js'): [
                  ('Velvet. Là où les plus belles rencontres commencent.', 'Zwit. Là où les plus belles rencontres commencent.', 1),
              ],
          }

          for path, replacements in changes.items():
              source = path.read_text(encoding='utf-8')
              for old, new, expected in replacements:
                  count = source.count(old)
                  if count != expected:
                      raise SystemExit(f'{path}: expected {expected} occurrence(s) of {old!r}, found {count}')
                  source = source.replace(old, new)
              path.write_text(source, encoding='utf-8')
          PY
      - name: Verify public copy
        run: |
          grep -F 'espace privé Zwit.' ios/Velvet/Core/System/BiometricLockService.swift
          grep -F 'zwit-${item.scenario}-${item.seed}.jpg' apps/beta/static/assets/velvet-studio-v31-media.js
          grep -F 'video-zwit' apps/beta/static/assets/velvet-studio-v31-compat.js
          grep -F 'découvrir Zwit.' apps/beta/static/assets/velvet-studio-v3.js
          grep -F 'Zwit. Là où les plus belles rencontres commencent.' apps/beta/static/assets/velvet-studio-v2.js
      - name: Commit copy fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ios/Velvet/Core/System/BiometricLockService.swift apps/beta/static/assets/velvet-studio-v31-media.js apps/beta/static/assets/velvet-studio-v31-compat.js apps/beta/static/assets/velvet-studio-v3.js apps/beta/static/assets/velvet-studio-v2.js
          git commit -m 'fix(brand): migrate remaining legacy user-facing copy to Zwit'
          git push origin HEAD:release/zwit-v1.5-seven-capitals
