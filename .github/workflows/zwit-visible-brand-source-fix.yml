name: Zwit visible brand source fix

on:
  push:
    branches:
      - release/zwit-v1.5-seven-capitals
    paths:
      - '.github/workflows/zwit-visible-brand-source-fix.yml'

permissions:
  contents: write

jobs:
  fix-visible-brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/zwit-v1.5-seven-capitals
      - name: Replace only remaining public Studio strings
        run: |
          python - <<'PY'
          from pathlib import Path

          changes = {
              Path('apps/beta/static/assets/velvet-studio-product-demo.js'): [
                  ('Crée une démonstration générale de Velvet.', 'Crée une démonstration générale de Zwit.', 1),
                  ('Impossible de préparer un écran Velvet.', 'Impossible de préparer un écran Zwit.', 1),
                  ("'demo-velvet'", "'demo-zwit'", 2),
              ],
              Path('apps/beta/static/assets/velvet-studio-live-recorder.js'): [
                  ('Le vrai Velvet.', 'Le vrai Zwit.', 1),
                  ('`velvet-demo-live-${Date.now()}.${extension}`', '`zwit-demo-live-${Date.now()}.${extension}`', 1),
              ],
              Path('apps/beta/static/assets/velvet-studio-lite.js'): [
                  ('Impossible de préparer un écran Velvet.', 'Impossible de préparer un écran Zwit.', 1),
                  ("'demo-velvet'", "'demo-zwit'", 2),
              ],
          }

          for path, replacements in changes.items():
              source = path.read_text(encoding='utf-8')
              for old, new, expected in replacements:
                  count = source.count(old)
                  if count != expected:
                      raise SystemExit(f'{path}: expected {expected} occurrence(s) of {old!r}, found {count}')
                  source = source.replace(old, new)
              path.write_text(source, encoding='utf-8')
          PY
      - name: Verify Studio source fixes
        run: |
          grep -F 'Crée une démonstration générale de Zwit.' apps/beta/static/assets/velvet-studio-product-demo.js
          grep -F 'Impossible de préparer un écran Zwit.' apps/beta/static/assets/velvet-studio-product-demo.js
          grep -F "'demo-zwit'" apps/beta/static/assets/velvet-studio-product-demo.js
          grep -F 'Le vrai Zwit.' apps/beta/static/assets/velvet-studio-live-recorder.js
          grep -F 'zwit-demo-live-${Date.now()}' apps/beta/static/assets/velvet-studio-live-recorder.js
          grep -F 'Impossible de préparer un écran Zwit.' apps/beta/static/assets/velvet-studio-lite.js
          grep -F "'demo-zwit'" apps/beta/static/assets/velvet-studio-lite.js
      - name: Commit source fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/beta/static/assets/velvet-studio-product-demo.js apps/beta/static/assets/velvet-studio-live-recorder.js apps/beta/static/assets/velvet-studio-lite.js
          git commit -m 'fix(brand): complete Zwit Studio visible rebrand'
          git push origin HEAD:release/zwit-v1.5-seven-capitals
