name: Zwit visible brand source fix

on:
  push:
    branches:
      - release/zwit-v1.5-seven-capitals
    paths:
      - '.github/workflows/zwit-visible-brand-source-fix.yml'

permissions:
  contents: write

jobs:
  fix-visible-brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/zwit-v1.5-seven-capitals
      - name: Replace remaining public Pro strings
        run: |
          python - <<'PY'
          from pathlib import Path

          changes = {
              Path('apps/beta/static/assets/velvet-pro-studio-ai.js'): [
                  ('composés exactement par Velvet.', 'composés exactement par Zwit.', 1),
                  ("'affiche-velvet'", "'affiche-zwit'", 1),
              ],
              Path('apps/beta/static/assets/velvet-pro-marketing.js'): [
                  ('reliés à une inscription Velvet.', 'reliés à une inscription Zwit.', 1),
              ],
          }

          for path, replacements in changes.items():
              source = path.read_text(encoding='utf-8')
              for old, new, expected in replacements:
                  count = source.count(old)
                  if count != expected:
                      raise SystemExit(f'{path}: expected {expected} occurrence(s) of {old!r}, found {count}')
                  source = source.replace(old, new)
              path.write_text(source, encoding='utf-8')
          PY
      - name: Verify Pro copy
        run: |
          grep -F 'composés exactement par Zwit.' apps/beta/static/assets/velvet-pro-studio-ai.js
          grep -F "'affiche-zwit'" apps/beta/static/assets/velvet-pro-studio-ai.js
          grep -F 'reliés à une inscription Zwit.' apps/beta/static/assets/velvet-pro-marketing.js
      - name: Commit copy fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/beta/static/assets/velvet-pro-studio-ai.js apps/beta/static/assets/velvet-pro-marketing.js
          git commit -m 'fix(brand): finish Zwit Pro visible copy migration'
          git push origin HEAD:release/zwit-v1.5-seven-capitals
