name: Zwit Apple build

on:
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: List project targets
        run: xcodebuild -project ios/Velvet.xcodeproj -list

      - name: Compile Zwit for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild -quiet \
            -project ios/Velvet.xcodeproj \
            -scheme Velvet \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Compile Zwit Widget for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild -quiet \
            -project ios/Velvet.xcodeproj \
            -target VelvetWidget \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Compile Zwit Watch for watchOS Simulator
        run: |
          set -o pipefail
          xcodebuild -quiet \
            -project ios/Velvet.xcodeproj \
            -target VelvetWatch \
            -configuration Debug \
            -sdk watchsimulator \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Compile Zwit Watch Widget for watchOS Simulator
        run: |
          set -o pipefail
          xcodebuild -quiet \
            -project ios/Velvet.xcodeproj \
            -target VelvetWatchWidget \
            -configuration Debug \
            -sdk watchsimulator \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
