name: Zwit identity rebrand

on:
  push:
    branches:
      - feat/zwit-rebrand
    paths:
      - scripts/zwit-rebrand.mjs
      - .github/workflows/zwit-rebrand.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-rebrand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rebrand branch
        uses: actions/checkout@v4
        with:
          ref: feat/zwit-rebrand
          fetch-depth: 0

      - name: Apply safe visible-brand replacement
        run: node scripts/zwit-rebrand.mjs

      - name: Preserve technical migration assertions
        run: |
          git checkout origin/v1-lived-demo -- \
            scripts/check-beta-persistence.mjs \
            scripts/check-beta-release.mjs \
            scripts/check-beta-user-journey.mjs \
            scripts/check-beta-worker.mjs \
            scripts/check-supabase-migrations.mjs \
            scripts/generate-venue-address-coordinates.mjs \
            scripts/ops/backup-format.mjs \
            scripts/recipe/serve-beta.mjs

      - name: Install SVG renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends librsvg2-bin imagemagick

      - name: Render Zwit web and Apple marks
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="apps/beta/static/assets/zwit-icon.svg"
          rsvg-convert -w 180 -h 180 "$SOURCE" -o apps/beta/static/assets/velvet-icon-180.png
          rsvg-convert -w 192 -h 192 "$SOURCE" -o apps/beta/static/assets/velvet-icon-192.png
          rsvg-convert -w 512 -h 512 "$SOURCE" -o apps/beta/static/assets/velvet-icon-512.png

          IOS_MARK="ios/Velvet/Resources/Assets.xcassets/VelvetMark.imageset/VelvetMark.png"
          if [ -f "$IOS_MARK" ]; then
            SIZE="$(identify -format '%wx%h' "$IOS_MARK")"
            WIDTH="${SIZE%x*}"
            HEIGHT="${SIZE#*x}"
            rsvg-convert -w "$WIDTH" -h "$HEIGHT" "$SOURCE" -o "$IOS_MARK"
          fi

          APP_ICON="ios/Velvet/Resources/Assets.xcassets/AppIcon.appiconset/ZwitAppIcon.png"
          TEMP_ICON="${RUNNER_TEMP}/zwit-app-icon.png"
          rsvg-convert -w 1024 -h 1024 "$SOURCE" -o "$TEMP_ICON"
          convert "$TEMP_ICON" -alpha off "$APP_ICON"

      - name: Commit generated rebrand
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: appliquer l'identité Zwit [skip ci]"
          git push origin HEAD:feat/zwit-rebrand
