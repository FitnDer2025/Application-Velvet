name: Zwit brand audit runner

on:
  push:
    branches:
      - main
    paths:
      - '.zwit-trigger/brand-audit.txt'

permissions:
  contents: read

jobs:
  visible-brand-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: fix/zwit-brand-audit-premium
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - run: npm ci --ignore-scripts
      - name: Run Zwit visible-brand audit
        run: node --test --test-isolation=none apps/beta/test/zwit-brand-audit.test.mjs
      - name: Validate Web scripts
        run: |
          node --check apps/beta/static/assets/zwit-brand-system.js
          node --check apps/beta/static/assets/zwit-experience.js
          node --check apps/beta/static/assets/zwit-experience-refinement.js
          node --check apps/beta/static/assets/zwit-interaction-date-fix.js
          node --check apps/beta/static/assets/velvet-production-surface.js
      - name: Build Web surface
        run: npm run build:beta

  apple-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: fix/zwit-brand-audit-premium
      - name: Compile Zwit app
        run: |
          set -o pipefail
          xcodebuild -quiet \
            -project ios/Velvet.xcodeproj \
            -scheme Velvet \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Compile Zwit widget
        run: |
          set -o pipefail
          xcodebuild -quiet \
            -project ios/Velvet.xcodeproj \
            -target VelvetWidget \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Compile Watch targets
        run: |
          set -o pipefail
          xcodebuild -quiet -project ios/Velvet.xcodeproj -target VelvetWatch -configuration Debug -sdk watchsimulator -destination 'generic/platform=watchOS Simulator' CODE_SIGNING_ALLOWED=NO build
          xcodebuild -quiet -project ios/Velvet.xcodeproj -target VelvetWatchWidget -configuration Debug -sdk watchsimulator -destination 'generic/platform=watchOS Simulator' CODE_SIGNING_ALLOWED=NO build
