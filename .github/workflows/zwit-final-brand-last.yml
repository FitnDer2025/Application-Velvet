name: Zwit final brand last cleanup

on:
  push:
    branches:
      - release/zwit-v1.5-seven-capitals
    paths:
      - '.github/workflows/zwit-final-brand-last.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/zwit-v1.5-seven-capitals
      - name: Replace final Pro visible brand string
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('functions/api/pro/marketing.js')
          source = path.read_text(encoding='utf-8')
          old = 'Retrouvez toutes les informations sur Velvet.'
          new = 'Retrouvez toutes les informations sur Zwit.'
          if old not in source:
              raise SystemExit('Expected Pro marketing string not found')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/api/pro/marketing.js
          git commit -m 'fix(brand): remove final Pro Velvet copy'
          git push origin HEAD:release/zwit-v1.5-seven-capitals
