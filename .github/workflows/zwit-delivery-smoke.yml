name: Zwit delivery smoke

on:
  push:
    branches:
      - verify/zwit-v15-delivery
    paths:
      - '.github/workflows/zwit-delivery-smoke.yml'

permissions:
  contents: read

jobs:
  smoke-live-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public Worker and deployed v1.5 marker
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://velvet-beta.sh96hv64dj.workers.dev'
          for path in '/' '/membres/' '/pro/' '/control/'; do
            code="$(curl --retry 4 --retry-delay 2 --connect-timeout 10 --max-time 25 -L -sS -o /tmp/body -w '%{http_code}' "$BASE$path")"
            echo "$path -> $code"
            test "$code" -ge 200 -a "$code" -lt 500
          done
          curl --retry 4 --retry-delay 2 --connect-timeout 10 --max-time 25 -L -fsS "$BASE/assets/account-access-menu.js" -o /tmp/account-access-menu.js
          grep -F '.sidebar{overflow-y:auto!important' /tmp/account-access-menu.js
          curl --retry 4 --retry-delay 2 --connect-timeout 10 --max-time 25 -L -fsS "$BASE/assets/zwit-brand-system.js" -o /tmp/zwit-brand-system.js
          grep -F 'Never rewrite user-entered values' /tmp/zwit-brand-system.js
          echo 'LIVE_WORKER_V15_OK'
