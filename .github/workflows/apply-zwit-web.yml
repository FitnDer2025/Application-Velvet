name: Apply Zwit Web experience

on:
  push:
    branches:
      - feat/zwit-brand-messaging-albums-splash
    paths:
      - scripts/apply-zwit-web.py
      - .github/workflows/apply-zwit-web.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply targeted Web patches
        run: python scripts/apply-zwit-web.py
      - name: Commit generated changes
        run: |
          git config user.name "Velvet Application"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(web): ouverture, dates et albums Zwit [feature-applied]"
          git push origin HEAD:feat/zwit-brand-messaging-albums-splash
