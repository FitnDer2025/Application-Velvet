name: Fix Zwit logo orientation

on:
  push:
    branches:
      - feat/zwit-brand-messaging-albums-splash
    paths:
      - .github/workflows/fix-zwit-logo-orientation.yml

permissions:
  contents: write

jobs:
  fix-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install image tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
      - name: Put the Z upright without redesigning it
        run: |
          convert ios/Velvet/Resources/Assets.xcassets/VelvetMark.imageset/VelvetMark.png -flop /tmp/VelvetMark.png
          mv /tmp/VelvetMark.png ios/Velvet/Resources/Assets.xcassets/VelvetMark.imageset/VelvetMark.png
          convert ios/Velvet/Resources/Assets.xcassets/AppIcon.appiconset/ZwitAppIcon.png -flop /tmp/ZwitAppIcon.png
          mv /tmp/ZwitAppIcon.png ios/Velvet/Resources/Assets.xcassets/AppIcon.appiconset/ZwitAppIcon.png
          sed -i "s#/assets/zwit-logo-1024.jpg#/assets/zwit-logo.svg#g" apps/beta/static/assets/zwit-experience.js
          identify ios/Velvet/Resources/Assets.xcassets/VelvetMark.imageset/VelvetMark.png
          identify ios/Velvet/Resources/Assets.xcassets/AppIcon.appiconset/ZwitAppIcon.png
      - name: Commit corrected assets
        run: |
          rm .github/workflows/fix-zwit-logo-orientation.yml
          git config user.name "Velvet Application"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(brand): remettre le Z Zwit à l'endroit [logo-fixed]"
          git push origin HEAD:feat/zwit-brand-messaging-albums-splash
