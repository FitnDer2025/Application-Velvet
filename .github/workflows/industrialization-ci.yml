name: Velvet industrialization CI

on:
  push:
    paths:
      - "apps/api/**"
      - "apps/beta/**"
      - "packages/api-client/**"
      - "docs/beta/**"
      - "functions/**"
      - "infra/**"
      - "scripts/check-supabase-migrations.mjs"
      - "scripts/security/**"
      - "scripts/ops/**"
      - "scripts/recipe/**"
      - "tests/recipe/**"
      - "playwright.config.mjs"
      - "package.json"
      - "package-lock.json"
      - "wrangler.jsonc"
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/beta/**"
      - "packages/api-client/**"
      - "docs/beta/**"
      - "functions/**"
      - "infra/**"
      - "scripts/check-supabase-migrations.mjs"
      - "scripts/security/**"
      - "scripts/ops/**"
      - "scripts/recipe/**"
      - "tests/recipe/**"
      - "playwright.config.mjs"
      - "package.json"
      - "package-lock.json"
      - "wrangler.jsonc"

permissions:
  contents: read

jobs:
  security-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
      - run: npm ci --ignore-scripts
      - run: npm run security:audit
      - run: npm run check
      - run: npm test
      - run: npm run build:beta
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run recipe:browser
