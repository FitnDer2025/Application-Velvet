name: Apply Zwit official visual correction

on:
  push:
    branches: [fix/zwit-official-logo-opening-dates]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'apply official Zwit visual correction') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zwit-official-logo-opening-dates
          fetch-depth: 0
      - name: Patch sources
        run: |
          export PATCH_B64="$(cat .github/zwit-patch/part*)"
          python -c "import os,zlib,base64;exec(zlib.decompress(base64.b64decode(os.environ['PATCH_B64'])))"
      - name: Commit correction
        run: |
          git config user.name "Velvet-Application"
          git config user.email "sh96hv64dj@privaterelay.appleid.com"
          git rm -r .github/zwit-patch .github/workflows/apply-zwit-visual-fix.yml
          git add apps/beta/static/assets/zwit-experience.js apps/beta/test/zwit-experience.test.mjs ios/Velvet/App/RootView.swift ios/Velvet/Features/Messaging/RealtimeAppleMessagingViews.swift ios/Velvet/DesignSystem/AppleShellComponents.swift ios/Velvet/Resources/Assets.xcassets/VelvetMark.imageset/Contents.json
          git commit -m "fix: apply official Zwit visual correction [skip ci]"
          git push origin HEAD:fix/zwit-official-logo-opening-dates
