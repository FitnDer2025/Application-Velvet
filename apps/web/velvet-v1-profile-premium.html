id{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.album{height:190px;border-radius:18px;background-size:cover;background-position:center;position:relative;overflow:hidden}.album span{position:absolute;left:12px;bottom:12px;right:12px;z-index:2;font-weight:bold}.album:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,#000d)}.album.locked{filter:none}.album.locked:before{content:'🔒 12 contenus privés';position:absolute;z-index:3;inset:0;display:grid;place-items:center;background:#09090bbb;backdrop-filter:blur(8px);font-weight:bold}.timeline{display:grid;gap:12px}.timeline-item{display:grid;grid-template-columns:12px 1fr;gap:12px}.timeline-item i{width:12px;height:12px;border-radius:50%;background:var(--gold);margin-top:6px;box-shadow:0 0 0 5px #c9a86a18}.availability{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{text-align:center;padding:11px 5px;border-radius:13px;background:#ffffff06;border:1px solid var(--line);font-size:11px}.day.on{border-color:#c9a86a88;color:var(--gold)}.edit-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.edit-grid label{font-size:11px;color:var(--muted)}.edit-grid input,.edit-grid textarea,.edit-grid select{margin-top:5px;width:100%;border:1px solid var(--line);border-radius:12px;background:#18181c;color:#fff;padding:11px}.edit-grid textarea{min-height:110px;resize:vertical}.wide{grid-column:1/-1}.quote{font-family:Georgia;font-style:italic;font-size:24px;line-height:1.5;text-align:center;padding:34px;color:#e8dcc8}.mini-list{display:grid;gap:9px}.mini-row{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #ffffff0c}.verified{color:#7bd6aa}.privacy-note{padding:13px;border-radius:14px;background:#71244025;border:1px solid #c9a86a35;color:#ddd}.private-tease{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.tease{height:130px;border-radius:15px;background-size:cover;background-position:center;position:relative;overflow:hidden}.tease:after{content:'🔒';position:absolute;inset:0;display:grid;place-items:center;background:#0008;backdrop-filter:blur(6px);font-size:22px}@media(max-width:900px){.profile-layout{grid-template-columns:1fr}.facts{grid-template-columns:repeat(2,1fr)}.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.profile-cover{min-height:520px;border-radius:0;margin:-14px -14px 0}.profile-cover-copy{left:18px;right:18px;bottom:22px}.profile-title{font-size:42px}.profile-tabs{top:72px;margin:0 -14px;padding:12px 14px}.premium-card{border-radius:20px;padding:17px}.profile-person{grid-template-columns:105px 1fr}.profile-person img{width:105px;height:145px}.facts{grid-template-columns:1fr 1fr}.album-grid{grid-template-columns:1fr 1fr}.album{height:155px}.private-tease{grid-template-columns:repeat(2,1fr)}.metrics{grid-template-columns:repeat(2,1fr)}.availability{grid-template-columns:repeat(4,1fr)}.edit-grid{grid-template-columns:1fr}.wide{grid-column:auto}.quote{font-size:20px;padding:22px 8px}}

beaucoup d’importance au confort de chacun, au dialogue et à une séduction naturelle sans personnes trop sûres d’elles.',cyrilAge:'37 ans',cyrilHeight:'176',cyrilWeight:'72',cyrilMorph:'Sportif',cyrilEyes:'Marron',cyrilHair:'Bruns',cyrilOrientation:'Hétéro',cyrilJob:'Directeur',cyrilTattoos:'Tatoué',cyrilPiercings:'Aucun',cyrilCharacter:'Calme, protecteur, attentionné',smoke:'Non-fumeurs'},p)}function tabs(){return `<div class="profile-tabs"><button class="${profileTab==='couple'?'active':''}" onclick="parent.profileSetTab('couple')">Notre couple</button><button class="${profileTab==='elle'?'active':''}" onclick="parent.profileSetTab('elle')">Céline</button><button class="${profileTab==='lui'?'active':''}" onclick="parent.profileSetTab('lui')">Cyril</button><button class="${profileTab==='albums'?'active':''}" onclick="parent.profileSetTab('albums')">Albums</button><button class="${profileTab==='sorties'?'active':''}" onclick="parent.profileSetTab('sorties')">Sorties</button><button class="${profileTab==='avis'?'active':''}" onclick="parent.profileSetTab('avis')">Avis & recommandations</button></div>`}function couple(p){return `<div class="profile-layout"><div><section class="premium-card"><div class="ey">Notre histoire</div><h2>Plus de quatorze ans de complicité</h2><div class="story-copy">${esc(p.story)}</div></section><section class="premium-card"><div class="ey">Notre philosophie</div><h2>Ce qui guide nos rencontres</h2><div class="chips">${['Respect','Consentement','Communication','Bienveillance','Sensualité','Humour','Aucune pression','Feeling indispensable'].map(x=>`<span class="chip">${x}</span>`).join('')}</div><p class="story-copy">${esc(p.philosophy)}</p></section><section class="premium-card"><div class="ey">Ce que nous recherchons</div><h2>Des connexions avant tout</h2><p class="story-copy">${esc(p.search)}</p><div class="chips">${['Couples','Femmes','Rencontres suivies','Soirées privées','Spa','Restaurant','Voyages','Trios F'].map(x=>`<span class="chip" "premium-card"><div class="ey">Album personnel</div><h3>${she?'Son univers':'Son univers'}</h3><div class="private-tease"><div class="tease" style="background-image:url('${img}')"></div><div class="tease" style="background-image:url('${w.I.room}')"></div><div class="tease" style="background-image:url('${w.I.spa}')"></div><div class="tease" style="background-image:url('${w.I.party}')"></div></div><p class="muted">4 aperçus privés visibles uniquement après autorisation.</p></section></aside></div>`}function albums(){return `<section class="premium-card"><div class="row"><div><div class="ey">Notre galerie</div><h2>Albums, vidéos & souvenirs</h2></div><button class="btn" onclick="parent.profileToast('Gestion des albums ouverte')">Gérer les albums</button></div><div class="album-grid"><div class="album" style="background-image:url('${w.I.c1}')"><span>Nous deux · 18 photos</span></div><div class="album" style="background-image:url('${w.I.spa}')"><span>Escapades spa · 9 photos</span></div><div class="album" style="background-image:url('${w.I.party}')"><span>Nos sorties · 14 photos</span></div><div class="album locked" style="background-image:url('${w.I.room}')"></div><div class="album locked" style="background-image:url('${w.I.w1}')"></div><div class="album locked" style="background-image:url('${w.I.m1}')"></div></div><div class="privacy-note" style="margin-top:14px">Les albums privés restent visibles sous forme d’aperçus verrouillés afin de montrer qu’un univers plus intime existe, sans jamais dévoiler son contenu sans accord.</div></section><section class="premium-card"><div class="ey">Contenus</div><div class="metrics"><div class="metric"><strong>61</strong><span>Photos</span></div><div class="metric"><strong>18</strong><span>Vidéos</span></div><div class="metric"><strong>12</strong><span>Privés</span></div><div class="metric"><strong>8</strong><span>Stories</span></div></div></section>`}function sorties(){return `<div class="profile-layout"><div><section class="premium-card"><div class="ey">À venir</div><h2>Nos prochaines sorties</h2>${w.E.map(e=>`<div class="feeditem"><img class="avatar" src="${e.img}"><div><b>${e.name}</b><div class="muted">${e.date} · ${e.place}</div></div><button class="btn secondary" onclick="parent.profileToast('Sortie ouverte')">Voir</button></div>`).join('')}</section><section class="premium-card"><div class="ey">Souvenirs</div><h2>Nos sorties passées</h2><div class="timeline"><div class="timeline-item"><i></i><div><strong>Soirée privée à Lille</strong><div class="muted">Une ambiance douce et un très beau feeling.</div></div></div><div class="timeline-item"><i></i><div><strong>Week-end spa en Belgique</strong><div class="muted">Détente, restaurant et rencontres naturelles.</div></div></div><div class="timeline-item"><i></i><div><strong>Découverte de Nuit Velours</strong><div class="muted">Établissement élégant ajouté à nos favoris.</div></div></div></div></section></div><aside><section class="premium-card"><div class="ey">Nos habitudes</div><div class="mini-list"><div class="mini-row"><span>Sorties par mois</span><strong>1 à 2</strong></div><div class="mini-row"><span>Format préféré</span><strong>Privé / Spa</strong></div><div class="mini-row"><span>Distance habituelle</span><strong>80 km</strong></div><div class="mini-row"><span>Préavis idéal</span><strong>1 semaine</strong></div></div></section></aside></div>`}function avis(){return `<div class="profile-layout"><div><section class="premium-card"><div class="ey">Avis reçus</div><h2>Ce que les membres disent de nous</h2><div class="feed"><div class="feeditem"><img class="avatar" src="${w.I.c1}"><div><b>Aurélie & François · ★★★★★</b><div class="muted">Un couple naturel, élégant et très attentionné. Une rencontre comme on les aime.</div></div></div><div class="feeditem"><img class="avatar" src="${w.I.c2}"><div><b>Élodie & Marc · ★★★★★</b><div class="muted">Beaucoup de dialogue et une vraie complicité. On se sent immédiatement à l’aise.</div></div></div><div class="feeditem"><img class="avatar" src="${w.I.w1}"><div><b>Claire · ★★★★★</b><div class="muted">Une belle énergie et énormément de douceur dans les échanges.</div></div></div></div></section><section class="premium-card"><div class="ey">Nos recommandations</div><h2>Profils et lieux que nous apprécions</h2><div class="grid g3">${w.P.slice(0,3).map(w.card).join('')}</div></section></div><aside><section class="premium-card"><div class="ey">Réputation</div><div class="metrics" style="grid-template-columns:1fr 1fr"><div class="metric"><strong>4,9</strong><span>Note moyenne</span></div><div class="metric"><strong>27</strong><span>Rencontres</span></div><div class="metric"><strong>96%</strong><span>Taux de réponse</span></div><div class="metric"><strong>18</strong><span>Recommandations</span></div></div></section></aside></div>`}function edit(p){const fields=[['coupleBio','Présentation du couple','textarea'],['story','Notre histoire','textarea'],['philosophy','Notre philosophie','textarea'],['search','Ce que nous recherchons','textarea'],['city','Ville'],['togetherSince','Ensemble depuis'],['children','Enfants'],['travel','Déplacements'],['languages','Langues'],['availability','Disponibilités'],['celineBio','Présentation de Céline','textarea'],['celineAge','Âge de Céline'],['celineHeight','Taille de Céline'],['celineWeight','Poids de Céline'],['celineMorph','Morphologie de Céline'],['celineEyes','Yeux de Céline'],['celineHair','Cheveux de Céline'],['celineOrientation','Orientation de Céline'],['celineJob','Profession de Céline'],['celineTattoos','Tatouages de Céline'],['celinePiercings','Piercings de Céline'],['celineCharacter','Caractère de Céline'],['cyrilBio','Présentation de Cyril','textarea'],['cyrilAge','Âge de Cyril'],['cyrilHeight','Taille de Cyril'],['cyrilWeight','Poids de Cyril'],['cyrilMorph','Morphologie de Cyril'],['cyrilEyes','Yeux de Cyril'],['cyrilHair','Cheveux de Cyril'],['cyrilOrientation','Orientation de Cyril'],['cyrilJob','Profession de Cyril'],['cyrilTattoos','Tatouages de Cyril'],['cyrilPiercings','Piercings de Cyril'],['cyrilCharacter','Caractère de Cyril']];return `<section class="premium-card"><div class="row"><div><div class="ey">Édition complète</div><h2>Racontez tout de vous</h2></div><button class="btn" onclick="parent.profileSave()">Enregistrer</button></div><div class="edit-grid">${fields.map(x=>`<label class="${x[2]==='textarea'?'wide':''}">${x[1]}${x[2]==='textarea'?`<textarea data-profile="${x[0]}">${esc(p[x[0]])}</textarea>`:`<input data-profile="${x[0]}" value="${esc(p[x[0]])}">`}</label>`).join('')}</div></section>`}function renderMe(){const p=profileData();w.nav();w.content.innerHTML=`<div class="profile-premium"><section class="profile-cover"><div class="profile-cover-copy"><div class="ey">Couple vérifié · Trust Index 98%</div><h1 class="profile-title">Céline & Cyril</h1><p>Ensemble depuis ${esc(p.togetherSince)} · ${esc(p.city)} · Dernière connexion il y a 8 min</p><div class="chips"><span class="chip">Couple</span><span class="chip">Elle bi-curieuse</span><span class="chip">Non-fumeurs</span><span class="chip">Rencontres suivies</span></div><div class="profile-actions" style="margin-top:15px"><button class="btn" onclick="parent.profileEdit()">${editing?'Fermer l’édition':'Modifier le profil'}</button><button class="btn secondary" onclick="parent.profileToast('Lien du profil copié')">Partager</button></div></div></section><div class="metrics" style="margin:18px 0"><div class="metric"><strong>3 248</strong><span>Visites</span></div><div class="metric"><strong>154</strong><span>Coups de cœur</span></div><div class="metric"><strong>642</strong><span>Messages</span></div><div class="metric"><strong>4,9</strong><span>Note</span></div></div>${tabs()}${editing?edit(p):profileTab==='couple'?couple(p):profileTab==='elle'?person(p,'elle'):profileTab==='lui'?person(p,'lui'):profileTab==='albums'?albums():profileTab==='sorties'?sorties():avis()}<div class="quote">« Les plus belles rencontres naissent
