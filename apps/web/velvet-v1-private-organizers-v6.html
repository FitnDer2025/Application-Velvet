  function render(){
    const p=currentProfile(),isOwn=activeId==='self';
    if(isOwn)oldGo('me');else oldGo('member',activeId);
    if(!isCouple(p)&&activeTab==='couple')activeTab='person0';
    w.content.innerHTML=`<div class="v4">${isOwn?'':'<button class="v4-secondary v4-back" onclick="parent.v4Back()">← Retour à Découvrir</button>'}
      ${activeTab==='couple'?hero(p,isOwn):''}${tabs(p)}
      ${activeTab==='couple'?couplePage(p,isOwn):activeTab==='person0'?personPage(p,0,isOwn):activeTab==='person1'?personPage(p,1,isOwn):albumsPage(p,isOwn)}
    </div>`;
  }

  w.go=function(route,param){
    if(route==='me'){activeId='self';activeTab='couple';photoIndex=0;editing=false;render();w.scrollTo(0,0);return}
    if(route==='member'){activeId=param;activeTab=(w.P.find(p=>p.id===param)?.type||'').toLowerCase().includes('couple')?'couple':'person0';photoIndex=0;editing=false;render();w.scrollTo(0,0);return}
    if(route==='venues'){oldGo('venues');w.content.innerHTML=venueDirectory();w.scrollTo(0,0);return}
    if(route==='organizer'){oldGo('organizer');w.content.innerHTML=organizerDashboard();w.scrollTo(0,0);return}
    oldGo(route,param);
  };

  window.v4Tab=tab=>{activeTab=tab;editing=false;personPhotoIndex=0;render();w.scrollTo(0,0)};
  window.v4Photo=delta=>{const count=currentProfile().publicPhotos.length;photoIndex=(photoIndex+delta+count)%count;render()};
  window.v4SetPhoto=index=>{photoIndex=index;render()};
  window.v4PersonPhoto=delta=>{personPhotoIndex=(personPhotoIndex+delta+PHOTO.women.length)%PHOTO.women.length;render()};
  window.v4Scroll=id=>d.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'start'});
  window.v4Toast=text=>w.toast(text);
  window.v4Message=()=>oldGo('conversations',activeId);
  window.v4Back=()=>oldGo('discover');
  window.v4Edit=()=>{editing=!editing;render()};
  window.v4Save=()=>{d.querySelectorAll('[data-v4]').forEach(input=>w.S.profileV4[input.dataset.v4]=input.value);w.save();editing=false;render();w.toast('Profil commun enregistré')};
  window.v4SavePerson=index=>{
    const p=currentProfile(),name=p.names[index],saved=w.S.profileV4[`person-${name}`]||{};
    d.querySelectorAll('[data-person]').forEach(input=>saved[input.dataset.person]=input.dataset.person.startsWith('with')?input.value.split(',').map(x=>x.trim()).filter(Boolean):input.value);
    w.S.profileV4[`person-${name}`]=saved;w.save();editing=false;render();w.toast('Fiche personnelle enregistrée')
  };
  window.v4ToggleCreate=()=>{w.S.v4CreateOpen=!w.S.v4CreateOpen;w.save();render()};
  window.v4CreateAlbum=()=>{
    const name=d.getElementById('v4AlbumName')?.value.trim(),level=d.getElementById('v4AlbumLevel')?.value;
    if(!name){w.toast('Donnez un nom à l’album');return}
    w.S.profileV4Albums.push({name,level,count:0});w.S.v4CreateOpen=false;w.save();render();w.toast('Album privé créé')
  };
  window.v4RequestAlbum=index=>{const key=`${activeId}-${index}`;w.S.profileV4Requests[key]=true;w.save();render();w.toast('Demande d’accès envoyée')};
  window.v5Venues=()=>w.go('venues');
  window.v5OpenVenue=id=>{
    const venue=VENUES_V5.find(item=>item.id===id)||VENUES_V5[0];
    oldGo('venues');w.content.innerHTML=venueDetail(venue);w.scrollTo(0,0)
  };
  window.v5Participants=(venueId,eventId)=>{
    const venue=venueId==='private-self'
      ?{id:'private-self',name:'la soirée privée de Camille & Julien',events:SELF_PRIVATE_EVENTS.concat(w.S.v5OrganizerEvents)}
      :VENUES_V5.find(item=>item.id===venueId)||VENUES_V5[0];
    const event=venue.events.find(item=>item.id===eventId)||venue.events[0];
    oldGo('venues');w.content.innerHTML=venueParticipants(venue,event);w.scrollTo(0,0)
  };
  window.v5Register=(venueId,eventId)=>{
    const key=`${venueId}-${eventId}`;
    w.S.v5VenueRegistrations[key]=!w.S.v5VenueRegistrations[key];w.save();
    if(venueId==='private-self')window.v5OrganizerPublic('self');else window.v5OpenVenue(venueId);
    w.toast(w.S.v5VenueRegistrations[key]?'Inscription enregistrée':'Inscription annulée')
  };
  window.v5OpenMember=id=>w.go(id==='self'?'me':'member',id==='self'?undefined:id);
  window.v5Organizer=()=>w.go('organizer');
  window.v5OrganizerPublic=venueId=>{
    const context=venueId==='self'?'self':VENUES_V5.find(item=>item.id===venueId)||VENUES_V5[0];
    oldGo(venueId==='self'?'organizer':'venues');w.content.innerHTML=organizerPublic(context);w.scrollTo(0,0)
  };
  window.v5RequestOrganizer=()=>{
    w.S.organizerAccess={status:'pending',profileId:'self',accountType:'Couple',requestedAt:'Aujourd’hui'};w.save();w.content.innerHTML=organizerDashboard();w.toast('Demande transmise à la modération')
  };
  window.v5CreateEvent=()=>{
    const name=d.getElementById('v5EventName')?.value.trim(),rawDate=d.getElementById('v5EventDate')?.value,capacity=Number(d.getElementById('v5EventCapacity')?.value)||0;
    if(!name||!rawDate||capacity<2){w.toast('Complétez le nom, la date et la capacité');return}
    const date=new Date(rawDate),months=['JANV','FÉVR','MARS','AVR','MAI','JUIN','JUIL','AOÛT','SEPT','OCT','NOV','DÉC'];
    w.S.v5OrganizerEvents.push({
      id:`custom-${Date.now()}`,day:String(date.getDate()).padStart(2,'0'),month:months[date.getMonth()],name,
      date:date.toLocaleString('fr-FR',{weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}),
      place:d.getElementById('v5EventVenue')?.value||'Lieu privé à confirmer',
      audience:d.getElementById('v5EventAudience')?.value||'Membres validés',booked:0,total:capacity,participants:[]
    });
    w.save();w.content.innerHTML=organizerDashboard();w.scrollTo(0,0);w.toast('Soirée publiée')
  };
  window.v5Scroll=id=>d.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'start'});
  window.v5Toast=text=>w.toast(text);
});
</script>
</body>
</html>
