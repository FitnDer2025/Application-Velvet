  return `<div class="head"><div><div class="ey">Gouvernance et retour arrière</div><h1>Versions de politiques</h1><p class="lead">Chaque déploiement crée un instantané. Une version antérieure peut être chargée dans le brouillon sans effacer l’historique ni modifier silencieusement la production.</p></div><div class="head-actions"><button class="btn" onclick="deployPolicy()">Déployer le brouillon</button></div></div><div class="policy-layout" style="margin-top:20px"><aside class="card"><div class="ey">Historique</div><h2>${S.versions.length} versions conservées</h2><div class="version-list">${S.versions.map((x,i)=>`<button class="version ${x.id===v.id?'active':''}" onclick="selectVersion('${x.id}')"><div class="version-top"><b>${x.id}</b><span class="state ${i===0?'ok':'paused'}">${i===0?'Production':'Archivée'}</span></div><p>${x.description}</p><div class="case-foot"><span>${x.author}</span><span>${x.date}</span></div></button>`).join('')}</div></aside><article class="card"><div class="head"><div><div class="ey">Instantané ${v.id}</div><h2>${v.description}</h2></div><span class="state ${isCurrent?'ok':'paused'}">${isCurrent?'Politique active':'Version archivée'}</span></div><p class="lead">Déployée par ${v.author}, le ${v.date}. Toutes les décisions liées restent consultables dans le journal d’audit.</p><div class="snapshot"><div><small>Mode d’autonomie</small><b>${v.autonomy}</b></div><div><small>Sensibilité moyenne</small><b>${v.avg}%</b></div><div><small>Validation humaine</small><b>Cas critiques</b></div><div><small>Propagation</small><b>3 socles</b></div></div><div class="section-head"><div><h2>Garanties de gouvernance</h2></div></div><div class="detail-list"><div><span>Sanctions définitives</span><b>Humain obligatoire</b></div><div><span>Explication des décisions</span><b>Conservée</b></div><div><span>Journal d’audit</span><b>Non supprimable dans la démo</b></div><div><span>Retour arrière</span><b>Charge un nouveau brouillon</b></div></div><div class="history-note" style="margin-top:14px">Restaurer ne réécrit pas l’historique. Les paramètres de ${v.id} deviennent un nouveau brouillon que vous devez simuler puis déployer.</div><div class="head-actions" style="margin-top:16px"><button class="btn secondary" onclick="compareVersion('${v.id}')">Comparer à la production</button><button class="btn" ${isCurrent?'disabled':''} onclick="restoreVersion('${v.id}')">Restaurer dans le brouillon</button></div></article></div>`;
}
function roadmap(){
  return `<div class="road-hero"><div><div class="ey">Avancement réel · Zwit Control V1.1</div><h1>Roadmap Intelligence</h1><p class="lead">Cette vue décrit uniquement les fonctions présentes dans ce livrable. Aucun développement ne progresse en arrière-plan entre deux versions publiées.</p></div><div class="progress-card"><div class="ey">Progression fonctionnelle</div><b>86%</b><div class="bar"><i></i></div><p class="lead" style="font-size:11px;margin-bottom:0">Version C : simulation, audit explicable, politiques et interconnexion visibles.</p></div></div><div class="road-grid">
  <article class="road-card"><div class="meta"><span>Socle</span><span class="state ok">Livré</span></div><h3>Zwit Control V1</h3>${tasks([['Centre de commandement',100],['Bureaux métiers',100],['Entités et timelines',100]])}</article>
  <article class="road-card"><div class="meta"><span>Version B</span><span class="state ok">Verrouillée</span></div><h3>NOC & Agents</h3>${tasks([['Sept agents IA',100],['Monitoring simulé',100],['Sensibilité par risque',100]])}</article>
  <article class="road-card"><div class="meta"><span>Version C</span><span class="state ok">Livrée</span></div><h3>Simulation & Audit</h3>${tasks([['Simulation avant/après',100],['Dossier IA explicable',100],['Décision humaine',100]])}</article>
  <article class="road-card"><div class="meta"><span>Version C</span><span class="state ok">Livrée</span></div><h3>Gouvernance</h3>${tasks([['Versioning des politiques',100],['Restauration en brouillon',100],['Export d’audit',100]])}</article>
  <article class="road-card"><div class="meta"><span>Version C</span><span class="state ok">Livrée</span></div><h3>Connexion aux socles</h3>${tasks([['Zwit Membres',100],['Zwit Pro',100],['Zwit Control',100]])}</article>
  <article class="road-card"><div class="meta"><span>Version D</span><span class="state paused">À venir</span></div><h3>Automatisation</h3>${tasks([['Workflows conditionnels',0],['Escalades automatiques',0],['Assistant dirigeant',0]])}</article></div>
  <div class="grid g2"><section class="timeline"><div class="ey">Changelog</div><h2>Livraisons vérifiables</h2><div class="log-row"><time>28/07/2026</time><i></i><p><b>Version C — Gouvernance Intelligence</b><small>Simulation, explications, arbitrage humain, versioning et propagation.</small></p></div><div class="log-row"><time>28/07/2026</time><i></i><p><b>Version B — Cockpit Intelligence</b><small>Agents, NOC, monitoring, autonomie et sensibilités.</small></p></div><div class="log-row"><time>27/07/2026</time><i></i><p><b>Zwit Control V1</b><small>Centre de commandement et modules métiers.</small></p></div></section><aside class="timeline"><div class="ey">Prochaine étape</div><h2>Version D</h2><p class="lead">Workflows conditionnels, escalades automatiques configurables et assistant de briefing pour la direction.</p><div class="detail-list"><div><span>Version B</span><b class="ok">Clôturée</b></div><div><span>Version C</span><b class="ok">Testable</b></div><div><span>Version D</span><b>Non commencée</b></div></div></aside></div>`;
}
function tasks(items){return items.map(x=>`<div class="task"><span class="tick ${x[1]===100?'done':x[1]>0?'run':''}"></span><div><b>${x[0]}</b><p>${x[1]===100?'Fonction disponible dans cette version.':x[1]===0?'Non développé dans cette version.':'Fonction partiellement disponible.'}</p></div><span class="percent">${x[1]}%</span></div>`).join('')}
function goTo(view){const b=document.querySelector(`.tab[data-view="${view}"]`);showView(view,b)}
function selectAgent(id){S.selected=id;save();renderCockpit()}
function toggleAgent(id){S.enabled[id]=!S.enabled[id];save();renderCockpit();toastMsg(S.enabled[id]?`${id} réactivé`:`${id} mis en pause`)}
function setAutonomy(value){S.autonomy=value;S.policyDirty=true;save();renderCockpit();toastMsg(`Mode ${value} ajouté au brouillon`)}
function setRisk(id,value,output){S.risks[id].value=Number(value);S.policyDirty=true;output.textContent=value+'%';save()}
function setRiskAction(id,value){S.risks[id].action=value;S.policyDirty=true;save();toastMsg('Action enregistrée dans le brouillon')}
function selectVersion(id){S.selectedVersion=id;save();renderPolicies()}
function restoreVersion(id){const v=S.versions.find(x=>x.id===id);S.autonomy=v.autonomy;const offset=id==='v2.3'?-3:-6;RISKS.forEach(r=>S.risks[r.id]={value:Math.max(50,r.value+offset),action:r.action});S.policyDirty=true;S.simResult=null;save();renderPolicies();renderCockpit();toastMsg(`${id} restaurée dans le brouillon — production inchangée`)}
function compareVersion(id){const v=S.versions.find(x=>x.id===id);toastMsg(`${id} : ${v.avg-S.versions[0].avg} points de sensibilité moyenne`)}
function deployPolicy(){
  if(!S.policyDirty){toastMsg('Aucune modification à déployer');return}
  const next='v2.'+(Number(S.versions[0].id.split('.')[1])+1),avg=Math.round(Object.values(S.risks).reduce((a,b)=>a+b.value,0)/RISKS.length);
  S.versions.forEach(v=>v.status='Archivée');S.versions.unshift({id:next,date:new Date().toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}),author:'Administrateur démo',status:'En production',autonomy:S.autonomy,avg,description:'Politique déployée depuis le simulateur de la Version C.',risks:JSON.parse(JSON.stringify(S.risks))});S.selectedVersion=next;S.policyDirty=false;S.lastPropagation=new Date().toLocaleTimeString('fr-FR');S.stream.unshift([S.lastPropagation,'Moderator',`Politique ${next} déployée et propagée sur trois socles`,'100%']);save();renderAll();toastMsg(`${next} déployée avec succès`)
}
function setSimRisk(id){S.simRisk=id;S.simThreshold=S.risks[id].value;S.simResult=null;save();renderSimulation()}
function setSimThreshold(v,out){S.simThreshold=Number(v);out.textContent=v+'%';S.simResult=null;save()}
function setSimVolume(v){S.simVolume=Number(v);S.simResult=null;save();renderSimulation()}
function runSimulation(){
  const risk=RISKS.find(r=>r.id===S.simRisk),current=S.risks[risk.id].value,target=S.simThreshold,volume=Math.round(risk.volume*S.simVolume/30),factor=(100-target)/(100-current||1),beforeCases=Math.max(8,Math.round(volume*(100-current)/22)),afterCases=Math.max(5,Math.round(beforeCases*factor));
  const beforeAuto=Math.round(beforeCases*.46),afterAuto=Math.round(afterCases*(S.autonomy==='Automatique'?.74:S.autonomy==='Semi-automatique'?.57:.18)),beforeHuman=beforeCases-beforeAuto,afterHuman=afterCases-afterAuto,beforeFalse=Math.round(beforeCases*(101-current)/85),afterFalse=Math.round(afterCases*(101-target)/82),beforeHours=Math.round(beforeAuto*.11),afterHours=Math.round(afterAuto*.11);
  S.simResult={current,target,beforeCases,afterCases,beforeAuto,afterAuto,beforeHuman,afterHuman,beforeFalse,afterFalse,beforeHours,afterHours,deltaCases:signed(afterCases-beforeCases),deltaAuto:signed(afterAuto-beforeAuto),deltaHuman:signed(afterHuman-beforeHuman),deltaFalse:signed(afterFalse-beforeFalse),deltaHours:signed(afterHours-beforeHours),memberChecks:Math.max(1,Math.round(afterCases*.62)),proChecks:Math.max(0,Math.round(afterCases*.09)),label:target<current?'Plus sensible':target>current?'Plus permissif':'Seuil inchangé'};save();renderSimulation();toastMsg('Simulation terminée — production inchangée')
}
function signed(n){return (n>0?'+':'')+n}
function resetSimulation(){S.simRisk='fake';S.simThreshold=S.risks.fake.value;S.simVolume=30;S.simResult=null;save();renderSimulation()}
function saveScenario(){if(!S.simResult){toastMsg('Lancez une simulation avant de la conserver');return}S.savedScenarios.unshift({id:'SIM-'+Date.now(),risk:S.simRisk,threshold:S.simThreshold,volume:S.simVolume,result:S.simResult,savedAt:new Date().toISOString()});save();renderSimulation();toastMsg('Scénario conservé localement')}
function applyScenario(){S.risks[S.simRisk].value=S.simThreshold;S.policyDirty=true;save();renderCockpit();toastMsg('Scénario appliqué au brouillon — non déployé')}
function setAuditFilter(f){S.auditFilter=f;const visible=CASES.find(c=>f==='Tous'||c.severity===f||c.status===f);if(visible)S.selectedCase=visible.id;save();renderAudit()}
function selectCase(id){S.selectedCase=id;save();renderAudit()}
function openCase(id){S.selectedCase=id;save();goTo('audit')}
function openAgentAudit(name){S.auditFilter='Tous';save();goTo('audit');toastMsg(`Journal ${name} ouvert`)}
function decideCase(id,decision){S.caseDecisions[id]=decision;S.stream.unshift([new Date().toLocaleTimeString('fr-FR'),'Moderator',`${id} — décision humaine : ${decision}`,'100%']);save();renderAudit();toastMsg(`Décision enregistrée : ${decision}`)}
function testPropagation(){toastMsg('Test réussi : les trois connecteurs répondent')}
function syncProducts(){S.lastPropagation=new Date().toLocaleTimeString('fr-FR');save();renderEcosystem();toastMsg('Trois socles synchronisés dans la démo')}
function openProductImpact(name){S.impactProduct=name;save();renderEcosystem()}
function closeProductImpact(){S.impactProduct='';save();renderEcosystem()}
function exportAudit(){
  const data={exportedAt:new Date().toISOString(),notice:'Données fictives de démonstration',policy:S.versions[0],cases:CASES.map(c=>({...c,humanDecision:S.caseDecisions[c.id]||c.human}))},blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='velvet-intelligence-audit-demo.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);toastMsg('Export JSON généré')
}
function renderCockpit(){cockpitRoot.innerHTML=cockpit()}
function renderSimulation(){simulationRoot.innerHTML=simulation()}
function renderAudit(){auditRoot.innerHTML=audit()}
function renderEcosystem(){ecosystemRoot.innerHTML=ecosystem()}
function renderPolicies(){policiesRoot.innerHTML=policies()}
function renderRoadmap(){roadmapRoot.innerHTML=roadmap()}
function renderAll(){renderCockpit();renderSimulation();renderAudit();renderEcosystem();renderPolicies();renderRoadmap()}
function pushLiveEvent(){
  const samples=[['Guardian','Contrôle de cohérence terminé pour profil m_'+Math.floor(Math.random()*9000),'95%'],['Moderator','Dossier c_'+Math.floor(Math.random()*900)+' enrichi par six signaux','91%'],['Cupid','Suggestions mises à jour pour '+(120+Math.floor(Math.random()*180))+' membres','94%'],['Host','Prévision de fréquentation recalculée','88%'],['Support','Résumé de conversation généré','97%']];
  const x=samples[Math.floor(Math.random()*samples.length)],now=new Date().toLocaleTimeString('fr-FR');S.stream.unshift([now,x[0],x[1],x[2]]);S.stream=S.stream.slice(0,24);S.decisions+=1+Math.floor(Math.random()*4);S.queue=Math.max(20,Math.min(58,S.queue+(Math.random()>.52?1:-1)));save();
  if(cockpitView.classList.contains('active')){const el=document.getElementById('stream');if(el)el.innerHTML=streamRows();const d=document.getElementById('decisionKpi'),q=document.getElementById('queueKpi');if(d)d.textContent=S.decisions.toLocaleString('fr-FR');if(q)q.textContent=S.queue}
}
renderAll();setInterval(pushLiveEvent,3500);
</script>
