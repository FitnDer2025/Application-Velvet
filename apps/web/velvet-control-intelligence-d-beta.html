.road-hero{display:flex;justify-content:space-between;gap:20px;align-items:end}.progress-card{min-width:280px;border:1px solid var(--line);border-radius:20px;padding:18px;background:#ffffff06}.progress-card b{font-size:38px;color:var(--gold)}.bar{height:9px;border-radius:99px;background:#ffffff10;overflow:hidden;margin-top:11px}.bar i{display:block;height:100%;width:96%;background:linear-gradient(90deg,var(--wine),var(--gold))}.road-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:22px 0}.road-card{border:1px solid var(--line);border-radius:20px;padding:17px;background:#ffffff04}.road-card h3{margin:7px 0 12px}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:10px}.task{display:grid;grid-template-columns:17px 1fr auto;gap:8px;padding:10px 0;border-top:1px solid #ffffff0d}.task p{margin:3px 0;color:var(--muted);font-size:10px;line-height:1.4}.tick{width:15px;height:15px;border-radius:50%;border:1px solid var(--line)}.tick.done{background:var(--green);border-color:var(--green);box-shadow:inset 0 0 0 4px #171719}.tick.run{background:var(--orange);border-color:var(--orange);box-shadow:inset 0 0 0 4px #171719}.percent{font-size:10px;color:var(--gold)}.timeline{border:1px solid var(--line);border-radius:20px;padding:18px;background:#ffffff04}.log-row{display:grid;grid-template-columns:95px 12px 1fr;gap:9px}.log-row time{color:var(--muted);font-size:10px;padding-top:3px}.log-row i{width:8px;height:8px;border-radius:50%;background:var(--gold);margin-top:4px;position:relative}.log-row i:after{content:"";position:absolute;left:3px;top:11px;width:1px;height:40px;background:var(--line)}.log-row:last-child i:after{display:none}.log-row p{margin:0 0 17px;font-size:12px}.log-row small{display:block;color:var(--muted);margin-top:3px}.toast{position:fixed;right:20px;bottom:20px;z-index:100;border:1px solid #c6a96a55;border-radius:14px;background:#1b1b1f;padding:13px 17px;opacity:0;transform:translateY(10px);transition:.2s}.toa <body>
<div class="shell">
  <header class="top">

      <button class="tab active" data-view="workflows" onclick="showView('workflows',this)">Workflows D</button>

    <section id="briefingView" class="page"><div id="briefingRoot" class="wrap"></div></section>

</div>
<div id="toast" class="toast" role="status"></div>
<script>
const WORKFLOWS=[
 {id:'wf-consent',name:'Protection du consentement',desc:'Sécurise immédiatement les situations critiques sans appliquer de sanction définitive.',trigger:'Score consentement ≥ 97%',condition:'Récidive OU refus explicite',action:'Masquer, notifier, créer un dossier',owner:'Trust & Safety',runs:184,success:99.2,active:true},
 {id:'wf-fake',name:'Vérification faux profil',desc:'Regroupe les signaux et demande une vérification lorsque la cohérence devient insuffisante.',trigger:'Score faux profil ≥ 92%',condition:'2 signaux concordants minimum',action:'Limiter la visibilité, demander une vidéo',owner:'Modération',runs:268,success:96.8,active:true},
 {id:'wf-pro',name:'Alerte remplissage Pro',desc:'Aide les établissements à agir lorsqu’une soirée prend du retard sur sa trajectoire.',trigger:'Remplissage prévisionnel < 65%',condition:'Événement dans moins de 7 jours',action:'Alerter le Pro, préparer une campagne',owner:'Zwit Pro',runs:43,success:91.4,active:true},

 {id:'wf-churn',name:'Prévention du churn',desc:'Identifie une baisse d’engagement et propose une action adaptée sans message automatique intrusif.',trigger:'Engagement en baisse de 45%',condition:'Premium depuis plus de 60 jours',action:'Créer une opportunité de rétention',owner:'Growth',runs:127,success:88.7,active:false}

 {name:'Avis établissement critique',desc:'Détecter, synthétiser et router un avis sensible.',trigger:'Avis ≤ 2 étoiles',condition:'Contient un signal sécurité ou consentement',action:'Masquer provisoirement et assigner à l’équipe Pro',owner:'Équipe Pro'},
 {name:'Photo à vérifier',desc:'Contrôler un média ambigu sans bloquer le membre définitivement.',trigger:'Score média à risque ≥ 85%',condition:'Confiance insuffisante pour une décision automatique',action:'Suspendre la publication et créer un dossier',owner:'Modération'},
 {name:'Incident paiement',desc:'Regrouper les signaux d’un paiement litigieux.',trigger:'Litige ou remboursement supérieur à 500 €',condition:'Récidive ou incohérence de compte',action:'Alerter Finance et préparer la chronologie',owner:'Finance'}

 {id:'esc-pro',name:'Incident établissement',when:'3 signalements liés en moins de 2 h',from:'Host',to:'Équipe Pro',sla:'30 min',width:54,active:true},

 {id:'ESC-486',type:'Établissement',subject:'Soirée ev_821',age:'18:09',team:'Équipe Pro',status:'En cours'},
 {id:'ESC-481',type:'Support',subject:'Ticket T-2841',age:'31:22',team:'Support N2',status:'En cours'},
 {id:'ESC-478',type:'Technique',subject:'Modèle vision',age:'04:03',team:'Astreinte Tech',status:'Urgent'}

const EXEC_ANSWERS=[

 {keys:['pro','établissement','club'],text:'Zwit Pro compte 4 établissements nécessitant un suivi. Deux ont un remplissage inférieur à leur trajectoire, un n’a pas répondu à ses avis récents et un dossier de validation est incomplet. Le potentiel le plus immédiat concerne les campagnes de dernière minute.'},
 {keys:['sécurité','signalement','modération'],text:'Les signalements augmentent de 12 % dans les Hauts-de-France, mais leur gravité moyenne reste stable. Deux dossiers de consentement sont prioritaires. Guardian recommande une revue humaine avant toute action durable.'},
 {keys:['revenu','ca','chiffre'],text:'Le chiffre d’affaires mensuel simulé atteint 184 320 €, en hausse de 8,6 %. Le principal moteur est Zwit Pro, tandis que la conversion Premium membre mérite une action corrective cette semaine.'}
];
const BASE_RUNS=[
 ['08:43:12','Protection du consentement','Dossier AI-2841 créé, validation humaine requise','Réussi'],
 ['08:41:56','Alerte remplissage Pro','Campagne préparée pour l’événement ev_821','Réussi'],
 ['08:39:21','Priorisation support','Ticket T-2841 assigné au Support N2','Réussi'],
 ['08:35:07','Vérification faux profil','Vérification vidéo demandée au profil m_7281','Réussi'],
 ['08:28:44','Prévention du churn','Workflow désactivé : aucune action','Ignoré']

let S=JSON.parse(localStorage.getItem('velvetIntelligenceD')||'{}');
S.customWorkflows=S.customWorkflows||[];S.showTemplates=S.showTemplates||false;S.selectedWorkflow=S.selectedWorkflow||WORKFLOWS[0].id;S.workflowActive=S.workflowActive||Object.fromEntries(WORKFLOWS.map(w=>[w.id,w.active]));S.workflowDrafts=S.workflowDrafts||{};S.runs=S.runs||BASE_RUNS;S.escalationActive=S.escalationActive||Object.fromEntries(ESCALATIONS.map(e=>[e.id,e.active]));S.queueTeams=S.queueTeams||Object.fromEntries(QUEUE.map(q=>[q.id,q.team]));S.queueStatus=S.queueStatus||{};S.briefAnswer=S.briefAnswer||'';S.planDone=S.planDone||{};S.lastRun=S.lastRun||'08:43:12';
const save=()=>localStorage.setItem('velvetIntelligenceD',JSON.stringify(S));
const allWorkflows=()=>[...WORKFLOWS,...S.customWorkflows];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function toastMsg(text){toast.textContent=text;toast.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>toast.classList.remove('show'),2200)}
function showView(view,button){
 document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===button));controlView.style.display=view==='control'?'block':'none';intelligenceView.style.display=view==='intelligence'?'block':'none';
 ['workflows','escalations','briefing','roadmap'].forEach(x=>document.getElementById(x+'View').classList.toggle('active',x===view));
 if(view==='workflows')renderWorkflows();if(view==='escalations')renderEscalations();if(view==='briefing')renderBriefing();if(view==='roadmap')renderRoadmap();
}
function goTo(view){const b=document.querySelector(`.tab[data-view="${view}"]`);showView(view,b)}
function statusClass(v){return v==='Urgent'?'critical':v==='En cours'?'warning':v==='Réussi'?'ok':'paused'}
function workflows(){
 const list=allWorkflows(),w=list.find(x=>x.id===S.selectedWorkflow)||list[0],d=S.workflowDrafts[w.id]||w;
 return `<div class="head"><div><div class="ey">Version D · Données et exécutions fictives</div><h1>Workflow Automation</h1><p class="lead">Transformez les décisions de Zwit Intelligence en parcours contrôlés. Les actions irréversibles et les sanctions définitives restent exclues de l’automatisation.</p></div><div class="head-actions"><button class="btn secondary" onclick="openTemplates()">Bibliothèque de modèles</button><button class="btn" onclick="createWorkflow()">Créer un workflow</button></div></div>
 <div class="kpis"><div class="kpi"><small>Workflows actifs</small><b>${Object.values(S.workflowActive).filter(Boolean).length}</b><span class="trend">sur ${list.length}</span></div><div class="kpi"><small>Exécutions aujourd’hui</small><b>938</b><span class="trend">+16,2%</span></div><div class="kpi"><small>Taux de réussite</small><b>98,1%</b><span class="trend">+0,6 pt</span></div><div class="kpi"><small>Temps économisé</small><b>41 h</b><span class="trend">Aujourd’hui</span></div><div class="kpi"><small>Validations humaines</small><b>67</b><span class="trend warn">14 urgentes</span></div><div class="kpi"><small>Dernière exécution</small><b style="font-size:21px">${S.lastRun}</b><span class="trend">Orchestrateur actif</span></div></div>
 ${S.showTemplates?`<section class="card" style="margin-bottom:14px"><div class="section-head" style="margin-top:0"><div><div class="ey">Bibliothèque métier</div><h2>Démarrer avec un modèle</h2><p>Le modèle devient un nouveau brouillon entièrement modifiable.</p></div><button class="btn ghost" onclick="openTemplates()">Fermer</button></div><div class="grid g3">${TEMPLATES.map((t,i)=>`<button class="workflow" onclick="useTemplate(${i})"><div class="workflow-top"><b>${t.name}</b><span class="state info">Modèle</span></div><p>${t.desc}</p><div class="workflow-foot"><span>${t.owner}</span><span>Utiliser →</span></div></button>`).join('')}</div></section>`:''}
 <div class="workflow-layout"><aside class="card"><div class="section-head" style="margin-top:0"><div><div class="ey">Automatisations</div><h2>${list.length} workflows</h2></div></div><div class="workflow-list">${list.map(x=>`<button class="workflow ${x.id===w.id?'active':''}" onclick="selectWorkflow('${x.id}')"><div class="workflow-top"><b>${x.name}</b><span class="state ${S.workflowActive[x.id]?'ok':'paused'}">${S.workflowActive[x.id]?'Actif':'Pause'}</span></div><p>${x.desc}</p><div class="workflow-foot"><span>${x.owner}</span><span>${x.runs} exécutions</span></div></button>`).join('')}</div></aside>
 <section><div class="card"><div class="head"><div><div class="ey">Éditeur visuel · ${w.id}</div><h2>${w.name}</h2></div><button class="toggle ${S.workflowActive[w.id]?'on':''}" onclick="toggleWorkflow('${w.id}')" aria-label="Activer ou désactiver"></button></div><p class="lead">${w.desc}</p><div class="builder">
 ${builderNode('1','Déclencheur','⚡','Quand le workflow doit démarrer','trigger',d.trigger)}
 ${builderNode('2','Conditions','◇','Les critères qui doivent être vérifiés','condition',d.condition)}
 ${builderNode('3','Actions','→','Ce que Zwit peut exécuter automatiquement','action',d.action)}
 <div class="node"><div class="node-head"><div class="node-title"><span class="node-icon">✓</span><div><div class="ey">Étape 4</div><b>Contrôle humain</b></div></div><span class="state ok">Obligatoire si critique</span></div><p>Les fermetures de compte, bannissements définitifs et suppressions irréversibles ne peuvent pas être exécutés par ce workflow.</p></div></div><div class="head-actions" style="margin-top:15px"><button class="btn ghost" onclick="saveWorkflowDraft('${w.id}')">Enregistrer le brouillon</button><button class="btn secondary" onclick="dryRun('${w.id}')">Tester sans agir</button><button class="btn" onclick="publishWorkflow('${w.id}')">Publier</button></div></div></section></div>
 <div class="section-head"><div><h2>Journal d’exécution</h2><p>Chaque étape est conservée avec son résultat.</p></div><button class="btn secondary" onclick="exportRuns()">Exporter</button></div><section class="card run-log">${S.runs.slice(0,10).map(r=>`<div class="run"><time>${r[0]}</time><p><b>${r[1]}</b><br><small>${r[2]}</small></p><span class="state ${statusClass(r[3])}">${r[3]}</span></div>`).join('')}</section>`;
}
function builderNode(n,title,icon,copy,key,value){return `<div class="node"><div class="node-head"><div class="node-title"><span class="node-icon">${icon}</span><div><div class="ey">Étape ${n}</div><b>${title}</b></div></div><span class="state info">Configurable</span></div><p>${copy}</p><div class="field"><label>${title}</label><input id="field-${key}" value="${esc(value)}" oninput="updateDraftField('${key}',this.value)"></div></div>`}
function escalations(){
 return `<div class="head"><div><div class="ey">Routage intelligent · Décision humaine préservée</div><h1>Centre d’escalade</h1><p class="lead">Zwit Intelligence détecte l’urgence, rassemble le contexte et route le dossier. L’équipe destinataire conserve la responsabilité de la décision sensible.</p></div><div class="head-actions"><button class="btn secondary" onclick="simulateEscalation()">Simuler une alerte</button><button class="btn" onclick="saveEscalations()">Déployer les règles</button></div></div>
 <div class="kpis"><div class="kpi"><small>Escalades ouvertes</small><b>14</b><span class="trend warn">2 critiques</span></div><div class="kpi"><small>SLA respecté</small><b>96,4%</b><span class="trend">+2,1 pt</span></div><div class="kpi"><small>Temps médian</small><b>08:42</b><span class="trend">−3 min</span></div><div class="kpi"><small>Auto-routées</small><b>91%</b><span class="trend">Ce mois</span></div><div class="kpi"><small>Réassignations</small><b>3,8%</b><span class="trend">Faible</span></div><div class="kpi"><small>Human Gate</small><b>Actif</b><span class="trend">100% critiques</span></div></div>
 <div class="section-head"><div><h2>Règles d’escalade</h2><p>Activation indépendante et SLA par domaine.</p></div></div><div class="escalation-grid">${ESCALATIONS.map(e=>`<article class="escalation"><div class="escalation-head"><span class="state ${S.escalationActive[e.id]?'ok':'paused'}">${S.escalationActive[e.id]?'Active':'Pause'}</span><button class="toggle ${S.escalationActive[e.id]?'on':''}" onclick="toggleEscalation('${e.id}')" aria-label="Activer ${e.name}"></button></div><h3>${e.name}</h3><p>${e.when}</p><div class="route"><div>${e.from}</div><span>→</span><div>${e.to}</div></div><small class="lead">SLA cible : <b>${e.sla}</b></small><div class="sla"><i style="width:${e.width}%"></i></div></article>`).join('')}</div>
 <div class="section-head"><div><h2>File active</h2><p>Réaffectation et résolution sans popup.</p></div><span class="state critical">2 urgences</span></div><section class="card queue">${QUEUE.map(q=>`<div class="queue-row"><b>${q.id}</b><p>${q.type} · ${q.subject}<small>Ouverte depuis ${q.age}</small></p><select onchange="assignQueue('${q.id}',this.value)">${['Trust & Safety','Modération','Équipe Pro','Support N2','Astreinte Tech','Finance'].map(t=>`<option ${t===(S.queueTeams[q.id]||q.team)?'selected':''}>${t}</option>`).join('')}</select><button class="state ${statusClass(S.queueStatus[q.id]||q.status)}" onclick="resolveQueue('${q.id}')">${S.queueStatus[q.id]||q.status}</button></div>`).join('')}</section>`;
}
function briefing(){
 const priorities=[
  ['Sécuriser deux dossiers de consentement','Trust & Safety','Échéance 09:30'],
  ['Relancer quatre établissements sous leur trajectoire','Zwit Pro','Potentiel +7%'],
  ['Corriger la conversion Premium à J+7','Growth','−1,8 point'],
  ['Surveiller la latence du modèle vision','Technique','P95 +18%']
 ];
 return `<div class="head"><div><div class="ey">Assistant dirigeant · Synthèse fictive du 28 juillet 2026</div><h1>Bonjour Cyril.</h1><p class="lead">Voici ce qui mérite réellement ton attention aujourd’hui, sans te faire parcourir dix tableaux de bord.</p></div><div class="head-actions"><button class="btn secondary" onclick="exportBriefing()">Exporter le briefing</button><button class="btn" onclick="refreshBriefing()">Actualiser l’analyse</button></div></div>
 <div class="signal-grid" style="margin-top:20px"><div class="signal"><small>Nouveaux membres</small><b>243</b><span class="trend">+12%</span></div><div class="signal"><small>CA mensuel simulé</small><b>184 320 €</b><span class="trend">+8,6%</span></div><div class="signal"><small>Conversion Premium</small><b>6,8%</b><span class="trend warn">−1,8 pt</span></div><div class="signal"><small>Santé Zwit</small><b>99,4%</b><span class="trend">Stable</span></div></div>
 <div class="brief-grid" style="margin-top:14px"><main><section class="brief-hero"><div class="ey">Synthèse exécutive</div><blockquote>La croissance reste solide avec <b>243 nouveaux membres</b> et un chiffre d’affaires en hausse. Le point faible est la conversion Premium des nouveaux couples. Deux dossiers de consentement nécessitent une validation humaine rapide et quatre établissements peuvent encore améliorer leur remplissage cette semaine.</blockquote><div class="head-actions"><button class="btn" onclick="buildActionPlan()">Transformer en plan d’action</button><button class="btn secondary" onclick="goTo('escalations')">Voir les urgences</button></div></section>
 <div class="section-head"><div><h2>Priorités recommandées</h2><p>Classées par impact et urgence.</p></div></div><section class="card">${priorities.map((p,i)=>`<div class="priority"><div class="priority-index">${i+1}</div><div><h3>${p[0]}</h3><p>${p[1]} · ${p[2]}</p></div><span class="state ${i===0?'critical':i===1?'warning':'info'}">${['Immédiat','Aujourd’hui','Cette semaine','Surveiller'][i]}</span></div>`).join('')}</section>
 <div class="section-head"><div><h2>Interroger Analyst</h2><p>Réponses contextualisées sur les données fictives de la démo.</p></div></div><section class="card"><div class="ask"><input id="execQuestion" placeholder="Ex. Pourquoi la conversion Premium baisse-t-elle ?"><button class="btn" onclick="askExecutive()">Analyser</button></div>${S.briefAnswer?`<p class="answer">${S.briefAnswer}</p>`:''}</section></main>
 <aside class="card"><div class="ey">Plan du jour</div><h2>Décisions à piloter</h2><div class="plan-list">${priorities.map((p,i)=>`<label class="plan-item"><input type="checkbox" ${S.planDone[i]?'checked':''} onchange="togglePlan(${i},this.checked)"><p>${p[0]}<br><small>${p[1]}</small></p><span class="state ${S.planDone[i]?'ok':'paused'}">${S.planDone[i]?'Fait':'À faire'}</span></label>`).join('')}</div><div class="section-head"><div><h2>Agents mobilisés</h2></div></div><div class="grid g2">${[['Guardian','Sécurité'],['Analyst','Business'],['Host','Pro'],['Moderator','Dossiers']].map(a=>`<div class="signal"><small>${a[1]}</small><b style="font-size:15px">${a[0]}</b><span class="trend">Actif</span></div>`).join('')}</div><button class="btn secondary" style="width:100%;margin-top:15px" onclick="shareBriefing()">Partager au COMEX</button></aside></div>`;
}
function roadmap(){
 return `<div class="road-hero"><div><div class="ey">Avancement réel · Zwit Control V1.1</div><h1>Roadmap Intelligence</h1><p class="lead">La Version D s’appuie sur la C verrouillée. Cette page décrit uniquement les fonctions présentes dans le livrable publié.</p></div><div class="progress-card"><div class="ey">Progression fonctionnelle</div><b>96%</b><div class="bar"><i></i></div><p class="lead" style="font-size:11px;margin-bottom:0">V1.1 fonctionnelle : gouvernance, automatisations et pilotage exécutif.</p></div></div>
 <div class="road-grid"><article class="road-card"><div class="meta"><span>Version B</span><span class="state ok">Verrouillée</span></div><h3>NOC & Agents</h3>${tasks([['Sept agents IA',100],['Monitoring simulé',100],['Sensibilité par risque',100]])}</article><article class="road-card"><div class="meta"><span>Version C</span><span class="state ok">Verrouillée</span></div><h3>Gouvernance</h3>${tasks([['Simulation avant/après',100],['Audit explicable',100],['Versioning',100]])}</article><article class="road-card"><div class="meta"><span>Version D</span><span class="state ok">Livrée</span></div><h3>Automatisation</h3>${tasks([['Workflows conditionnels',100],['Tests sans action',100],['Journal d’exécution',100]])}</article><article class="road-card"><div class="meta"><span>Version D</span><span class="state ok">Livrée</span></div><h3>Escalades</h3>${tasks([['Routage intelligent',100],['SLA et réaffectation',100],['Human Gate',100]])}</article><article class="road-card"><div class="meta"><span>Version D</span><span class="state ok">Livrée</span></div><h3>Direction</h3>${tasks([['Briefing exécutif',100],['Questions contextuelles',100],['Plan d’action',100]])}</article><article class="road-card"><div class="meta"><span>Finalisation</span><span class="state warning">Prochaine</span></div><h3>V1.1 Release</h3>${tasks([['Tests navigateur étendus',75],['Backend réel',0],['Authentification réelle',0]])}</article></div>
 <div class="grid g2"><section class="timeline"><div class="ey">Changelog</div><h2>Livraisons vérifiables</h2><div class="log-row"><time>28/07/2026</time><i></i><p><b>Version D — Orchestration</b><small>Workflows, escalades, files, briefing direction et plan d’action.</small></p></div><div class="log-row"><time>28/07/2026</time><i></i><p><b>Version C — Gouvernance</b><small>Simulation, explications, arbitrage humain et versioning.</small></p></div><div class="log-row"><time>28/07/2026</time><i></i><p><b>Version B — Cockpit</b><small>Agents, NOC, monitoring et sensibilités.</small></p></div></section><aside class="timeline"><div class="ey">État du produit</div><h2>Version D testable</h2><p class="lead">La prochaine étape n’est plus une nouvelle maquette fonctionnelle : c’est la préparation d’une architecture réelle avec API, base de données, authentification, droits et journaux durables.</p><div class="field-grid"><div class="signal"><small>B</small><b style="font-size:15px">Clôturée</b></div><div class="signal"><small>C</small><b style="font-size:15px">Clôturée</b></div><div class="signal"><small>D</small><b style="font-size:15px">Testable</b></div><div class="signal"><small>Suite</small><b style="font-size:15px">Industrialisation</b></div></div></aside></div>`;
}
function tasks(items){return items.map(x=>`<div class="task"><span class="tick ${x[1]===100?'done':x[1]>0?'run':''}"></span><div><b>${x[0]}</b><p>${x[1]===100?'Fonction disponible dans cette version.':x[1]===0?'Non développé dans cette démo.':'Contrôles complémentaires à terminer.'}</p></div><span class="percent">${x[1]}%</span></div>`).join('')}
function selectWorkflow(id){S.selectedWorkflow=id;save();renderWorkflows()}
function toggleWorkflow(id){S.workflowActive[id]=!S.workflowActive[id];save();renderWorkflows();toastMsg(S.workflowActive[id]?'Workflow activé':'Workflow mis en pause')}
function updateDraftField(key,value){const id=S.selectedWorkflow,w=allWorkflows().find(x=>x.id===id);S.workflowDrafts[id]=Object.assign({},w,S.workflowDrafts[id]||{}, {[key]:value});save()}
function saveWorkflowDraft(id){save();toastMsg(`Brouillon ${id} enregistré localement`)}
function dryRun(id){const w=allWorkflows().find(x=>x.id===id),now=new Date().toLocaleTimeString('fr-FR');S.runs.unshift([now,w.name,'Test réussi sur 128 événements fictifs — aucune action appliquée','Réussi']);S.lastRun=now;save();renderWorkflows();toastMsg('Test terminé sans impact')}
function publishWorkflow(id){S.workflowActive[id]=true;const w=allWorkflows().find(x=>x.id===id),now=new Date().toLocaleTimeString('fr-FR');S.runs.unshift([now,w.name,'Nouvelle version publiée dans l’orchestrateur simulé','Réussi']);S.lastRun=now;save();renderWorkflows();toastMsg(`${w.name} publié`)}
function createWorkflow(){const id='wf-custom-'+Date.now(),w={id,name:'Nouveau workflow',desc:'Brouillon personnalisé à configurer.',trigger:'Choisir un déclencheur',condition:'Définir les conditions',action:'Définir les actions autorisées',owner:'Non assigné',runs:0,success:0,active:false};S.customWorkflows.push(w);S.workflowActive[id]=false;S.selectedWorkflow=id;S.workflowDrafts[id]={...w};save();renderWorkflows();toastMsg('Nouveau workflow créé')}
function openTemplates(){S.showTemplates=!S.showTemplates;save();renderWorkflows()}
function useTemplate(index){const t=TEMPLATES[index],id='wf-template-'+Date.now(),w={id,name:t.name,desc:t.desc,trigger:t.trigger,condition:t.condition,action:t.action,owner:t.owner,runs:0,success:0,active:false};S.customWorkflows.push(w);S.workflowActive[id]=false;S.selectedWorkflow=id;S.workflowDrafts[id]={...w};S.showTemplates=false;save();renderWorkflows();toastMsg(`Modèle « ${t.name} » ajouté`)}
function exportRuns(){download('velvet-workflows-demo.json',{notice:'Données fictives',runs:S.runs,workflows:WORKFLOWS})}
function toggleEscalation(id){S.escalationActive[id]=!S.escalationActive[id];save();renderEscalations();toastMsg(S.escalationActive[id]?'Règle activée':'Règle mise en pause')}
function assignQueue(id,team){S.queueTeams[id]=team;save();toastMsg(`${id} réaffectée à ${team}`)}
function resolveQueue(id){S.queueStatus[id]='Résolu';save();renderEscalations();toastMsg(`${id} clôturée avec journalisation`)}
function simulateEscalation(){const now=new Date().toLocaleTimeString('fr-FR');toastMsg(`Simulation ${now} : routage vers Trust & Safety en 1,2 s`)}
function saveEscalations(){save();toastMsg('Règles d’escalade déployées dans la démo')}
function askExecutive(){const q=(document.getElementById('execQuestion')?.value||'').toLowerCase();if(!q){toastMsg('Saisissez une question');return}const hit=EXEC_ANSWERS.find(a=>a.keys.some(k=>q.includes(k)));S.briefAnswer=hit?hit.text:'Les données fictives ne montrent pas d’anomalie majeure sur ce point. Je recommande de préciser la période ou le socle concerné pour obtenir une analyse plus actionnable.';save();renderBriefing()}
function togglePlan(i,done){S.planDone[i]=done;save();renderBriefing();toastMsg(done?'Action marquée comme réalisée':'Action remise à faire')}
function buildActionPlan(){[0,1,2,3].forEach(i=>{if(S.planDone[i]===undefined)S.planDone[i]=false});save();toastMsg('Plan d’action exécutif préparé')}
function refreshBriefing(){toastMsg('Briefing actualisé sur les dernières données fictives')}
function shareBriefing(){toastMsg('Version de partage COMEX préparée')}
function exportBriefing(){download('velvet-briefing-direction-demo.json',{notice:'Données fictives',date:'2026-07-28',kpis:{members:243,revenue:184320,premiumConversion:6.8,health:99.4},plan:S.planDone})}
function download(name,data){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);toastMsg('Export JSON généré')}
function renderWorkflows(){workflowsRoot.innerHTML=workflows()}
function renderEscalations(){escalationsRoot.innerHTML=escalations()}
function renderBriefing(){briefingRoot.innerHTML=briefing()}
function renderRoadmap(){roadmapRoot.innerHTML=roadmap()}
function pushRun(){if(!Object.values(S.workflowActive).some(Boolean))return;const active=allWorkflows().filter(w=>S.workflowActive[w.id]),w=active[Math.floor(Math.random()*active.length)],now=new Date().toLocaleTimeString('fr-FR');S.runs.unshift([now,w.name,'Exécution simulée terminée avec traçabilité complète','Réussi']);S.runs=S.runs.slice(0,18);S.lastRun=now;save();if(workflowsView.classList.contains('active'))renderWorkflows()}
renderWorkflows();renderEscalations();renderBriefing();renderRoadmap();setInterval(pushRun,7000);
</script>
