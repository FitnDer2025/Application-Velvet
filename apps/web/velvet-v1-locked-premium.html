<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zwit V1 Premium verrouillée</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>:root{--bg:#09090c;--p:#151519;--p2:#1d1d23;--line:#ffffff18;--txt:#f7f2ee;--muted:#aaa4a1;--gold:#c9a86a;--wine:#742642;--green:#5ebc91}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#74264235,transparent 38rem),var(--bg);color:var(--txt);font-family:DM Sans,sans-serif}button,input,textarea,select{font:inherit}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{height:100vh;position:sticky;top:0;border-right:1px solid var(--line);padding:24px 16px;background:#0c0c10f2;z-index:20}.brand{font:600 24px Playfair Display;color:var(--gold);letter-spacing:.24em;padding:8px}.nav{display:grid;gap:6px;margin-top:20px}.nav button{border:0;background:transparent;color:var(--muted);padding:13px 14px;border-radius:14px;text-align:left;cursor:pointer}.nav button.active,.nav button:hover{background:#ffffff0d;color:#fff}.me{position:absolute;bottom:18px;left:16px;right:16px;padding:14px;border:1px solid var(--line);border-radius:16px;background:#ffffff08;cursor:pointer}.top{height:72px;position:sticky;top:0;z-index:15;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--line);background:#0b0b0ddd;backdrop-filter:blur(16px)}.search{width:min(520px,55vw);border:1px solid var(--line);border-radius:999px;background:#17171c;color:white;padding:12px 16px}.content{padding:26px}.eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}h1,h2,h3{font-family:Playfair Display}.hero{font-size:clamp(42px,5vw,68px);line-height:1;margin:8px 0}.muted{color:var(--muted)}.grid{display:grid;gap:17px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.card{border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,#ffffff0c,#ffffff04);overflow:hidden}.pad{padding:20px}.cover{height:250px;background-size:cover;background-position:center;position:relative}.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,#000e)}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.btn{border:0;border-radius:999px;padding:11px 16px;color:white;background:linear-gradient(135deg,#93375b,var(--wine));cursor:pointer}.btn.secondary{background:transparent;color:var(--gold);border:1px solid #c9a86a66}.round{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#18181d;color:white;cursor:pointer}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:11px}.tabs{display:flex;gap:8px;overflow:auto;padding:15px 0}.tabs button{white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:10px 14px;background:#17171c;color:var(--muted);cursor:pointer}.tabs button.active{color:var(--gold);border-color:#c9a86a77;background:#c9a86a0d}.profileHero{min-height:440px;border-radius:26px;background-size:cover;background-position:center;position:relative;overflow:hidden}.profileHero:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 22%,#000f)}.heroCopy{position:absolute;left:28px;right:28px;bottom:26px;z-index:2}.profile-switch{display:flex;gap:10px;margin:18px 0}.profile-switch button{flex:1;padding:14px;border-radius:16px;border:1px solid var(--line);background:#17171c;color:var(--muted);cursor:pointer}.profile-switch button.active{color:white;border-color:#c9a86a88;background:#c9a86a12}.gallery{display:grid;grid-template-columns:2fr 1fr 1fr;grid-auto-rows:170px;gap:9px}.gallery div{border-radius:15px;background-size:cover;background-position:center;cursor:pointer}.gallery div:first-child{grid-row:span 2}.notice{padding:14px;border:1px solid #c9a86a55;border-radius:14px;background:#c9a86a0c}.mapwrap{display:grid;grid-template-columns:1fr 320px;gap:16px}.map{height:650px;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:#202027}.resultlist{height:650px;overflow:auto}.result{padding:14px;border-bottom:1px solid var(--line);cursor:pointer}.result:hover{background:#ffffff0a}.photo-marker{width:52px;height:52px;border-radius:50%;border:3px solid var(--gold);object-fit:cover;box-shadow:0 5px 18px #0009}.venue-marker{width:42px;height:42px;border-radius:14px;background:var(--wine);display:grid;place-items:center;border:2px solid #fff;color:white;font-weight:700}.venueHero{min-height:390px;border-radius:26px;background-size:cover;background-position:center;position:relative;overflow:hidden}.venueHero:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 25%,#000f)}.event{display:grid;grid-template-columns:120px 1fr auto;gap:15px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:17px;margin:10px 0}.event img{width:120px;height:90px;object-fit:cover;border-radius:13px}.faces{display:flex}.faces img{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid var(--p);margin-left:-8px}.faces img:first-child{margin-left:0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:6px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:13px;background:#1b1b21;color:white;padding:12px}.person-panel{display:grid;grid-template-columns:220px 1fr;gap:20px}.person-panel img{width:100%;height:280px;object-fit:cover;border-radius:20px}.notif{display:grid;grid-template-columns:54px 1fr auto;gap:14px;align-items:center;padding:15px;border:1px solid var(--line);border-radius:17px;margin:10px 0;background:#ffffff05}.notif img{width:54px;height:54px;border-radius:50%;object-fit:cover}.toast{position:fixed;right:22px;bottom:22px;padding:14px 18px;background:#1d1d23;border:1px solid #c9a86a66;border-radius:14px;opacity:0;transform:translateY(10px);transition:.2s;z-index:60}.toast.show{opacity:1;transform:none}.mobile{display:none}@media(max-width:950px){.g3{grid-template-columns:repeat(2,1fr)}.mapwrap{grid-template-columns:1fr}.resultlist{height:auto;max-height:320px}}@media(max-width:760px){.app{grid-template-columns:1fr}.side{display:none}.top{padding:0 12px}.content{padding:14px 14px 90px}.g2,.g3,.formgrid,.person-panel{grid-template-columns:1fr}.search{width:72vw}.map{height:520px}.gallery{grid-template-columns:1fr 1fr}.mobile{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:#101014f2;border-top:1px solid var(--line);justify-content:space-around;padding:7px}.mobile button{border:0;background:transparent;color:var(--muted);font-size:11px;padding:8px}.event{grid-template-columns:1fr}.event img{width:100%;height:160px}}</style></head><body><div class="app"><aside class="side"><div class="brand">ZWIT</div><nav class="nav" id="nav"></nav><div class="me" data-go="me"><strong>Céline & Cyril</strong><br><small class="muted">Couple vérifié · Trust 88</small></div></aside><main><header class="top"><input class="search" id="globalSearch" placeholder="Rechercher un profil, une ville, une envie…"><button class="round" data-go="notifications">♡</button></header><div class="content" id="content"></div></main></div><div class="mobile" id="mobile"></div><div class="toast" id="toast"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const I={couple:'https://images.unsplash.com/photo-1522673607200-164d1b6ce486?auto=format&fit=crop&w=1400&q=80',woman:'https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=800&q=80',man:'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=800&q=80',couple2:'https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?auto=format&fit=crop&w=1400&q=80',woman2:'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=800&q=80',man2:'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=800&q=80',club:'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=1400&q=80',spa:'https://images.unsplash.com/photo-1540555700478-4be289fbecef?auto=format&fit=crop&w=1400&q=80',room:'https://images.unsplash.com/photo-1611892440504-42a792e24d32?auto=format&fit=crop&w=1400&q=80',party:'https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=1400&q=80'};const profiles=[{id:'af',name:'Aurélie & François',city:'Lille',type:'Couple',compat:91,trust:94,img:I.couple,woman:{name:'Aurélie',age:38,img:I.woman,bio:'Spontanée, bi-curieuse et sensible aux connexions féminines naturelles.',tags:['Bi-curieuse','Spa','Dîner']},man:{name:'François',age:41,img:I.man,bio:'Calme, attentionné et attaché à une séduction respectueuse.',tags:['Mélangisme','Massage','Voyage']},story:'Complices depuis 14 ans, ils recherchent des rencontres sincères, élégantes et sans pression.',search:'Couples complices et femmes seules, 32 à 46 ans, pour échanges suivis.',tags:['Mélangisme','Spa','Trios F'],lat:50.632,lon:3.058},{id:'em',name:'Élodie & Marc',city:'Arras',type:'Couple',compat:86,trust:90,img:I.couple2,woman:{name:'Élodie',age:36,img:I.woman2,bio:'Douce, curieuse et très attachée au feeling.',tags:['Soft','Spa','Femmes']},man:{name:'Marc',age:39,img:I.man2,bio:'Sociable, discret et épicurien.',tags:['Clubs','Dîner','Voyage']},story:'Parents actifs, ils privilégient les relations suivies et les moments simples.',search:'Couples ou femme seule, dans une ambiance bienveillante.',tags:['Massage','Spa','Soft'],lat:50.289,lon:2.776},{id:'cl',name:'Claire',city:'Lens',type:'Femme seule',compat:88,trust:92,img:I.woman,woman:{name:'Claire',age:35,img:I.woman,bio:'Féminine, posée et bi-curieuse.',tags:['Trios F','Dîner','Spa']},story:'Elle aime les couples rassurants et les rencontres élégantes.',search:'Couples respectueux, 35 à 45 ans.',tags:['Trios F','Dîner','Spa'],lat:50.431,lon:2.832}];const venues=[{id:'op',name:'O’Pulsions',type:'Club',city:'Lille',img:I.club,lat:50.626,lon:3.04,desc:'Un lieu convivial et premium, pensé pour les couples et les rencontres respectueuses.',hours:['Vendredi 22h–5h','Samedi 22h–6h'],prices:['Couple : 45 €','Femme seule : offerte','Homme seul : selon soirée'],equip:['Lounge','Piste de danse','Vestiaire','Espaces privés','Bar'],events:[{id:'e1',name:'Nuit Velours',date:'Vendredi 31 juillet · 22h',going:['af','cl']},{id:'e2',name:'White Party',date:'Samedi 8 août · 22h',going:['em']}]},{id:'or',name:'O’Relax',type:'Spa',city:'Hauts-de-France',img:I.spa,lat:50.49,lon:2.86,desc:'Spa libertin avec espaces bien-être, sauna, hammam et soirées thématiques.',hours:['Jeudi 19h–1h','Vendredi 20h–2h','Samedi 20h–3h'],prices:['Couple : 55 €','Femme seule : 20 €'],equip:['Sauna','Hammam','Jacuzzi','Douches','Salon'],events:[{id:'e3',name:'Évasion Spa',date:'Samedi 15 août · 20h',going:['af','em']}]},{id:'lr',name:'Suite Velours',type:'Love room',city:'Arras',img:I.room,lat:50.285,lon:2.77,desc:'Suite privative avec spa, ambiance feutrée et réservation discrète.',hours:['Arrivée dès 18h','Départ avant 11h'],prices:['Nuit : 189 €','Option champagne : 35 €'],equip:['Jacuzzi','Lit king-size','Parking privé','Entrée autonome'],events:[]}];let S=JSON.parse(localStorage.getItem('velvetLockedPremium')||'{}');S.favs=S.favs||[];S.joins=S.joins||[];S.profile=S.profile||{story:'Très complices, fusionnels et profondément amoureux, nous privilégions les connexions sincères et les moments partagés.',search:'Couples et femmes seules, guidés par le feeling, la bienveillance et la sensualité.',celine:'Bi-curieuse, féminine et sensible à une vraie alchimie à trois.',cyril:'Attentionné, discret et attaché au confort de chacun.',privacy:'Localisation approximative'};const save=()=>localStorage.setItem('velvetLockedPremium',JSON.stringify(S));const nav=[['home','Accueil'],['discover','Découvrir'],['maps','Maps'],['conversations','Conversations'],['events','Sorties'],['venues','Établissements'],['notifications','Notifications'],['me','Mon profil']];let current='home',map;const C=document.getElementById('content');function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}function shell(){document.getElementById('nav').innerHTML=nav.map(n=>`<button data-go="${n[0]}" class="${current===n[0]?'active':''}">${n[1]}</button>`).join('');document.getElementById('mobile').innerHTML=nav.slice(0,5).map(n=>`<button data-go="${n[0]}">${n[1]}</button>`).join('')}function go(page,id){current=page;shell();if(page==='member')renderMember(id);else if(page==='venue')renderVenue(id);else renders[page]();window.scrollTo(0,0)}function cards(list=profiles){return list.map(p=>`<article class="card" data-member="${p.id}" style="cursor:pointer"><div class="cover" style="background-image:url('${p.img}')"></div><div class="pad"><div class="row"><div><h3>${p.name}</h3><span class="muted">${p.type} · ${p.city}</span></div><strong style="color:var(--gold)">${p.compat}%</strong></div><p>${p.story}</p><div class="chips">${p.tags.map(t=>`<span class="chip">${t}</span>`).join('')}</div></div></article>`).join('')}const renders={home(){C.innerHTML=`<span class="eyebrow">Votre espace privé</span><h1 class="hero">Bonsoir Céline & Cyril</h1><p class="muted">Des connexions choisies, des lieux élégants et des sorties préparées à deux.</p><div class="grid g3" style="margin-top:24px">${cards()}</div><h2 style="margin-top:34px">Prochaines sorties</h2>${venueEvent(venues[0],venues[0].events[0])}`},discover(){C.innerHTML=`<span class="eyebrow">Compatibilités</span><h1>Découvrir</h1><div class="card pad"><div class="formgrid"><div class="field"><label>Recherche</label><input id="dq" placeholder="Nom, ville, envie…"></div><div class="field"><label>Type</label><select id="dt"><option>Tous</option><option>Couple</option><option>Femme seule</option></select></div></div><div class="field" style="margin-top:12px"><label>Compatibilité minimum <b id="dv">75%</b></label><input id="dc" type="range" min="60" max="95" value="75"></div></div><div id="discoverList" class="grid g3" style="margin-top:18px">${cards()}</div>`;const f=()=>{let q=dq.value.toLowerCase(),t=dt.value,c=+dc.value;dv.textContent=c+'%';discoverList.innerHTML=cards(profiles.filter(p=>(t==='Tous'||p.type===t)&&p.compat>=c&&(p.name+' '+p.city+' '+p.tags.join(' ')).toLowerCase().includes(q)))};dq.oninput=dt.onchange=dc.oninput=f},maps(){C.innerHTML=`<span class="eyebrow">Autour de vous</span><h1>Maps</h1><div class="mapwrap"><div id="map" class="map"><div class="notice" style="margin:20px">Chargement de la carte…</div></div><div class="card resultlist">${profiles.map(p=>`<div class="result" data-member="${p.id}"><b>${p.name}</b><br><small class="muted">${p.city} · ${p.compat}% compatible</small></div>`).join('')}${venues.map(v=>`<div class="result" data-venue="${v.id}"><b>${v.name}</b><br><small class="muted">${v.type} · ${v.city}</small></div>`).join('')}</div></div>`;setTimeout(initMap,50)},conversations(){C.innerHTML=`<span class="eyebrow">Messages</span><h1>Conversations</h1><div class="grid g2">${profiles.map(p=>`<article class="card pad" data-member="${p.id}" style="cursor:pointer"><div class="row"><img src="${p.img}" style="width:64px;height:64px;border-radius:50%;object-fit:cover"><div style="flex:1"><b>${p.name}</b><p class="muted">Cliquez pour ouvrir leur fiche complète et reprendre l’échange.</p></div><button class="btn secondary" data-chat="${p.id}">Ouvrir</button></div></article>`).join('')}</div>`},events(){C.innerHTML=`<span class="eyebrow">Agenda partagé</span><h1>Sorties</h1>${venues.flatMap(v=>v.events.map(e=>venueEvent(v,e))).join('')}`},venues(){C.innerHTML=`<span class="eyebrow">Lieux sélectionnés</span><h1>Établissements</h1><div class="grid g3">${venues.map(v=>`<article class="card" data-venue="${v.id}" style="cursor:pointer"><div class="cover" style="background-image:url('${v.img}')"></div><div class="pad"><h3>${v.name}</h3><p class="muted">${v.type} · ${v.city}</p><p>${v.desc}</p><button class="btn">Voir le mini-site</button></div></article>`).join('')}</div>`},notifications(){C.innerHTML=`<span class="eyebrow">Activité récente</span><h1>Notifications</h1>${[{p:profiles[0],t:'a aimé votre album « Escapade à deux »',a:'Voir le profil'},{p:profiles[1],t:'vous a envoyé un nouveau message',a:'Ouvrir la conversation'},{p:profiles[2],t:'a consulté votre profil',a:'Voir le profil'}].map(n=>`<div class="notif" data-member="${n.p.id}"><img src="${n.p.img}"><div><b>${n.p.name}</b><br><span class="muted">${n.t}</span></div><button class="btn secondary">${n.a}</button></div>`).join('')}<div class="notif" data-venue="op"><img src="${I.club}"><div><b>Nuit Velours</b><br><span class="muted">Deux nouveaux couples participent à cette sortie.</span></div><button class="btn secondary">Voir la sortie</button></div>`},me(){renderMe('couple')}};function venueEvent(v,e){const joined=S.joins.includes(e.id);return `<div class="event"><img src="${v.img}"><div><h3>${e.name}</h3><p class="muted">${v.name} · ${e.date}</p><div class="faces">${e.going.map(id=>{let p=profiles.find(x=>x.id===id);return p?`<img data-member="${p.id}" src="${p.img}" title="${p.name}">`:''}).join('')}</div><small>${e.going.length+(joined?1:0)} participants</small></div><div><button class="btn" data-join="${e.id}">${joined?'Inscrits ✓':'S’inscrire'}</button><br><button class="btn secondary" data-participants="${e.id}" style="margin-top:8px">Voir les participants</button></div></div>`}function renderMember(id,section='overview',persona='couple'){const p=profiles.find(x=>x.id===id);if(!p)return;const isCouple=p.type==='Couple';let who=persona==='woman'?p.woman:persona==='man'?p.man:null;C.innerHTML=`<button class="btn secondary" data-back>← Retour</button><div class="profileHero" style="margin-top:15px;background-image:url('${who?.img||p.img}')"><div class="heroCopy"><span class="eyebrow">${persona==='couple'?p.type:persona==='woman'?'Elle':'Lui'}</span><h1 class="hero">${who?.name||p.name}</h1><p>${who?.bio||p.story}</p><div class="chips">${(who?.tags||p.tags).map(t=>`<span class="chip">${t}</span>`).join('')}</div></div></div>${isCouple?`<div class="profile-switch"><button data-persona="couple" class="${persona==='couple'?'active':''}">Le couple</button><button data-persona="woman" class="${persona==='woman'?'active':''}">${p.woman.name}</button><button data-persona="man" class="${persona==='man'?'active':''}">${p.man.name}</button></div>`:''}<div class="tabs">${['overview','albums','events','reco','activity'].map(x=>`<button data-section="${x}" class="${section===x?'active':''}">${{overview:'Présentation',albums:'Albums',events:'Sorties',reco:'Recommandations',activity:'Activité'}[x]}</button>`).join('')}</div><div id="memberSection">${memberSection(p,section,persona)}</div>`;C.querySelectorAll('[data-persona]').forEach(b=>b.onclick=()=>renderMember(id,section,b.dataset.persona));C.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>renderMember(id,b.dataset.section,persona))}function memberSection(p,s,persona){const who=persona==='woman'?p.woman:persona==='man'?p.man:null;if(s==='overview')return `<div class="grid g2"><div class="card pad"><h2>${who?'À propos':'Notre histoire'}</h2><p>${who?.bio||p.story}</p><h3>Recherche</h3><p>${p.search}</p></div><div class="card pad"><h2>Confiance</h2><p><b>Trust Index ${p.trust}/100</b></p><p>Profil vérifié · recommandations croisées · comportement respectueux.</p><button class="btn" data-chat="${p.id}">Envoyer un message</button></div></div>`;if(s==='albums')return `<h2>Albums</h2><div class="gallery"><div style="background-image:url('${p.img}')"></div><div style="background-image:url('${p.woman?.img||p.img}')"></div><div style="background-image:url('${p.man?.img||p.img}')"></div><div style="background-image:url('${I.spa}')"></div><div style="background-image:url('${I.party}')"></div></div><div class="notice" style="margin-top:15px"><b>Album privé</b><p>Accessible sur demande, avec accord explicite du couple.</p><button class="btn" data-album="${p.id}">Demander l’accès</button></div>`;if(s==='events')return `<h2>Sorties à venir</h2>${venueEvent(venues[0],venues[0].events[0])}<h2>Sorties passées</h2><div class="card pad"><b>Soirée spa confidentielle</b><p class="muted">Mai 2026 · recommandée par 4 membres</p></div>`;if(s==='reco')return `<h2>Recommandations</h2><div class="card pad"><p>« Un couple très respectueux, naturel et agréable. Une belle rencontre sans pression. »</p><b>Élodie & Marc</b></div><div class="card pad" style="margin-top:12px"><p>« Communication claire, discrétion et vraie complicité. »</p><b>Claire</b></div>`;return `<h2>Dernières informations</h2><div class="card pad"><p>Il y a 2 h · a ajouté une nouvelle photo publique.</p><p>Hier · a confirmé sa participation à Nuit Velours.</p><p>Il y a 4 jours · a recommandé O’Relax.</p></div>`}function renderVenue(id,tab='home'){const v=venues.find(x=>x.id===id);C.innerHTML=`<button class="btn secondary" data-back>← Retour</button><div class="venueHero" style="margin-top:15px;background-image:url('${v.img}')"><div class="heroCopy"><span class="eyebrow">${v.type} · ${v.city}</span><h1 class="hero">${v.name}</h1><p>${v.desc}</p><div><button class="btn" data-route="${v.id}">Itinéraire</button> <button class="btn secondary" data-favvenue="${v.id}">Ajouter aux favoris</button></div></div></div><div class="tabs">${['home','agenda','gallery','prices','reviews'].map(x=>`<button data-vtab="${x}" class="${tab===x?'active':''}">${{home:'Accueil',agenda:'Agenda & participants',gallery:'Galerie',prices:'Horaires & tarifs',reviews:'Recommandations'}[x]}</button>`).join('')}</div>${venueTab(v,tab)}`;C.querySelectorAll('[data-vtab]').forEach(b=>b.onclick=()=>renderVenue(id,b.dataset.vtab))}function venueTab(v,t){if(t==='home')return `<div class="grid g2"><div class="card pad"><h2>Le lieu</h2><p>${v.desc}</p><h3>Équipements</h3><div class="chips">${v.equip.map(x=>`<span class="chip">${x}</span>`).join('')}</div></div><div class="card pad"><h2>Préparer votre visite</h2><p>Réservation discrète et confirmation immédiate dans cette V1.</p><button class="btn" data-book="${v.id}">Réserver</button></div></div>`;if(t==='agenda')return `<h2>Agenda</h2>${v.events.length?v.events.map(e=>venueEvent(v,e)).join(''):'<div class="notice">Aucun événement public pour le moment.</div>'}`;if(t==='gallery')return `<h2>Galerie</h2><div class="gallery"><div style="background-image:url('${v.img}')"></div><div style="background-image:url('${I.party}')"></div><div style="background-image:url('${I.spa}')"></div><div style="background-image:url('${I.room}')"></div></div>`;if(t==='prices')return `<div class="grid g2"><div class="card pad"><h2>Horaires</h2>${v.hours.map(x=>`<p>${x}</p>`).join('')}</div><div class="card pad"><h2>Tarifs</h2>${v.prices.map(x=>`<p>${x}</p>`).join('')}</div></div>`;return `<h2>Recommandations</h2><div class="card pad"><p>« Un accueil élégant, une équipe discrète et une ambiance rassurante. »</p><b>Aurélie & François</b></div>`}function renderMe(persona='couple',edit=false){const data=persona==='woman'?{name:'Céline',img:I.woman,bio:S.profile.celine}:persona==='man'?{name:'Cyril',img:I.man,bio:S.profile.cyril}:{name:'Céline & Cyril',img:I.couple,bio:S.profile.story};C.innerHTML=`<span class="eyebrow">Votre identité Zwit</span><h1>Mon profil</h1><div class="profileHero" style="background-image:url('${data.img}')"><div class="heroCopy"><h1 class="hero">${data.name}</h1><p>${data.bio}</p><button class="btn" id="editProfile">${edit?'Annuler':'Modifier'}</button></div></div><div class="profile-switch"><button data-me-persona="couple" class="${persona==='couple'?'active':''}">Le couple</button><button data-me-persona="woman" class="${persona==='woman'?'active':''}">Céline</button><button data-me-persona="man" class="${persona==='man'?'active':''}">Cyril</button></div>${edit?editForm(persona):myView(persona)}`;editProfile.onclick=()=>renderMe(persona,!edit);C.querySelectorAll('[data-me-persona]').forEach(b=>b.onclick=()=>renderMe(b.dataset.mePersona,false));const f=document.getElementById('profileForm');if(f)f.onsubmit=e=>{e.preventDefault();let fd=new FormData(f);if(persona==='couple'){S.profile.story=fd.get('bio');S.profile.search=fd.get('search');S.profile.privacy=fd.get('privacy')}else if(persona==='woman')S.profile.celine=fd.get('bio');else S.profile.cyril=fd.get('bio');save();toast('Profil sauvegardé');renderMe(persona,false)}}function myView(p){if(p==='couple')return `<div class="tabs"><button class="active">Présentation</button><button data-me-albums>Albums</button><button data-go="events">Sorties</button><button>Recommandations</button></div><div class="grid g2"><div class="card pad"><h2>Notre histoire</h2><p>${S.profile.story}</p><h3>Notre recherche</h3><p>${S.profile.search}</p></div><div class="card pad"><h2>Confiance & discrétion</h2><p>Trust Index 88/100</p><p>${S.profile.privacy}</p></div></div><h2>Nos albums</h2><div class="gallery"><div style="background-image:url('${I.couple}')"></div><div style="background-image:url('${I.woman}')"></div><div style="background-image:url('${I.man}')"></div><div style="background-image:url('${I.spa}')"></div></div>`;return `<div class="person-panel"><img src="${p==='woman'?I.woman:I.man}"><div class="card pad"><h2>${p==='woman'?'Céline':'Cyril'}</h2><p>${p==='woman'?S.profile.celine:S.profile.cyril}</p><h3>Préférences personnelles</h3><div class="chips"><span class="chip">Feeling</span><span class="chip">Respect</span><span class="chip">Discrétion</span></div><h3>Sorties</h3><p>2 sorties à venir · 7 sorties passées</p><h3>Recommandations</h3><p>4 recommandations privées</p></div></div>`}function editForm(p){const bio=p==='couple'?S.profile.story:p==='woman'?S.profile.celine:S.profile.cyril;return `<form id="profileForm" class="card pad" style="margin-top:18px"><h2>Modifier ${p==='couple'?'le profil du couple':p==='woman'?'la fiche de Céline':'la fiche de Cyril'}</h2><div class="field"><label>Présentation</label><textarea name="bio" rows="5">${bio}</textarea></div>${p==='couple'?`<div class="field"><label>Recherche</label><textarea name="search" rows="4">${S.profile.search}</textarea></div><div class="field"><label>Confidentialité</label><select name="privacy"><option ${S.profile.privacy==='Localisation approximative'?'selected':''}>Localisation approximative</option><option ${S.profile.privacy==='Ville uniquement'?'selected':''}>Ville uniquement</option><option ${S.profile.privacy==='Invisible sur Maps'?'selected':''}>Invisible sur Maps</option></select></div>`:''}<button class="btn" type="submit" style="margin-top:15px">Enregistrer les modifications</button></form>`}function initMap(){const el=document.getElementById('map');if(!el)return;if(typeof L==='undefined'){el.innerHTML='<div class="notice" style="margin:20px">La carte n’a pas pu charger. Vérifiez la connexion puis rechargez la page.</div>';return}map=L.map('map',{zoomControl:true}).setView([50.48,2.91],9);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);profiles.forEach(p=>{const icon=L.divIcon({className:'',html:`<img class="photo-marker" src="${p.img}">`,iconSize:[52,52],iconAnchor:[26,26]});L.marker([p.lat,p.lon],{icon}).addTo(map).on('click',()=>go('member',p.id))});venues.forEach(v=>{const icon=L.divIcon({className:'',html:`<div class="venue-marker">${v.type==='Club'?'C':v.type==='Spa'?'S':'L'}</div>`,iconSize:[42,42],iconAnchor:[21,21]});L.marker([v.lat,v.lon],{icon}).addTo(map).on('click',()=>go('venue',v.id))});setTimeout(()=>map.invalidateSize(),150)}document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g)go(g.dataset.go);const m=e.target.closest('[data-member]');if(m&&!e.target.closest('[data-chat]'))go('member',m.dataset.member);const v=e.target.closest('[data-venue]');if(v)go('venue',v.dataset.venue);if(e.target.closest('[data-back]'))history.length>1?history.back():go('home');const j=e.target.closest('[data-join]');if(j){let id=j.dataset.join;S.joins=S.joins.includes(id)?S.joins.filter(x=>x!==id):[...S.joins,id];save();toast(S.joins.includes(id)?'Inscription confirmée':'Inscription annulée');current==='venue'?renderVenue(venues.find(v=>v.events.some(e=>e.id===id)).id,'agenda'):renders.events()}const pp=e.target.closest('[data-participants]');if(pp){let ev=venues.flatMap(v=>v.events).find(x=>x.id===pp.dataset.participants);alert('Participants : '+ev.going.map(id=>profiles.find(p=>p.id===id)?.name).filter(Boolean).join(', ')+(S.joins.includes(ev.id)?', Céline & Cyril':''))}const a=e.target.closest('[data-album]');if(a)toast('Demande d’accès envoyée');const ch=e.target.closest('[data-chat]');if(ch){e.stopPropagation();toast('Conversation ouverte avec '+profiles.find(p=>p.id===ch.dataset.chat).name)}const b=e.target.closest('[data-book]');if(b)toast('Réservation enregistrée pour la démonstration');const r=e.target.closest('[data-route]');if(r){let v=venues.find(x=>x.id===r.dataset.route);window.open(`https://www.openstreetmap.org/?mlat=${v.lat}&mlon=${v.lon}#map=14/${v.lat}/${v.lon}`,'_blank')}const fv=e.target.closest('[data-favvenue]');if(fv)toast('Établissement ajouté aux favoris')});globalSearch.onkeydown=e=>{if(e.key==='Enter'){go('discover');setTimeout(()=>{dq.value=e.target.value;dq.dispatchEvent(new Event('input'))},20)}};shell();go('home');</script></body></html>
