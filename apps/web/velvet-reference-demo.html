tes individuelles</h3><div class="chips">${limits.map(x=>`<span class="chip">${x}</span>`).join('')}</div><p><button class="btn secondary" onclick="editText('Fiche de ${n}')">Modifier la fiche</button></p></div></article>`}function editText(t){modal(t,`<textarea style="width:100%;height:150px;background:#1d1d21;color:white;border:1px solid var(--line);border-radius:12px;padding:12px">Contenu actuel modifiable dans la future version connectée.</textarea><p><button class="btn" onclick="toast('Modification enregistrée');document.getElementById('modal').classList.remove('open')">Enregistrer</button></p>`)}function render(id){({home,discover,messages:messagesPage,events:eventsPage,clubs:clubsPage,club:clubPage,event:eventPage,notifications:notificationsPage,myprofile:myProfile}[id]||(()=>{}))()}privacy.onclick=()=>{privacy.classList.toggle('active');toast('Mode discret '+(privacy.classList.contains('active')?'activé':'désactivé'))};search.onkeydown=e=>{if(e.key==='Enter'){const q=search.value.toLowerCase(),p=profiles.find(x=>x.name.toLowerCase().includes(q)),c=clubData.find(x=>x.name.toLowerCase().includes(q));if(p)openProfile(p.id);else if(c)openClub(c.id);else toast('Aucun résultat précis — filtres ouverts')}};render('home');</script></body></html>
