<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zwit Control — Centre de commandement</title>
<style>
:root{--bg:#0d0d0d;--panel:#171719;--panel2:#202024;--line:#ffffff14;--txt:#f7f4ef;--muted:#aaa6a1;--gold:#c6a96a;--wine:#641b36;--green:#6fd2a1;--orange:#e2a35f;--red:#e27b93;--blue:#78a9ff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font-family:Inter,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:265px 1fr;min-height:100vh}.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:#0a0a0cf5;padding:18px 14px;z-index:30}.brand{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 18px}.brand b{font:22px Georgia;letter-spacing:.22em;color:var(--gold)}.badge{font-size:9px;border:1px solid #c6a96a55;border-radius:99px;padding:5px 7px;letter-spacing:.14em}.role{border:1px solid var(--line);background:#ffffff05;border-radius:16px;padding:12px;margin-bottom:14px}.role small{display:block;color:var(--muted);margin-bottom:6px}.role select{width:100%;border:0;background:transparent;color:#fff;font-weight:700}.role option{background:#171719}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:var(--muted);text-align:left;padding:11px 12px;border-radius:12px;display:flex;gap:10px;align-items:center}.nav button.active,.nav button:hover{background:#ffffff09;color:white}.nav i{width:22px;color:var(--gold);font-style:normal}.account{position:absolute;left:14px;right:14px;bottom:16px;border:1px solid var(--line);border-radius:15px;padding:11px;background:#ffffff05;display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center}.avatar{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--wine),#9a3f64);display:grid;place-items:center;font-weight:800}.account small{color:var(--muted)}.main{min-width:0}.top{position:sticky;top:0;z-index:20;height:70px;border-bottom:1px solid var(--line);background:#0d0d0ddb;backdrop-filter:blur(18px);display:flex;align-items:center;justify-content:space-between;padding:0 22px}.top h2{font:22px Georgia;margin:0}.search{min-width:300px;max-width:500px;flex:1;margin:0 18px}.search input{width:100%;border:1px solid var(--line);background:#171719;color:#fff;border-radius:999px;padding:10px 14px}.actions{display:flex;gap:8px;align-items:center}.btn{border:0;border-radius:999px;padding:10px 14px;color:#fff;background:linear-gradient(135deg,#973b61,var(--wine));font-weight:700}.btn.secondary{background:transparent;color:var(--gold);border:1px solid #c6a96a55}.btn.ghost{background:#ffffff08;color:#ddd}.content{padding:24px;max-width:1550px;margin:auto}.ey{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}h1,h2,h3{font-family:Georgia}h1{font-size:clamp(38px,5vw,62px);line-height:1;margin:8px 0 12px}.lead{color:var(--muted);line-height:1.6;max-width:850px}.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.card{border:1px solid var(--line);background:linear-gradient(145deg,#ffffff09,#ffffff03);border-radius:21px;padding:18px}.card h2,.card h3{margin:4px 0 14px}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:20px 0}.kpi{border:1px solid var(--line);border-radius:17px;padding:14px;background:#ffffff05}.kpi small{color:var(--muted)}.kpi b{display:block;color:var(--gold);font-size:27px;margin:6px 0}.trend{font-size:11px;color:var(--green)}.trend.down{color:var(--red)}.status{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:99px;padding:6px 9px;font-size:10px}.status:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}.ok{color:var(--green)}.warn{color:var(--orange)}.bad{color:var(--red)}.neutral{color:#bbb}.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:22px 0 12px}.section-head h2{font-size:30px;margin:0}.section-head p{margin:4px 0 0;color:var(--muted)}.health{display:grid;grid-template-columns:210px 1fr;gap:18px;align-items:center}.ring{width:180px;height:180px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--green) 0 98%,#ffffff14 98%);position:relative}.ring:before{content:"";position:absolute;inset:13px;border-radius:50%;background:#151518}.ring div{position:relative;text-align:center}.ring b{font-size:36px;color:var(--gold)}.service-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.service{border:1px solid var(--line);border-radius:14px;padding:11px;background:#ffffff04}.service span{display:flex;justify-content:space-between;gap:8px}.service small{color:var(--muted)}.queue{display:grid;gap:9px}.queue-item{display:grid;grid-template-columns:8px 1fr auto;gap:11px;align-items:center;border:1px solid var(--line);border-radius:15px;padding:12px;background:#ffffff04}.dot{width:8px;height:38px;border-radius:99px;background:var(--orange)}.dot.red{background:var(--red)}.dot.green{background:var(--green)}.queue-item p{margin:3px 0;color:var(--muted);font-size:12px}.queue-item small{color:var(--muted)}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:18px}.table{width:100%;border-collapse:collapse;min-width:900px;background:#121214}.table th{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);text-align:left;padding:12px;border-bottom:1px solid var(--line)}.table td{padding:12px;border-bottom:1px solid #ffffff0b}.table tr:last-child td{border:0}.table tbody tr:hover{background:#ffffff05}.entity{display:flex;align-items:center;gap:10px}.entity .pic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#4c1830,#9d4268);font-weight:800}.entity small{display:block;color:var(--muted);margin-top:3px}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid var(--line);border-radius:99px;padding:6px 8px;font-size:10px;color:#ddd}.timeline{display:grid;gap:0}.timeline-row{display:grid;grid-template-columns:70px 14px 1fr;gap:10px;align-items:start}.timeline-row time{color:var(--muted);font-size:11px;padding-top:2px}.timeline-row i{width:10px;height:10px;border-radius:50%;background:var(--gold);margin-top:3px;position:relative}.timeline-row i:after{content:"";position:absolute;top:12px;left:4px;width:1px;height:44px;background:var(--line)}.timeline-row:last-child i:after{display:none}.timeline-row p{margin:0 0 18px}.timeline-row small{display:block;color:var(--muted);margin-top:4px}.filters{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.filters input,.filters select{border:1px solid var(--line);background:#171719;color:#fff;border-radius:12px;padding:10px 11px}.filters input{min-width:240px}.split{display:grid;grid-template-columns:370px 1fr;gap:14px}.inbox{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#121214}.ticket{padding:13px;border-bottom:1px solid #ffffff0b;cursor:pointer}.ticket.active,.ticket:hover{background:#ffffff08}.ticket p{margin:4px 0;color:var(--muted);font-size:12px}.detail{border:1px solid var(--line);border-radius:18px;padding:18px;background:#121214}.detail-head{display:flex;justify-content:space-between;gap:12px;align-items:start}.detail textarea{width:100%;min-height:110px;background:#19191d;border:1px solid var(--line);color:#fff;border-radius:13px;padding:11px}.chart{height:220px;display:flex;align-items:end;gap:9px;padding-top:20px}.bar{flex:1;height:var(--h);border-radius:8px 8px 2px 2px;background:linear-gradient(180deg,var(--gold),var(--wine));position:relative}.bar span{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--muted)}.drawer-bg{position:fixed;inset:0;background:#000a;z-index:90;display:none}.drawer-bg.open{display:block}.drawer{position:absolute;right:0;top:0;bottom:0;width:min(560px,100%);background:#111114;border-left:1px solid var(--line);padding:20px;overflow:auto}.mobile{display:none}
@media(max-width:1200px){.kpis{grid-template-columns:repeat(3,1fr)}.service-grid{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){.app{grid-template-columns:1fr}.side{display:none}.top{height:64px;padding:0 13px}.search{min-width:0;margin:0 8px}.actions .secondary{display:none}.content{padding:15px 13px 82px}.g2,.g3,.g4,.health,.split{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.service-grid{grid-template-columns:1fr 1fr}.mobile{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:70;background:#101013f3;border-top:1px solid var(--line);padding:8px;justify-content:space-around}.mobile button{border:0;background:transparent;color:var(--muted);font-size:10px}}
</style>
</head>
<body>
<div class="app"><aside class="side"><div class="brand"><b>ZWIT</b><span class="badge">CONTROL</span></div><div class="role"><small>Bureau actif</small><select id="roleSelect" onchange="changeRole(this.value)"><option>Direction</option><option>Supervision</option><option>Modération</option><option>Support</option><option>Équipe Pro</option><option>Finance</option><option>Marketing</option><option>Technique</option><option>Trust & Safety</option></select></div><nav id="nav" class="nav"></nav><div class="account"><div class="avatar">CM</div><div><b>Claire Martin</b><small>Administratrice générale</small></div></div></aside><main class="main"><header class="top"><h2 id="pageTitle">Centre de commandement</h2><div class="search"><input id="globalSearch" placeholder="Rechercher un membre, établissement, ticket, paiement…" onkeydown="if(event.key==='Enter')globalSearchRun()"></div><div class="actions"><span class="status ok">Systèmes opérationnels</span><button class="btn secondary" onclick="openQuick()">Action rapide</button></div></header><div id="content" class="content"></div></main></div>
<nav id="mobileNav" class="mobile"></nav><div id="drawerBg" class="drawer-bg" onclick="if(event.target===this)closeDrawer()"><aside id="drawer" class="drawer"></aside></div>
<script>
const MENU=[['command','⌂','Centre de commandement'],['members','♡','Membres'],['venues','◇','Établissements'],['organizers','◷','Organisateurs'],['moderation','⚑','Modération'],['support','?','Support'],['finance','€','Finance'],['marketing','↗','Marketing'],['tech','⚙','Technique'],['trust','◉','Trust & Safety'],['reports','▦','Rapports'],['teams','♙','Équipes'],['settings','⋯','Paramètres']];
const MEMBERS=[{id:'m1',name:'Emma & Nicolas',type:'Couple',city:'Lille',trust:96,status:'Actif',premium:'Premium Duo',reports:1,joined:'12/05/2026'},{id:'m2',name:'Chloé',type:'Femme',city:'Lens',trust:98,status:'Actif',premium:'Premium',reports:0,joined:'02/06/2026'},{id:'m3',name:'Léa & Hugo',type:'Couple',city:'Arras',trust:89,status:'Sous surveillance',premium:'Gratuit',reports:3,joined:'18/07/2026'},{id:'m4',name:'Théo',type:'Homme',city:'Lille',trust:72,status:'Suspendu',premium:'Premium',reports:5,joined:'21/07/2026'}];
const VENUES=[{id:'v1',name:'O’Pulsions',city:'Lille',status:'Validé',events:8,revenue:12840,score:94},{id:'v2',name:'O’Relax',city:'Hauts-de-France',status:'Validé',events:4,revenue:7740,score:91},{id:'v3',name:'Suite Velours',city:'Arras',status:'À contrôler',events:2,revenue:5680,score:76}];
const ORGANIZERS=[{id:'o1',name:'Camille & Julien',type:'Couple',status:'Validé',events:6,incidents:0,score:97},{id:'o2',name:'Sarah',type:'Femme',status:'En attente',events:0,incidents:0,score:91},{id:'o3',name:'Marc & Élodie',type:'Couple',status:'Sous surveillance',events:9,incidents:2,score:78}];
const CASES=[{id:'c1',priority:'Urgent',title:'Possible usurpation d’identité',entity:'Profil Théo',score:92,age:'8 min',type:'Identité'},{id:'c2',priority:'Haute',title:'Album privé signalé',entity:'Léa & Hugo',score:84,age:'22 min',type:'Contenu'},{id:'c3',priority:'Haute',title:'Comportement insistant',entity:'Conversation #8821',score:78,age:'41 min',type:'Message'},{id:'c4',priority:'Normale',title:'Photo à vérifier',entity:'Nouveau profil #4412',score:63,age:'1 h',type:'Photo'}];
const TICKETS=[{id:'t1',title:'Paiement débité deux fois',member:'Emma & Nicolas',priority:'Urgent',status:'Ouvert'},{id:'t2',title:'Impossible d’ouvrir un album',member:'Chloé',priority:'Haute',status:'En cours'},{id:'t3',title:'Demande de suppression RGPD',member:'Profil #4811',priority:'Haute',status:'Ouvert'},{id:'t4',title:'Question organisateur privé',member:'Marc & Élodie',priority:'Normale',status:'En attente'}];
let route='command',role='Direction',activeTicket='t1';
const euro=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function init(){nav.innerHTML=MENU.map(x=>`<button class="${route===x[0]?'active':''}" onclick="go('${x[0]}')"><i>${x[1]}</i>${x[2]}</button>`).join('');mobileNav.innerHTML=MENU.slice(0,5).map(x=>`<button onclick="go('${x[0]}')">${x[1]}<br>${x[2].split(' ')[0]}</button>`).join('');roleSelect.value=role}
function go(r){route=r;render();scrollTo(0,0)}function changeRole(v){role=v;render()}function closeDrawer(){drawerBg.classList.remove('open')}function openDrawer(html){drawer.innerHTML=html;drawerBg.classList.add('open')}
function render(){init();const labels=Object.fromEntries(MENU.map(x=>[x[0],x[2]]));pageTitle.textContent=labels[route]||'Zwit Control';content.innerHTML=({command:commandPage,members:membersPage,venues:venuesPage,organizers:organizersPage,moderation:moderationPage,support:supportPage,finance:financePage,marketing:marketingPage,tech:techPage,trust:trustPage,reports:reportsPage,teams:teamsPage,settings:settingsPage}[route]||commandPage)()}
function commandPage(){return `<div class="ey">Bureau ${esc(role)} · Données fictives</div><h1>Zwit sous contrôle.</h1><p class="lead">Une vue unique pour voir ce qui est urgent, ce qui doit être traité et ce qui mérite une surveillance.</p><div class="kpis"><div class="kpi"><small>CA aujourd’hui</small><b>${euro(18420)}</b><span class="trend">+14,2%</span></div><div class="kpi"><small>Premium actifs</small><b>12 842</b><span class="trend">+286 ce mois</span></div><div class="kpi"><small>Nouveaux profils</small><b>184</b><span class="trend">72 couples</span></div><div class="kpi"><small>Signalements ouverts</small><b>37</b><span class="trend down">6 urgents</span></div><div class="kpi"><small>Tickets support</small><b>54</b><span class="trend down">4 > 24 h</span></div><div class="kpi"><small>Établissements actifs</small><b>148</b><span class="trend">+5 ce mois</span></div></div><div class="grid g2"><section class="card"><div class="section-head"><div><div class="ey">Santé globale</div><h2>Plateforme opérationnelle</h2></div><span class="status ok">Aucun incident majeur</span></div><div class="health"><div class="ring"><div><b>98,7%</b><small>Santé Zwit</small></div></div><div class="service-grid">${[['API','99,99%','ok'],['Paiements','99,98%','ok'],['Chat','99,91%','ok'],['Photos','99,84%','ok'],['Notifications','98,6%','warn'],['Maps','99,96%','ok'],['IA','99,72%','ok'],['E-mails','99,89%','ok'],['Push','98,8%','warn'],['Base de données','99,99%','ok']].map(x=>`<div class="service"><span><b>${x[0]}</b><i class="status ${x[2]}"></i></span><small>${x[1]}</small></div>`).join('')}</div></div></section><section class="card"><div class="section-head"><div><div class="ey">Priorités</div><h2>Urgent aujourd’hui</h2></div><button class="btn secondary" onclick="go('moderation')">Ouvrir les files</button></div><div class="queue"><div class="queue-item"><span class="dot red"></span><div><b>2 fraudes potentielles</b><p>Usurpation d’identité et multi-comptes.</p></div><small>Trust & Safety</small></div><div class="queue-item"><span class="dot red"></span><div><b>4 tickets bloqués depuis 24 h</b><p>Deux paiements et deux demandes RGPD.</p></div><small>Support</small></div><div class="queue-item"><span class="dot"></span><div><b>3 établissements à valider</b><p>Pièces légales et fiche publique.</p></div><small>Équipe Pro</small></div><div class="queue-item"><span class="dot green"></span><div><b>Campagne été prête</b><p>12 452 destinataires vérifiés.</p></div><small>Marketing</small></div></div></section></div><div class="section-head"><div><h2>Activité métier</h2><p>Ce qui évolue en temps réel dans Velvet.</p></div></div><div class="grid g4"><div class="card"><div class="ey">Modération</div><h2>37 dossiers</h2><p class="lead">92% traités dans le SLA. 6 dossiers urgents.</p><button class="btn secondary" onclick="go('moderation')">Traiter</button></div><div class="card"><div class="ey">Support</div><h2>54 tickets</h2><p class="lead">Temps moyen de réponse : 1 h 42.</p><button class="btn secondary" onclick="go('support')">Ouvrir</button></div><div class="card"><div class="ey">Finance</div><h2>${euro(6420)}</h2><p class="lead">Remboursements et litiges à valider.</p><button class="btn secondary" onclick="go('finance')">Contrôler</button></div><div class="card"><div class="ey">Technique</div><h2>3 alertes</h2><p class="lead">Deux avertissements et une dette technique.</p><button class="btn secondary" onclick="go('tech')">Diagnostiquer</button></div></div>`}
function membersPage(){return `<div class="ey">Recherche et vue 360°</div><h1>Membres</h1><p class="lead">Profils, abonnements, vérifications, appareils, sanctions, support et historique réunis dans un seul dossier.</p><div class="filters"><input id="msearch" placeholder="Nom, ville, identifiant…" oninput="filterMembers()"><select id="mstatus" onchange="filterMembers()"><option value="">Tous les statuts</option><option>Actif</option><option>Sous surveillance</option><option>Suspendu</option></select></div><div id="memberResults">${memberTable(MEMBERS)}</div>`}
function memberTable(items){return `<div class="table-wrap"><table class="table"><thead><tr><th>Membre</th><th>Abonnement</th><th>Trust</th><th>Signalements</th><th>Statut</th><th>Inscription</th><th></th></tr></thead><tbody>${items.map(m=>`<tr><td><div class="entity"><div class="pic">${m.name.split(' ').map(x=>x[0]).slice(0,2).join('')}</div><div><b>${esc(m.name)}</b><small>${m.type} · ${m.city}</small></div></div></td><td>${m.premium}</td><td>${m.trust}</td><td>${m.reports}</td><td><span class="status ${m.status==='Actif'?'ok':m.status==='Suspendu'?'bad':'warn'}">${m.status}</span></td><td>${m.joined}</td><td><button class="btn secondary" onclick="openMember('${m.id}')">Ouvrir</button></td></tr>`).join('')}</tbody></table></div>`}
function filterMembers(){const q=msearch.value.toLowerCase(),s=mstatus.value;memberResults.innerHTML=memberTable(MEMBERS.filter(m=>(!q||JSON.stringify(m).toLowerCase().includes(q))&&(!s||m.status===s)))}
function openMember(id){const m=MEMBERS.find(x=>x.id===id);openDrawer(`<button class="btn ghost" onclick="closeDrawer()">Fermer</button><div class="ey" style="margin-top:18px">Dossier membre</div><h1 style="font-size:42px">${esc(m.name)}</h1><div class="chips"><span class="chip">${m.type}</span><span class="chip">${m.city}</span><span class="chip">Trust ${m.trust}</span><span class="chip">${m.premium}</span></div><div class="grid g3" style="margin-top:14px"><div class="kpi"><small>Connexions 30 j</small><b>42</b></div><div class="kpi"><small>Paiements</small><b>${euro(118)}</b></div><div class="kpi"><small>Signalements</small><b>${m.reports}</b></div></div><section class="card"><h2>Timeline complète</h2><div class="timeline"><div class="timeline-row"><time>14:32</time><i></i><p><b>Connexion</b><small>iPhone · Lille · Session sécurisée</small></p></div><div class="timeline-row"><time>14:35</time><i></i><p><b>Abonnement ${m.premium}</b><small>Paiement confirmé</small></p></div><div class="timeline-row"><time>15:10</time><i></i><p><b>Ajout de photos</b><small>Validation automatique réussie</small></p></div><div class="timeline-row"><time>16:40</time><i></i><p><b>Signalement reçu</b><small>Analyse IA : risque faible</small></p></div></div></section><section class="card"><h2>Actions administratives</h2><div class="chips"><button class="btn secondary">Avertir</button><button class="btn secondary">Masquer un contenu</button><button class="btn ghost">Suspendre</button><button class="btn">Bannir</button></div></section>`) }
function venuesPage(){return entityPage('Établissements','Contrôle des comptes professionnels et interconnexion avec Zwit Pro.',VENUES,'venue')}
function organizersPage(){return entityPage('Organisateurs privés','Validation et supervision des profils particuliers autorisés à organiser.',ORGANIZERS,'organizer')}
function entityPage(title,lead,items,type){return `<div class="ey">Supervision</div><h1>${title}</h1><p class="lead">${lead}</p><div class="table-wrap"><table class="table"><thead><tr><th>Nom</th><th>Statut</th><th>Événements</th><th>${type==='venue'?'CA':'Incidents'}</th><th>Score</th><th></th></tr></thead><tbody>${items.map(x=>`<tr><td><div class="entity"><div class="pic">${x.name.slice(0,2).toUpperCase()}</div><div><b>${x.name}</b><small>${x.city||x.type}</small></div></div></td><td><span class="status ${x.status==='Validé'?'ok':x.status.includes('surveillance')?'warn':'neutral'}">${x.status}</span></td><td>${x.events}</td><td>${type==='venue'?euro(x.revenue):x.incidents}</td><td>${x.score}</td><td><button class="btn secondary" onclick="openEntity('${type}','${x.id}')">Ouvrir</button></td></tr>`).join('')}</tbody></table></div>`}
function openEntity(type,id){const x=(type==='venue'?VENUES:ORGANIZERS).find(y=>y.id===id);openDrawer(`<button class="btn ghost" onclick="closeDrawer()">Fermer</button><div class="ey" style="margin-top:18px">${type==='venue'?'Établissement':'Organisateur privé'}</div><h1 style="font-size:42px">${x.name}</h1><div class="chips"><span class="chip">${x.status}</span><span class="chip">Score ${x.score}</span><span class="chip">${x.events} événements</span></div><section class="card"><h2>Contrôles</h2><div class="queue"><div class="queue-item"><span class="dot green"></span><div><b>Identité vérifiée</b><p>Documents et compte validés.</p></div></div><div class="queue-item"><span class="dot green"></span><div><b>Historique conforme</b><p>Aucun incident majeur.</p></div></div><div class="queue-item"><span class="dot"></span><div><b>Revue recommandée</b><p>Prochaine vérification dans 30 jours.</p></div></div></div></section><div class="chips"><button class="btn secondary">Ouvrir la fiche publique</button><button class="btn secondary">Voir le CRM</button><button class="btn">Suspendre la publication</button></div>`) }
function moderationPage(){return `<div class="ey">File préparée par IA</div><h1>Modération</h1><p class="lead">Décidez vite avec le contexte, les preuves, l’historique et une recommandation clairement séparée de la décision humaine.</p><div class="split"><div class="inbox">${CASES.map((c,i)=>`<div class="ticket ${i===0?'active':''}" onclick="openCase('${c.id}')"><div class="chips"><span class="chip">${c.priority}</span><span class="chip">IA ${c.score}%</span></div><b>${c.title}</b><p>${c.entity} · ${c.age}</p></div>`).join('')}</div><div class="detail"><div class="detail-head"><div><div class="ey">Dossier c1 · Identité</div><h2>Possible usurpation d’identité</h2></div><span class="status bad">Urgent</span></div><p class="lead">Deux profils utilisent des photographies visuellement proches. L’adresse e-mail et l’appareil sont distincts, mais la photo principale semble provenir de la même source.</p><div class="grid g3"><div class="kpi"><small>Confiance IA</small><b>92%</b></div><div class="kpi"><small>Signalements</small><b>3</b></div><div class="kpi"><small>Antécédents</small><b>1</b></div></div><section class="card"><h3>Recommandation IA</h3><p class="lead">Masquer temporairement la photo, demander une vérification renforcée et conserver le profil actif pendant 24 heures.</p></section><section class="card"><h3>Décision</h3><div class="chips"><button class="btn secondary">Aucune action</button><button class="btn secondary">Avertir</button><button class="btn ghost">Masquer</button><button class="btn">Suspendre et vérifier</button></div></section></div></div>`}
function openCase(id){const c=CASES.find(x=>x.id===id);openDrawer(`<button class="btn ghost" onclick="closeDrawer()">Fermer</button><div class="ey" style="margin-top:18px">Dossier ${c.id}</div><h1 style="font-size:42px">${c.title}</h1><p class="lead">${c.entity} · Analyse IA ${c.score}% · ${c.age}</p><section class="card"><h2>Éléments du dossier</h2><p class="lead">Preuves, signalements associés, historique et règles applicables sont réunis ici.</p></section><div class="chips"><button class="btn secondary">Classer sans suite</button><button class="btn secondary">Avertir</button><button class="btn">Escalader</button></div>`) }
function supportPage(){const t=TICKETS.find(x=>x.id===activeTicket);return `<div class="ey">Service client</div><h1>Support</h1><p class="lead">Contexte membre, abonnement, paiements et historique accessibles sans changer d’outil.</p><div class="split"><div class="inbox">${TICKETS.map(x=>`<div class="ticket ${x.id===t.id?'active':''}" onclick="activeTicket='${x.id}';render()"><div class="chips"><span class="chip">${x.priority}</span><span class="chip">${x.status}</span></div><b>${x.title}</b><p>${x.member}</p></div>`).join('')}</div><div class="detail"><div class="ey">Ticket ${t.id}</div><h2>${t.title}</h2><p class="lead">${t.member} · Priorité ${t.priority}</p><section class="card"><h3>Résumé automatique</h3><p class="lead">Le membre signale un problème récent. Son compte est vérifié et aucun incident similaire n’apparaît dans l’historique.</p></section><textarea placeholder="Réponse au membre…"></textarea><div class="chips" style="margin-top:10px"><button class="btn secondary">Insérer un modèle</button><button class="btn secondary">Transférer</button><button class="btn">Répondre et résoudre</button></div></div></div>`}
function financePage(){return `<div class="ey">Abonnements, flux et litiges</div><h1>Finance</h1><p class="lead">Une console séparée, sans exposition inutile aux contenus et messages privés.</p><div class="kpis"><div class="kpi"><small>CA du mois</small><b>${euro(486200)}</b><span class="trend">+16,4%</span></div><div class="kpi"><small>MRR</small><b>${euro(421800)}</b></div><div class="kpi"><small>Remboursements</small><b>${euro(6420)}</b><span class="trend down">31 demandes</span></div><div class="kpi"><small>Paiements échoués</small><b>184</b></div><div class="kpi"><small>Reversements Pro</small><b>${euro(128400)}</b></div><div class="kpi"><small>Litiges</small><b>12</b><span class="trend down">3 urgents</span></div></div><div class="grid g2"><section class="card"><h2>Revenus sur 8 semaines</h2><div class="chart">${[48,55,62,58,74,81,78,92].map((h,i)=>`<div class="bar" style="--h:${h}%"><span>S${i+1}</span></div>`).join('')}</div></section><section class="card"><h2>Actions à valider</h2><div class="queue"><div class="queue-item"><span class="dot red"></span><div><b>3 remboursements > 200 €</b><p>Validation superviseur nécessaire.</p></div></div><div class="queue-item"><span class="dot"></span><div><b>8 paiements contestés</b><p>Preuves à transmettre.</p></div></div><div class="queue-item"><span class="dot green"></span><div><b>Reversement Pro prêt</b><p>Lot de ${euro(58400)}.</p></div></div></div></section></div>`}
function marketingPage(){return simplePage('Marketing','Campagnes, segments, codes promotionnels, notifications et tests.',[['Campagne été','12 452 destinataires','Prête'],['Relance Premium','8 244 destinataires','En cours'],['Onboarding couple','3 variantes','A/B test']])}
function techPage(){return simplePage('Technique','Disponibilité, erreurs, API, base de données et alertes.',[['API principale','173 ms','Opérationnel'],['Service photos','0,18% erreurs','Surveillance'],['Notifications push','98,8% délivrées','Avertissement'],['Base de données','42% capacité','Opérationnel']])}
function trustPage(){return simplePage('Trust & Safety','Fraude, usurpation, multi-comptes, comportements dangereux et conformité.',[['Usurpations potentielles','2 dossiers','Urgent'],['Multi-comptes','6 dossiers','À traiter'],['Demandes judiciaires','1 dossier','Restreint'],['Demandes RGPD','14 dossiers','Dans les délais']])}
function reportsPage(){return simplePage('Rapports','Exports PDF, Excel et CSV avec filtres et périodes.',[['Rapport direction','Mensuel','PDF'],['Modération et SLA','Hebdomadaire','Excel'],['Finance et TVA','Mensuel','CSV'],['Santé plateforme','Quotidien','PDF']])}
function teamsPage(){return simplePage('Équipes','Collaborateurs, rôles, permissions, double authentification et audit.',[['Direction','4 collaborateurs','Accès stratégique'],['Modération','18 collaborateurs','Files dédiées'],['Support','12 collaborateurs','Tickets et membres'],['Finance','5 collaborateurs','Données financières']])}
function settingsPage(){return simplePage('Paramètres','Configuration générale, règles, seuils, automatisations et intégrations.',[['Authentification','2FA obligatoire','Actif'],['SLA Support','4 heures','Actif'],['Seuil IA modération','75%','Actif'],['Journal d’audit','Immuable','Actif']])}
function simplePage(title,lead,rows){return `<div class="ey">Zwit Control</div><h1>${title}</h1><p class="lead">${lead}</p><div class="grid g2">${rows.map(r=>`<div class="card"><div class="ey">${r[2]}</div><h2>${r[0]}</h2><p class="lead">${r[1]}</p><button class="btn secondary">Ouvrir</button></div>`).join('')}</div>`}
function globalSearchRun(){const q=globalSearch.value.trim();if(!q)return;const m=MEMBERS.find(x=>x.name.toLowerCase().includes(q.toLowerCase()));if(m){openMember(m.id);return}openDrawer(`<button class="btn ghost" onclick="closeDrawer()">Fermer</button><div class="ey" style="margin-top:18px">Recherche globale</div><h1 style="font-size:42px">${esc(q)}</h1><p class="lead">3 résultats trouvés dans les membres, tickets et établissements.</p><div class="queue"><div class="queue-item"><span class="dot green"></span><div><b>Profil correspondant</b><p>Résultat membre vérifié.</p></div></div><div class="queue-item"><span class="dot"></span><div><b>Ticket support associé</b><p>Ouvert il y a 2 jours.</p></div></div><div class="queue-item"><span class="dot green"></span><div><b>Paiement récent</b><p>Transaction confirmée.</p></div></div></div>`) }
function openQuick(){openDrawer(`<button class="btn ghost" onclick="closeDrawer()">Fermer</button><div class="ey" style="margin-top:18px">Action rapide</div><h1 style="font-size:42px">Que souhaitez-vous faire ?</h1><div class="grid g2"><button class="card" onclick="go('members');closeDrawer()"><h3>Rechercher un membre</h3><p class="lead">Ouvrir la vue 360°.</p></button><button class="card" onclick="go('moderation');closeDrawer()"><h3>Traiter un dossier</h3><p class="lead">Ouvrir la file prioritaire.</p></button><button class="card" onclick="go('support');closeDrawer()"><h3>Répondre au support</h3><p class="lead">Voir les tickets urgents.</p></button><button class="card" onclick="go('venues');closeDrawer()"><h3>Valider un établissement</h3><p class="lead">Contrôler un compte Pro.</p></button></div>`) }
render();
</script>
