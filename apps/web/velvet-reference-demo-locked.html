<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zwit — Démo verrouillée</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>:root{--bg:#0b0b0d;--panel:#151518;--panel2:#1d1d21;--line:#ffffff18;--txt:#f5f1ed;--muted:#aaa5a0;--gold:#c9a86a;--burg:#712440;--green:#56b28a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:DM Sans,sans-serif;overflow:hidden}button,input{font:inherit}.frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--bg)}.dock{position:fixed;top:88px;right:18px;z-index:1000;display:grid;gap:10px}.dock button{border:1px solid var(--line);background:#141418eF;color:var(--txt);padding:12px 16px;border-radius:999px;cursor:pointer;box-shadow:0 12px 35px #0008}.dock button.active{color:var(--gold);border-color:#c9a86a66}.overlay{position:fixed;inset:0;z-index:900;background:radial-gradient(circle at 80% 0,#71244026,transparent 35rem),var(--bg);display:none;overflow:auto}.overlay.open{display:block}.top{position:sticky;top:0;z-index:5;height:74px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;border-bottom:1px solid var(--line);background:#0b0b0ddd;backdrop-filter:blur(18px)}.brand{font-family:Playfair Display;font-size:22px;letter-spacing:.22em;color:var(--gold)}.close{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#19191d;color:white;cursor:pointer}.content{padding:26px;max-width:1500px;margin:auto}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.2em;color:var(--gold)}h1,h2,h3{font-family:Playfair Display}.hero{font-size:clamp(42px,6vw,72px);line-height:1;margin:8px 0 14px}.muted{color:var(--muted)}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0}.filter{border:1px solid var(--line);background:#17171a;color:var(--muted);padding:10px 14px;border-radius:999px;cursor:pointer}.filter.active{color:var(--gold);border-color:#c9a86a66}.search{min-width:280px;flex:1;border:1px solid var(--line);border-radius:999px;background:#17171a;color:white;padding:11px 15px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{border:1px solid var(--line);border-radius:21px;background:linear-gradient(145deg,#ffffff0c,#ffffff04);overflow:hidden}.cover{height:240px;background-size:cover;background-position:center;position:relative}.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,#000e)}.pad{padding:17px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.tag,.chip{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:11px}.tag{color:var(--gold);border-color:#c9a86a55}.chips{display:flex;flex-wrap:wrap;gap:6px}.btn{border:0;border-radius:999px;padding:11px 15px;background:linear-gradient(135deg,#8a3055,var(--burg));color:white;cursor:pointer}.btn.secondary{background:transparent;color:var(--gold);border:1px solid #c9a86a66}.layout{display:grid;grid-template-columns:1fr 360px;gap:16px}.map-wrap{height:calc(100vh - 190px);min-height:600px;border-radius:22px;overflow:hidden;border:1px solid var(--line)}#map{height:100%;width:100%;background:#111}.side{border:1px solid var(--line);border-radius:22px;background:#121215;overflow:auto;max-height:calc(100vh - 190px)}.result{padding:15px;border-bottom:1px solid var(--line);cursor:pointer}.result:hover{background:#ffffff08}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:7px}.member{background:#9b4d71}.club{background:#c9a86a}.spa{background:#56b28a}.room{background:#6f7fd3}.event{background:#d66d7a}.modal{position:fixed;inset:0;z-index:1200;background:#000c;display:none;place-items:center;padding:20px}.modal.open{display:grid}.box{width:min(760px,95vw);max-height:90vh;overflow:auto;background:#151518;border:1px solid var(--line);border-radius:22px;padding:20px}.profile-head{display:grid;grid-template-columns:220px 1fr;gap:18px}.portrait{height:280px;border-radius:17px;background-size:cover;background-position:center}.toast{position:fixed;right:24px;bottom:24px;z-index:1300;padding:13px 17px;border:1px solid #c9a86a66;border-radius:14px;background:#1d1d21;opacity:0;transform:translateY(10px);transition:.2s}.toast.show{opacity:1;transform:none}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#17171a;color:#f5f1ed}.leaflet-control-zoom a{background:#17171a!important;color:white!important;border-color:#ffffff18!important}@media(max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.side{max-height:none}.map-wrap{height:70vh}.dock{top:auto;bottom:16px;right:12px;left:12px;grid-template-columns:1fr 1fr}.dock button{width:100%}}@media(max-width:680px){.content{padding:15px}.grid{grid-template-columns:1fr}.hero{font-size:42px}.profile-head{grid-template-columns:1fr}.search{min-width:100%}.top{padding:0 15px}}</style></head><body><iframe class="frame" src="velvet-reference-demo.html" title="Zwit démo de référence"></iframe><div class="dock"><button id="profilesBtn">👥 Profils</button><button id="mapBtn">⌖ Carte</button></div><section class="overlay" id="profilesOverlay"><header class="top"><div class="brand">ZWIT · PROFILS</div><button class="close" data-close>×</button></header><div class="content"><p class="eyebrow">Communauté Zwit</p><h1 class="hero">Des membres, des histoires, des affinités.</h1><p class="muted">Les profils sont fictifs et interconnectés pour tester la profondeur de la plateforme.</p><div class="toolbar"><input class="search" id="profileSearch" placeholder="Rechercher par prénom, ville, type ou envie…"><button class="filter active" data-type="Tous">Tous</button><button class="filter" data-type="Couple">Couples</button><button class="filter" data-type="Femme seule">Femmes seules</button><button class="filter" data-type="Homme seul">Hommes seuls</button><button class="filter" data-type="Couple de femmes">Couples de femmes</button></div><div class="grid" id="profilesGrid"></div></div></section><section class="overlay" id="mapOverlay"><header class="top"><div class="brand">ZWIT · CARTE</div><button class="close" data-close>×</button></header><div class="content"><p class="eyebrow">Autour de vous</p><h1 class="hero">Membres, lieux et sorties sur une même carte.</h1><div class="toolbar"><button class="filter active" data-map="all">Tout</button><button class="filter" data-map="member">Membres</button><button class="filter" data-map="club">Clubs</button><button class="filter" data-map="spa">Spas</button><button class="filter" data-map="room">Love rooms</button><button class="filter" data-map="event">Sorties</button><button class="filter" id="locate">Me localiser</button></div><div class="layout"><div class="map-wrap"><div id="map"></div></div><aside class="side" id="mapResults"></aside></div></div></section><div class="modal" id="modal"><div class="box"><div class="row"><h2 id="modalTitle">Détail</h2><button class="close" id="modalClose">×</button></div><div id="modalBody"></div></div></div><div class="toast" id="toast"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const IMG={c1:'https://images.unsplash.com/photo-1522673607200-164d1b6ce486?auto=format&fit=crop&w=1000&q=85',c2:'https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?auto=format&fit=crop&w=1000&q=85',w1:'https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=800&q=85',w2:'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=800&q=85',m1:'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=800&q=85',m2:'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=800&q=85',club:'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=1000&q=85',spa:'https://images.unsplash.com/photo-1540555700478-4be289fbecef?auto=format&fit=crop&w=1000&q=85',room:'https://images.unsplash.com/photo-1600566753086-00f18fb6b3ea?auto=format&fit=crop&w=1000&q=85',party:'https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=1000&q=85'};const profiles=[['af','Aurélie & François','Couple','Lille','38 & 41 ans',91,94,IMG.c1,'Complices depuis 14 ans, sensibles aux rencontres naturelles et aux ambiances intimistes.',['Mélangisme','Spa','Trios F']],['em','Élodie & Marc','Couple','Arras','36 & 39 ans',86,90,IMG.c2,'Parents et actifs, ils privilégient la qualité, la douceur et les relations suivies.',['Massage','Spa','Couples']],['cl','Claire','Femme seule','Lille','34 ans',84,88,IMG.w2,'Indépendante, élégante et bi-curieuse, elle aime les couples amoureux et les échanges construits.',['Trios','Lounge','Tendresse']],['lm','Léa & Manon','Couple de femmes','Roubaix','31 & 33 ans',89,92,IMG.c2,'Un duo joyeux et spontané, très attaché au consentement et au feeling.',['Femmes','Couples','Soirées privées']],['sa','Sophie & Antoine','Couple','Lens','42 & 44 ans',82,87,IMG.c1,'Épicuriens et discrets, ils aiment les spas, les belles tables et les week-ends à deux ou quatre.',['Spa','Voyages','Mélangisme']],['ju','Julie','Femme seule','Douai','37 ans',80,85,IMG.w1,'Souriante et curieuse, elle recherche une vraie connexion avant toute rencontre.',['Couples','Dîner','Soft']],['nt','Nina & Thomas','Couple','Béthune','33 & 35 ans',88,91,IMG.c2,'Un couple tendre et joueur qui préfère les petits comités aux grandes soirées.',['Privé','Spa','Trios F']],['pa','Paul','Homme seul','Lille','39 ans',73,82,IMG.m1,'Respectueux, patient et habitué aux environnements où la communication prime.',['Couples','Massage','Discussion']],['ac','Amélie & Christophe','Couple','Valenciennes','40 & 43 ans',85,89,IMG.c1,'Ensemble depuis 17 ans, ils aiment prendre leur temps et revoir les personnes appréciées.',['Couples','Club','Week-end']],['el','Émilie','Femme seule','Arras','32 ans',87,90,IMG.w2,'Douce, vive et attentive, elle découvre progressivement son côté bi.',['Femmes','Couples','Spa']],['cb','Chloé & Bastien','Couple','Cambrai','35 & 37 ans',83,86,IMG.c2,'Naturels et sans prétention, ils aiment l’humour, les rencontres simples et le respect des rythmes.',['Mélangisme','Club','Dîner']],['mr','Mélanie & Romain','Couple','Le Touquet','38 & 40 ans',90,93,IMG.c1,'Élégants et voyageurs, ils recherchent des connexions sensuelles et durables.',['Voyages','Lounge','Couples']]];let type='Tous';const toast=t=>{const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)};const modal=(title,html)=>{document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').classList.add('open')};function card(p){return `<article class="card"><div class="cover" style="background-image:url('${p[7]}')"></div><div class="pad"><span class="tag">${p[5]}% compatible</span><h2>${p[1]}</h2><p class="muted">${p[2]} · ${p[3]} · Trust ${p[6]}</p><p>${p[8]}</p><div class="chips">${p[9].map(x=>`<span class="chip">${x}</span>`).join('')}</div><br><div class="row"><button class="btn" onclick="openProfile('${p[0]}')">Voir le profil</button><button class="btn secondary" onclick="openChat('${p[1]}')">Écrire</button></div></div></article>`}function renderProfiles(){const q=document.getElementById('profileSearch').value.toLowerCase();const list=profiles.filter(p=>(type==='Tous'||p[2]===type)&&p.join(' ').toLowerCase().includes(q));document.getElementById('profilesGrid').innerHTML=list.map(card).join('')||'<div class="card pad">Aucun profil dans cette sélection.</div>'}window.openProfile=id=>{const p=profiles.find(x=>x[0]===id);modal(p[1],`<div class="profile-head"><div class="portrait" style="background-image:url('${p[7]}')"></div><div><span class="tag">${p[5]}% compatible · Trust ${p[6]}</span><h1>${p[1]}</h1><p class="muted">${p[2]} · ${p[3]} · ${p[4]}</p><p>${p[8]}</p><h3>Affinités principales</h3><div class="chips">${p[9].map(x=>`<span class="chip">${x}</span>`).join('')}</div><br><button class="btn" onclick="openChat('${p[1]}')">Ouvrir la conversation</button> <button class="btn secondary" onclick="toast('Demande d’accès à l’album envoyée')">Demander l’album privé</button></div></div><div class="card pad" style="margin-top:16px"><h3>Histoire & recherche</h3><p>Ce profil fictif est relié aux soirées, recommandations et établissements de la démo. Il permet de tester le passage profil → conversation → album → sortie.</p></div>`)};window.openChat=name=>{modal('Conversation avec '+name,`<div class="card pad"><p><strong>${name}</strong><br>Bonsoir vous deux, votre univers nous parle beaucoup. On partage votre importance du feeling et du respect.</p><p style="text-align:right"><span class="chip">Merci, c’est exactement ce que nous avons ressenti 😊</span></p><div class="row"><input id="quickMsg" class="search" placeholder="Écrire un message…"><button class="btn" onclick="toast('Message envoyé à ${name}')">Envoyer</button></div></div>`)};const points=[['member','Aurélie & François','Couple · Lille',50.635,3.063,IMG.c1],['member','Claire','Femme seule · Lille',50.629,3.057,IMG.w2],['member','Léa & Manon','Couple de femmes · Roubaix',50.692,3.174,IMG.c2],['member','Élodie & Marc','Couple · Arras',50.291,2.777,IMG.c2],['member','Sophie & Antoine','Couple · Lens',50.433,2.827,IMG.c1],['club','O’Pulsions','Club & spa · Hénin-Beaumont',50.414,2.965,IMG.club],['club','La Tentation','Club · Métropole lilloise',50.654,2.952,IMG.club],['spa','L’Eden','Spa · Lille',50.637,3.069,IMG.spa],['spa','O’Relax','Spa · Lens',50.436,2.835,IMG.spa],['room','Suite Velours','Love room fictive · Arras',50.287,2.781,IMG.room],['room','Écrin Secret','Love room fictive · Le Touquet',50.524,1.585,IMG.room],['event','Nuit Velours','Soirée fictive · Lille · samedi',50.641,3.075,IMG.party],['event','Parenthèse à deux','Week-end fictif · Côte d’Opale',50.516,1.597,IMG.party]];let map,markers=[];function icon(kind){const colors={member:'#9b4d71',club:'#c9a86a',spa:'#56b28a',room:'#6f7fd3',event:'#d66d7a'};return L.divIcon({className:'',html:`<div style="width:22px;height:22px;border-radius:50%;background:${colors[kind]};border:3px solid white;box-shadow:0 4px 14px #0008"></div>`,iconSize:[22,22],iconAnchor:[11,11]})}function initMap(){if(map)return;map=L.map('map',{zoomControl:true}).setView([50.50,2.85],9);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);renderMap('all')}function renderMap(filter){markers.forEach(m=>map.removeLayer(m));markers=[];const list=points.filter(p=>filter==='all'||p[0]===filter);document.getElementById('mapResults').innerHTML=list.map((p,i)=>`<div class="result" onclick="focusPoint('${p[1]}')"><strong><span class="dot ${p[0]}"></span>${p[1]}</strong><br><small class="muted">${p[2]}</small></div>`).join('');list.forEach(p=>{const m=L.marker([p[3],p[4]],{icon:icon(p[0])}).addTo(map).bindPopup(`<strong>${p[1]}</strong><br>${p[2]}<br><br><button onclick="openMapDetail('${p[1]}')" style="border:0;border-radius:999px;padding:8px 12px;background:#712440;color:white;cursor:pointer">Voir la fiche</button>`);m._velvetName=p[1];markers.push(m)})}window.focusPoint=name=>{const m=markers.find(x=>x._velvetName===name);if(m){map.setView(m.getLatLng(),13);m.openPopup()}};window.openMapDetail=name=>{const p=points.find(x=>x[1]===name);modal(name,`<div class="profile-head"><div class="portrait" style="background-image:url('${p[5]}')"></div><div><span class="tag">${p[0]}</span><h1>${p[1]}</h1><p class="muted">${p[2]}</p><p>${p[0]==='member'?'Localisation volontairement approximative afin de protéger la confidentialité du membre.':'Cette fiche est reliée aux informations, événements et participants de la démo Velvet.'}</p><button class="btn" onclick="toast('Fiche ouverte dans le parcours Zwit')">Explorer</button> <button class="btn secondary" onclick="toast('Ajouté aux favoris')">Favori</button></div></div>`)};function openOverlay(id){document.querySelectorAll('.overlay').forEach(x=>x.classList.remove('open'));document.getElementById(id).classList.add('open');if(id==='mapOverlay')setTimeout(()=>{initMap();map.invalidateSize()},100)}document.getElementById('profilesBtn').onclick=()=>openOverlay('profilesOverlay');document.getElementById('mapBtn').onclick=()=>openOverlay('mapOverlay');document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('.overlay').classList.remove('open'));document.getElementById('modalClose').onclick=()=>document.getElementById('modal').classList.remove('open');document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('open')};document.getElementById('profileSearch').oninput=renderProfiles;document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{type=b.dataset.type;document.querySelectorAll('[data-type]').forEach(x=>x.classList.toggle('active',x===b));renderProfiles()});document.querySelectorAll('[data-map]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-map]').forEach(x=>x.classList.toggle('active',x===b));renderMap(b.dataset.map)});document.getElementById('locate').onclick=()=>{if(!navigator.geolocation)return toast('Géolocalisation indisponible');navigator.geolocation.getCurrentPosition(p=>{map.setView([p.coords.latitude,p.coords.longitude],12);L.marker([p.coords.latitude,p.coords.longitude]).addTo(map).bindPopup('Votre position approximative').openPopup()},()=>toast('Autorisation de localisation refusée'))};renderProfiles();</script></body></html>
