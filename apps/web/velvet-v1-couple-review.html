iv class="stat"><strong>2</strong>sorties à venir</div><div class="stat"><strong>5</strong>messages récents</div></div><div class="grid g2"><section><h2>Profils qui vous correspondent</h2><div class="grid g2">${profiles.slice(0,4).map(profileCard).join('')}</div></section><section><h2>Dernières informations</h2><div class="card">${profiles.map(p=>`<div class="notif" data-member="${p.id}"><img class="avatar" src="${p.img}"><div><strong>${p.name}</strong><div class="muted">${p.activity[0]}</div></div><small class="muted">Récent</small></div>`).join('')}</div><h2 style="margin-top:22px">Votre prochaine sortie</h2><div class="card"><div class="cover" style="background-image:url('${events[0].img}')"></div><div class="pad"><h3>${events[0].name}</h3><p class="muted">${events[0].date} · ${events[0].place}</p><button class="btn" data-go="events">Voir la sortie</button></div></div></section></div>`}function discover(){return `<div class="eyebrow">Recherche affinitaire</div><h1 class="hero">Découvrir</h1><div class="card pad"><div class="formgrid"><div class="field"><label>Recherche</label><input id="dsearch" placeholder="Nom, ville, envie…"></div><div class="field"><label>Type de profil</label><select id="dtype"><option value="">Tous</option><option>Couple</option><option>Femme seule</option><option>Couple de femmes</option></select></div><div class="field"><label>Compatibilité minimum</label><select id="dcompat"><option value="0">Toutes</option><option value="80">80 %</option><option value="85">85 %</option><option value="90">90 %</option></select></div><div class="field"><label>Ville</label><input id="dcity" placeholder="Lille, Lens, Arras…"></div></div></div><div id="discoverResults" class="grid g3" style="margin-top:18px">${profiles.map(profileCard).join('')}</div>`}function member(){const p=profiles.find(x=>x.id===currentProfile)||profiles[0];return `<button class="btn secondary" data-go="${current==='member'?'discover':'home'}">← Retour</button><div class="profileHero" style="background-image:url('${p.img}');margin-top:14px"><div class="heroCopy"><div class="eyebrow">${p.type} · ${p.city}</div><h1 class="hero">${p.name}</h1><p>${p.age} · Compatibilité ${p.compat}% · Trust ${p.trust}</p><div class="actions"><button class="btn" data-chat="${p.id}">Écrire</button><button class="btn secondary" data-fav="${p.id}">${state.favs.includes(p.id)?'Retirer des favoris':'Ajouter aux favoris'}</button><button class="btn secondary" data-album="${p.id}">Demander l’album privé</button></div></div></div><div class="tabs"><button class="active">Vue d’ensemble</button><button>Albums</button><button>Sorties</button><button>Recommandations</button><button>Actualité</button></div><div class="grid g2"><div class="grid"><div class="card pad"><h2>À propos</h2><p>${p.story}</p></div><div class="card pad"><h2>Leur recherche</h2><p>${p.search}</p><div class="chips">${p.tags.map(t=>`<span class="chip">${t}</span>`).join('')}</div></div><div class="card pad"><h2>Limites</h2><div class="chips">${p.limits.map(t=>`<span class="chip">${t}</span>`).join('')}</div></div></div><div class="grid"><div class="card pad"><h2>Albums</h2><div class="gallery">${p.albums.map(a=>`<div style="background-image:url('${a[2]}')" data-photo="${a[0]}"></div>`).join('')}</div><p class="muted">Les albums privés nécessitent une autorisation explicite.</p></div><div class="card pad"><h2>Sorties</h2><div class="timeline">${p.events.map(e=>`<div>${e}</div>`).join('')}</div></div></div></div><div class="grid g2" style="margin-top:18px"><div class="card pad"><h2>Recommandations</h2>${p.reco.map(r=>`<p>“${r}”</p>`).join('')}</div><div class="card pad"><h2>Dernières informations</h2>${p.activity.map(a=>`<p>• ${a}</p>`).join('')}</div></div>`}function maps(){return `<div class="eyebrow">Autour de vous</div><h1 class="hero">Maps</h1><div class="tabs" id="mapFilters"><button class="active" data-mapfilter="all">Tout</button><button data-mapfilter="members">Membres</button><button data-mapfilter="venues">Établissements</button></div><div class="mapwrap"><div id="map" class="map"></div><div class="card resultlist" id="mapResults"></div></div>`}function conversations(){const p=profiles.find(x=>x.id===currentChat)||profiles[0];const chats=state.messages[currentChat]||[];return `<div class="eyebrow">Messagerie</div><h1 class="hero">Conversations</h1><div class="messenger"><div class="chat-list">${profiles.slice(0,3).map(x=>`<div class="thread ${x.id===currentChat?'active':''}" data-thread="${x.id}"><img class="avatar" src="${x.img}" data-member="${x.id}"><div><strong>${x.name}</strong><div class="muted">${(state.messages[x.id]||[]).slice(-1)[0]?.[2]||'Nouvelle conversation'}</div></div><small class="muted">${(state.messages[x.id]||[]).length}</small></div>`).join('')}</div><div class="chat-main"><div class="chatbar"><div style="display:flex;align-items:center;gap:10px"><img class="avatar" src="${p.img}" data-member="${p.id}"><div><strong>${p.name}</strong><div class="muted">Cliquez sur la photo pour voir la fiche</div></div></div><button class="round" data-member="${p.id}">i</button></div><div class="messages" id="messageList">${chats.map(m=>`<div class="bubble ${m[1]}"><div class="sender">${m[0]}</div>${m[2]}</div>`).join('')}</div><div class="composer"><input id="msg" placeholder="Écrire un message…"><button class="btn" id="sendMsg">Envoyer</button></div></div><aside class="chat-info"><img class="avatar" style="width:84px;height:84px" src="${p.img}" data-member="${p.id}"><h3>${p.name}</h3><p class="muted">${p.bio}</p><button class="btn secondary" data-member="${p.id}">Voir la fiche</button></aside></div>`}function outings(){return `<div class="eyebrow">Agenda</div><h1 class="hero">Sorties</h1><div class="grid g3">${events.map(e=>`<div class="card"><div class="cover" style="background-image:url('${e.img}')"></div><div class="pad"><h3>${e.name}</h3><p class="muted">${e.date}<br>${e.place} · ${e.going} participants</p><button class="btn" data-join="${e.id}">Demander à participer</button></div></div>`).join('')}</div>`}function venueList(){return `<div class="eyebrow">Clubs, spas et love rooms</div><h1 class="hero">Établissements</h1><div class="grid g3">${venues.map(v=>`<article class="card" data-venue="${v.id}"><div class="cover" style="background-image:url('${v.img}')"></div><div class="pad"><div class="row"><h3>${v.name}</h3><span class="chip">${v.type}</span></div><p class="muted">${v.city}</p><p>${v.desc}</p><button class="btn" data-venue="${v.id}">Voir le mini-site</button></div></article>`).join('')}</div>`}function venuePage(){const v=venues.find(x=>x.id===currentVenue)||venues[0];return `<button class="btn secondary" data-go="venues">← Retour aux établissements</button><div class="profileHero" style="background-image:url('${v.img}');margin-top:14px"><div class="heroCopy"><div class="eyebrow">${v.type} · ${v.city}</div><h1 class="hero">${v.name}</h1><p>${v.address}</p><div class="actions"><button class="btn" data-book="${v.id}">Réserver / contacter</button><button class="btn secondary" data-route="${v.id}">Itinéraire</button><button class="btn secondary" data-fav="${v.id}">${state.favs.includes(v.id)?'Retirer des favoris':'Ajouter aux favoris'}</button></div></div></div><div class="grid g2" style="margin-top:18px"><div class="grid"><div class="card pad"><h2>Présentation</h2><p>${v.desc}</p><div class="chips">${v.equip.map(e=>`<span class="chip">${e}</span>`).join('')}</div></div><div class="card pad"><h2>Horaires</h2>${v.hours.map(h=>`<p>${h}</p>`).join('')}</div><div class="card pad"><h2>Tarifs</h2>${v.prices.map(p=>`<p>${p}</p>`).join('')}</div></div><div class="grid"><div class="card pad"><h2>Agenda</h2>${v.agenda.map(a=>`<div class="notice" style="margin-bottom:8px">${a}<br><small class="muted">Aurélie & François, Claire et d’autres membres participent.</small></div>`).join('')}</div><div class="card pad"><h2>Photos</h2><div class="gallery"><div style="background-image:url('${v.img}')"></div><div style="background-image:url('${IMG.club}')"></div><div style="background-image:url('${IMG.spa}')"></div></div></div></div></div><div class="card pad" style="margin-top:18px"><h2>Recommandations des membres</h2>${v.reco.map(r=>`<p>“${r}”</p>`).join('')}</div>`}function notifications(){const items=[['like',profiles[2],'Claire a aimé une de vos photos publiques.','Voir son profil'],['message',profiles[0],'Aurélie vous a envoyé un nouveau message.','Ouvrir la conversation'],['visit',profiles[1],'Élodie & Marc ont consulté votre profil ce matin.','Voir leur profil'],['album',profiles[3],'Julie & Manon ont accepté votre demande d’album privé.','Voir leur album'],['event',profiles[0],'Nuit Velours approche : 3 profils compatibles y participent.','Voir la sortie']];return `<div class="eyebrow">Votre activité</div><h1 class="hero">Notifications</h1><div class="card">${items.map((n,i)=>`<div class="notif" data-notif="${i}"><img class="avatar" src="${n[1].img}"><div><strong>${n[2]}</strong><div class="muted">${n[3]}</div></div><small class="muted">${i+1} h</small></div>`).join('')}</div>`}function me(){return `<div class="eyebrow">Votre identité Velvet</div><div class="row"><h1 class="hero">Céline & Cyril</h1><button class="btn" id="editProfile">Modifier</button></div><div class="profileHero" style="background-image:url('${IMG.c1}')"><div class="heroCopy"><h2>Un couple complice, amoureux et curieux</h2><p>${state.profile.couple}</p></div></div><div class="grid g2" style="margin-top:18px"><div class="card pad"><h2>Notre histoire</h2><p>${state.profile.history}</p><h3>Notre recherche</h3><p>${state.profile.search}</p><h3>Pratiques</h3><p>${state.profile.practices}</p><h3>Limites</h3><p>${state.profile.limits}</p></div><div class="grid"><div class="card pad"><h2>Céline</h2><img class="avatar" style="width:90px;height:90px" src="${IMG.w1}"><p>${state.profile.celine}</p></div><div class="card pad"><h2>Cyril</h2><img class="avatar" style="width:90px;height:90px" src="${IMG.m1}"><p>${state.profile.cyril}</p></div></div></div><div class="grid g2" style="margin-top:18px"><div class="card pad"><h2>Nos albums</h2><div class="gallery"><div style="background-image:url('${IMG.c1}')"></div><div style="background-image:url('${IMG.party}')"></div><div style="background-image:url('${IMG.room}')"></div></div><p class="muted">Public · Privé · Temporaire</p></div><div class="card pad"><h2>Nos sorties</h2><div class="timeline"><div>Nuit Velours · 31 juillet · à venir</div><div>Évasion Spa · 8 août · à confirmer</div><div>Week-end Côte d’Opale · mai 2026 · passé</div></div></div></div><div class="grid g2" style="margin-top:18px"><div class="card pad"><h2>Nos recommandations</h2><p>“Un couple tendre, respectueux et toujours à l’écoute.” — Aurélie & François</p><p>“Une vraie complicité et beaucoup de bienveillance.” — Claire</p></div><div class="card pad"><h2>Confidentialité</h2><p>Visibilité actuelle : <strong>${state.profile.visibility}</strong></p><p>Trust Index : <strong>88</strong></p><p>Profil couple vérifié · double consentement actif.</p></div></div>`}function editProfile(){return `<div class="eyebrow">Modifier votre profil</div><h1 class="hero">Édition</h1><div class="card pad"><div class="formgrid">${[['couple','Présentation du couple'],['history','Notre histoire'],['search','Notre recherche'],['celine','Céline'],['cyril','Cyril'],['practices','Pratiques'],['limits','Limites']].map(x=>`<div class="field"><label>${x[1]}</label><textarea id="f_${x[0]}" rows="4">${state.profile[x[0]]}</textarea></div>`).join('')}<div class="field"><label>Visibilité</label><select id="f_visibility"><option ${state.profile.visibility==='Membres vérifiés'?'selected':''}>Membres vérifiés</option><option ${state.profile.visibility==='Profils compatibles'?'selected':''}>Profils compatibles</option><option ${state.profile.visibility==='Privé'?'selected':''}>Privé</option></select></div></div><div class="actions" style="margin-top:18px"><button class="btn" id="saveProfile">Enregistrer</button><button class="btn secondary" data-go="me">Annuler</button></div></div>`}function render(){renderNav();content.innerHTML=current==='home'?home():current==='discover'?discover():current==='member'?member():current==='maps'?maps():current==='messages'?conversations():current==='events'?outings():current==='venues'?venueList():current==='venue'?venuePage():current==='notifications'?notifications():current==='edit'?editProfile():me();bind();if(current==='maps')setTimeout(initMap,50)}function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll('[data-member]').forEach(b=>b.onclick=e=>{e.stopPropagation();go('member',b.dataset.member)});document.querySelectorAll('[data-venue]').forEach(b=>b.onclick=e=>{e.stopPropagation();go('venue',b.dataset.venue)});document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{const id=b.dataset.fav;state.favs=state.favs.includes(id)?state.favs.filter(x=>x!==id):[...state.favs,id];save();toast('Favoris mis à jour');render()});document.querySelectorAll('[data-album]').forEach(b=>b.onclick=()=>toast('Demande d’album privé envoyée'));document.querySelectorAll('[data-chat]').forEach(b=>b.onclick=()=>{currentChat=b.dataset.chat;go('messages')});document.querySelectorAll('[data-thread]').forEach(b=>b.onclick=()=>{currentChat=b.dataset.thread;render()});document.querySelectorAll('[data-join]').forEach(b=>b.onclick=()=>toast('Demande de participation envoyée pour validation du couple'));document.querySelectorAll('[data-book]').forEach(b=>b.onclick=()=>toast('Demande de réservation enregistrée'));document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>window.open('https://www.openstreetmap.org','_blank'));document.querySelectorAll('[data-photo]').forEach(b=>b.onclick=()=>toast('Galerie ouverte : '+b.dataset.photo));if(dsearch){const f=()=>{const q=dsearch.value.toLowerCase(),t=dtype.value,c=+dcompat.value,city=dcity.value.toLowerCase();discoverResults.innerHTML=profiles.filter(p=>(!q||JSON.stringify(p).toLowerCase().includes(q))&&(!t||p.type===t)&&p.compat>=c&&(!city||p.city.toLowerCase().includes(city))).map(profileCard).join('')||'<div class="notice">Aucun profil ne correspond à ces critères.</div>';bind()};[dsearch,dtype,dcompat,dcity].forEach(x=>x.oninput=f)}if(sendMsg)sendMsg.onclick=()=>{if(!msg.value.trim())return;state.messages[currentChat]=state.messages[currentChat]||[];state.messages[currentChat].push(['Céline & Cyril','out',msg.value.trim()]);save();render()};if(editProfile)editProfile.onclick=()=>go('edit');if(saveProfile)saveProfile.onclick=()=>{['couple','history','search','celine','cyril','practices','limits'].forEach(k=>state.profile[k]=document.getElementById('f_'+k).value);state.profile.visibility=f_visibility.value;save();toast('Profil enregistré');go('me')};document.querySelectorAll('[data-notif]').forEach((b,i)=>b.onclick=()=>{if(i===1){currentChat='af';go('messages')}else if(i===4)go('events');else go('member',profiles[[2,0,1,3][i]||0].id)})}function initMap(){if(map){map.remove();map=null}map=L.map('map').setView([50.45,2.9],9);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);const html=[];profiles.forEach(p=>{const icon=L.divIcon({className:'',html:`<img class="photo-marker" src="${p.img}">`,iconSize:[46,46],iconAnchor:[23,23]});L.marker([p.lat,p.lon],{icon}).addTo(map).on('click',()=>go('member',p.id));html.push(`<div class="result" data-member="${p.id}"><strong>${p.name}</strong><div class="muted">${p.city} · ${p.compat}% compatible</div></div>`)});venues.forEach(v=>{const icon=L.divIcon({className:'',html:`<div class="place-marker">${v.type==='Club'?'C':v.type==='Spa'?'S':'L'}</div>`,iconSize:[42,42],iconAnchor:[21,21]});L.marker([v.lat,v.lon],{icon}).addTo(map).on('click',()=>go('venue',v.id));html.push(`<div class="result" data-venue="${v.id}"><strong>${v.name}</strong><div class="muted">${v.type} · ${v.city}</div></div>`)});mapResults.innerHTML=html.join('');bind()}globalSearch.onkeydown=e=>{if(e.key==='Enter'){current='discover';render();dsearch.value=globalSearch.value;dsearch.dispatchEvent(new Event('input'))}};privacy.onclick=()=>toast('Mode discret activé pour cette session');render();</script></body></html>
