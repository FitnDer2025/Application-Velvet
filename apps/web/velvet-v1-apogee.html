ng:.2em;text-transform:uppercase;color:var(--gold)}h1,h2,h3{font-family:Playfair Display}.hero{font-size:clamp(42px,5vw,68px);line-height:1;margin:8px 0}.muted{color:var(--muted)}.grid{display:grid;gap:17px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.card{border:1px solid var(--line);border-radius:21px;background:linear-gradient(145deg,#ffffff0c,#ffffff04);overflow:hidden}.pad{padding:19px}.cover{height:245px;background-size:cover;background-position:center;position:relative}.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,#000d)}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.btn{border:0;border-radius:999px;padding:11px 16px;color:white;background:linear-gradient(135deg,#8a3055,var(--burg));cursor:pointer}.btn.secondary{background:transparent;color:var(--gold);border:1px solid #c9a86a66}.round{width:41px;height:41px;border-radius:50%;border:1px solid var(--line);background:#18181b;color:white;cursor:pointer}.chip{display:inline-flex;border-radius:999px;border:1px solid var(--line);padding:7px 10px;font-size:11px}.chips{display:flex;flex-wrap:wrap;gap:7px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.stat{padding:17px;border:1px solid var(--line);border-radius:16px;background:#ffffff06}.stat strong{display:block;color:var(--gold);font-size:26px}.storyrow{display:flex;gap:13px;overflow:auto;padding:8px 0 18px}.story{min-width:85px;text-align:center;cursor:pointer}.story img{width:66px;height:66px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);padding:2px}.person-card{cursor:pointer}.person-card:hover{transform:translateY(-2px);transition:.2s}.actions{display:flex;gap:8px;flex-wrap:wrap}.tabs{display:flex;gap:8px;overflow:auto;padding:14px 0}.tabs button{white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:10px 13px;background:#17171a;color:var(--muted);cursor:pointe 9,lon:2.776},{id:'cl',name:'Claire',type:'Femme seule',city:'Lens',age:'35 ans',compat:88,trust:92,img:IMG.w1,bio:'Féminine, posée et bi-curieuse. Elle aime les couples bienveillants et les ambiances élégantes.',tags:['Trios F','Dîner','Spa'],lat:50.431,lon:2.832},{id:'jm',name:'Julie & Manon',type:'Couple de femmes',city:'Lille',age:'33 & 35 ans',compat:84,trust:89,img:IMG.w2,bio:'Un duo joyeux, tendre et curieux, toujours guidé par le feeling.',tags:['Femmes','Couples','Soirées'],lat:50.646,lon:3.071},{id:'nt',name:'Nathalie & Thomas',type:'Couple',city:'Douai',age:'40 & 42 ans',compat:82,trust:91,img:IMG.c1,bio:'Épicuriens et sociables, ils aiment préparer une sortie puis laisser place à l’imprévu.',tags:['Clubs','Dîner','Voyages'],lat:50.371,lon:3.08},{id:'sa',name:'Sophie & Alain',type:'Couple',city:'Béthune',age:'37 & 43 ans',compat:79,trust:87,img:IMG.c2,bio:'Un couple discret, rassurant et attaché à la confidentialité.',tags:['Love room','Spa','Soft'],lat:50.531,lon:2.641}];const places=[{id:'op',name:'O’Pulsions',type:'Club',city:'Lille',img:IMG.club,lat:50.626,lon:3.04,desc:'Club convivial, soirées couples et événements thématiques.'},{id:'tt',name:'La Tentation',type:'Club',city:'Belgique',img:IMG.club,lat:50.7,lon:3.16,desc:'Espace festif premium, piste, lounge et espaces de détente.'},{id:'or',name:'O’Relax',type:'Spa',city:'Hauts-de-France',img:IMG.spa,lat:50.49,lon:2.86,desc:'Spa libertin, espaces bien-être et soirées à thème.'},{id:'lr1',name:'Suite Velours',type:'Love room',city:'Arras',img:IMG.room,lat:50.285,lon:2.77,desc:'Suite privative avec spa, ambiance feutrée et réservation discrète.'},{id:'lr2',name:'L’Écrin Noir',type:'Love room',city:'Lens',img:IMG.room,lat:50.435,lon:2.84,desc:'Love room fictive de démonstration, proche des lieux de sortie.'}];const events=[{id:'e1',name:'Nuit Velours',place:'O’Pulsions',date:'Vendredi 31 juillet · 22h',img:IMG.party,going:43},{id:'e2',name:'Évasion Spa',place:'O’Relax',date:'Samedi 8 août · 20h',img:IMG.spa,going:28},{id:'e3',name:'Dîner confidentiel',place:'Arras',date:'Samedi 15 août · 19h30',img:IMG.room,going:16}];let state=JSON.parse(localStorage.getItem('velvetApogee')||'{}');state.favs=state.favs||[];state.albumRequests=state.albumRequests||[];state.messages=state.messages||{};state.profile=state.profile||{title:'Céline & Cyril',city:'Hauts-de-France',bio:'Couple très complice, fusionnel et profondément amoureux. Nous aimons les connexions sincères, les échanges naturels et les moments partagés dans une ambiance simple, élégante et bienveillante.',search:'Couples complices et femmes seules, avec une vraie attention portée au feeling, au respect et à la sensualité.',practices:'Mélangisme, soft swap, triolisme F, spa, soirées privées',limits:'Pression, vulgarité, manque d’hygiène, absence de dialogue',visibility:'Membres vérifiés'};const save=()=>localStorage.setItem('velvetApogee',JSON.stringify(state));const navItems=[['home','Accueil'],['discover','Découvrir'],['profiles','Profils'],['map','Maps'],['messages','Conversations'],['events','Sorties'],['places','Établissements'],['notifications','Notifications'],['me','Mon profil']];document.getElementById('nav').innerHTML=navItems.map(x=>`<button data-go="${x[0]}">${x[1]}</button>`).join('');document.getElementById('mobilebar').innerHTML=[['home','Accueil'],['discover','Découvrir'],['map','Maps'],['messages','Messages'],['me','Profil']].map(x=>`<button data-go="${x[0]}">${x[1]}</button>`).join('');const toast=t=>{const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)};const modal=(title,body)=>{document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modal').classList.add('open')};document.getElementById('closeModal').onclick=()=>document.getElementById('modal').classList.remove('open');const card=p=>`<article class="card person-card" data-profile="${p.id}"><div class="cover" style="background-image:url('${p.img}')"></div><div class="pad"><div class="row"><h3>${p.name}</h3><span class="chip">${p.compat}%</span></div><p class="muted">${p.type} · ${p.age} · ${p.city}</p><p>${p.bio}</p><div class="chips">${p.tags.map(t=>`<span class="chip">${t}</span>`).join('')}</div><div class="actions" style="margin-top:14px"><button class="btn" data-message="${p.id}">Message</button><button class="btn secondary" data-fav="${p.id}">${state.favs.includes(p.id)?'Retirer':'Favori'}</button></div></div></article>`;function go(id){document.querySelectorAll('[data-go]').forEach(b=>b.classList.toggle('active',b.dataset.go===id));render(id);window.scrollTo(0,0)}function render(id){const c=document.getElementById('content');if(id==='home')c.innerHTML=home();if(id==='discover')c.innerHTML=discover();if(id==='profiles')c.innerHTML=profilesView(profiles);if(id==='map'){c.innerHTML=mapView();setTimeout(initMap,50)}if(id==='messages')c.innerHTML=messagesView();if(id==='events')c.innerHTML=eventsView();if(id==='places')c.innerHTML=placesView();if(id==='notifications')c.innerHTML=notificationsView();if(id==='me')c.innerHTML=meView();bind()}function home(){return `<div class="eyebrow">Votre espace privé</div><h1 class="hero">Bonsoir Céline & Cyril.</h1><p class="muted">Préparez votre prochaine sortie, retrouvez vos échanges et découvrez les profils qui vous correspondent.</p><div class="storyrow">${profiles.map(p=>`<div class="story" data-profile="${p.id}"><img src="${p.img}"><small>${p.name.split(' ')[0]}</small></div>`).join('')}</div><div class="stats"><div class="stat"><strong>88</strong>Trust Index</div><div class="stat"><strong>12</strong>Nouveaux profils</div><div class="stat"><strong>3</strong>Sorties suggérées</div><div class="stat"><strong>${state.favs.length}</strong>Favoris</div></div><div class="g2 grid"><section><div class="row"><h2>Pour vous</h2><button class="btn secondary" data-go="discover">Tout découvrir</button></div><div class="grid">${profiles.slice(0,2).map(card).join('')}</div></section><section><div class="row"><h2>Votre prochaine soirée</h2><button class="btn secondary" data-go="events">Agenda</button></div><article class="card"><div class="cover" style="background-image:url('${events[0].img}')"></div><div class="pad"><span class="eyebrow">${events[0].date}</span><h2>${events[0].name}</h2><p>${events[0].place} · ${events[0].going} participants</p><div class="actions"><button class="btn" data-join="${events[0].id}">Participer</button><button class="btn secondary" data-chat-event="${events[0].id}">Chat soirée</button></div></div></article><article class="card pad" style="margin-top:17px"><h3>Activité récente</h3><p>• Aurélie & François ont confirmé leur présence à Nuit Velours.</p><p>• Claire a publié une nouvelle story.</p><p>• O’Relax a ouvert 8 places pour Évasion Spa.</p></article></section></div>`}function discover(){return `<div class="row"><div><div class="eyebrow">Affinités & consentement</div><h1>Découvrir</h1></div><button class="btn secondary" id="shuffle">Nouvelles suggestions</button></div><div class="tabs" id="filters"><button class="active" data-filter="all">Tous</button><button data-filter="Couple">Couples</button><button data-filter="Femme seule">Femmes seules</button><button data-filter="Couple de femmes">Couples de femmes</button></div><div id="discoverGrid" class="g3 grid">${profiles.slice(0,3).map(card).join('')}</div>`}function profilesView(list){return `<div class="row"><div><div class="eyebrow">Communauté</div><h1>Profils</h1></div><span class="chip">${list.length} membres visibles</span></div><div class="g3 grid">${list.map(card).join('')}</div>`}function mapView(){return `<div class="row"><div><div class="eyebrow">À proximité</div><h1>Maps</h1></div><button class="btn secondary" id="locate">Me localiser</button></div><div class="tabs" id="mapfilters"><button class="active" data-mapfilter="all">Tout</button><button data-mapfilter="member">Membres</button><button data-mapfilter="Club">Clubs</button><button data-mapfilter="Spa">Spas</button><button data-mapfilter="Love room">Love rooms</button></div><div class="mapwrap"><div id="map" class="map"></div><div class="card resultlist" id="mapresults"></div></div>`}let mapObj,layer;function initMap(filter='all'){if(mapObj)mapObj.remove();mapObj=L.map('map').setView([50.48,2.9],9);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(mapObj);layer=L.layerGroup().addTo(mapObj);drawMap(filter)}function drawMap(filter){layer.clearLayers();let rows=[];if(filter==='all'||filter==='member')profiles.forEach(p=>{L.marker([p.lat,p.lon]).addTo(layer).bindPopup(`<b>${p.name}</b><br>${p.city}<br><button onclick="window.openProfile('${p.id}')">Voir le profil</button>`);rows.push({name:p.name,type:'Membre',city:p.city,id:p.id})});places.filter(p=>filter==='all'||p.type===filter).forEach(p=>{L.marker([p.lat,p.lon]).addTo(layer).bindPopup(`<b>${p.name}</b><br>${p.type} · ${p.city}<br><button onclick="window.openPlace('${p.id}')">Voir la fiche</button>`);rows.push({name:p.name,type:p.type,city:p.city,id:p.id,place:true})});document.getElementById('mapresults').innerHTML=rows.map(r=>`<div class="result" ${r.place?`data-place="${r.id}"`:`data-profile="${r.id}"`}><strong>${r.name}</strong><br><small class="muted">${r.type} · ${r.city}</small></div>`).join('');bind()}window.openProfile=id=>profileModal(profiles.find(p=>p.id===id));window.openPlace=id=>placeModal(places.find(p=>p.id===id));function messagesView(){const p=profiles[0],msgs=state.messages[p.id]||['Bonjour les amoureux, merci pour votre message. Votre façon de voir les choses nous parle beaucoup.','Avec plaisir pour échanger avant une prochaine sortie.'];return `<div class="messenger"><div class="chat-list">${profiles.map((x,i)=>`<div class="thread ${i===0?'active':''}" data-thread="${x.id}"><img class="avatar" src="${x.img}"><div><strong>${x.name}</strong><br><small class="muted">${i?'On reste en contact…':'Avec plaisir pour échanger…'}</small></div><small>${i?'Hier':'10:42'}</small></div>`).join('')}</div><div class="chat-main"><div class="chatbar"><div class="row"><img class="avatar" src="${p.img}"><div><strong>${p.name}</strong><br><small class="muted">en ligne récemment</small></div></div><div><button class="round" data-profile="${p.id}">ⓘ</button></div></div><div class="messages" id="messagesBox">${msgs.map((m,i)=>`<div class="bubble ${i%2?'out':'in'}">${m}</div>`).join('')}</div><div class="composer"><button class="round" id="attach">＋</button><input id="msgInput" placeholder="Écrire un message…"><button class="btn" id="sendMsg">Envoyer</button></div></div></div>`}function eventsView(){return `<div class="row"><div><div class="eyebrow">Agenda Velvet</div><h1>Sorties</h1></div><button class="btn secondary" id="calendar">Ajouter au calendrier</button></div><div class="grid">${events.map(e=>`<article class="card"><div class="g2"><div class="cover" style="background-image:url('${e.img}')"></div><div class="pad"><span class="eyebrow">${e.date}</span><h2>${e.name}</h2><p>${e.place} · ${e.going} participants</p><p class="muted">Chat, participants, covoiturage discret, albums après la soirée et avis communautaires.</p><div class="actions"><button class="btn" data-join="${e.id}">Demander à participer</button><button class="btn secondary" data-chat-event="${e.id}">Ouvrir le chat</button></div></div></div></article>`).join('')}</div>`}function placesView(){return `<div class="row"><div><div class="eyebrow">Clubs, spas & séjours</div><h1>Établissements</h1></div><button class="btn secondary" data-go="map">Voir sur Maps</button></div><div class="g3 grid">${places.map(p=>`<article class="card"><div class="cover" style="background-image:url('${p.img}')"></div><div class="pad"><span class="chip">${p.type}</span><h2>${p.name}</h2><p>${p.city}</p><p class="muted">${p.desc}</p><div class="actions"><button class="btn" data-place="${p.id}">Voir la fiche</button><button class="btn secondary" data-fav="place-${p.id}">${state.favs.includes('place-'+p.id)?'Retirer':'Favori'}</button></div></div></article>`).join('')}</div>`}function notificationsView(){return `<div class="eyebrow">Activité</div><h1>Notifications</h1><div class="card">${[['Aurélie & François','ont répondu à votre message','af'],['Nuit Velours','Votre demande de participation est prête à être confirmée','e1'],['Claire','a accepté votre demande d’album privé','cl'],['O’Relax','a publié une nouvelle soirée','or']].map((n,i)=>`<div class="result" ${i===1?`data-go="events"`:i===3?`data-place="or"`:`data-profile="${n[2]}"`}><strong>${n[0]}</strong><br><span class="muted">${n[1]}</span></div>`).join('')}</div>`}function meView(){const p=state.profile;return `<div class="profileHero" style="background-image:url('${IMG.c1}')"><div class="heroCopy"><span class="eyebrow">Couple vérifié · Trust 88</span><h1>${p.title}</h1><p>${p.city}</p><button class="btn" id="editProfile">Modifier</button></div></div><div class="stats"><div class="stat"><strong>88</strong>Trust</div><div class="stat"><strong>91%</strong>Profil complété</div><div class="stat"><strong>${state.favs.length}</strong>Favoris</div><div class="stat"><strong>7</strong>Recommandations</div></div><div class="g2 grid"><article class="card pad"><h2>Notre philosophie</h2><p>${p.bio}</p><h3>Nos recherches</h3><p>${p.search}</p><h3>Pratiques</h3><p>${p.practices}</p><h3>Limites</h3><p>${p.limits}</p></article><article class="card pad"><h2>Confidentialité</h2><p>Visibilité : <strong>${p.visibility}</strong></p><div class="notice">Les changements importants d’un profil couple sont soumis à une confirmation commune de Céline et Cyril.</div><h3>Albums</h3><div class="gallery"><div style="background-image:url('${IMG.c1}')"></div><div style="background-image:url('${IMG.w1}')"></div><div style="background-image:url('${IMG.m1}')"></div><div style="background-image:url('${IMG.party}')"></div><div style="background-image:url('${IMG.room}')"></div></div></article></div>`}function profileModal(p){modal(p.name,`<div class="profileHero" style="min-height:300px;background-image:url('${p.img}')"><div class="heroCopy"><span class="eyebrow">${p.type} · Trust ${p.trust}</span><h1>${p.name}</h1><p>${p.age} · ${p.city} · Compatibilité ${p.compat}%</p></div></div><p>${p.bio}</p><div class="chips">${p.tags.map(t=>`<span class="chip">${t}</span>`).join('')}</div><div class="actions" style="margin-top:16px"><button class="btn" data-message="${p.id}">Écrire</button><button class="btn secondary" data-album="${p.id}">${state.albumRequests.includes(p.id)?'Demande envoyée':'Demander l’album privé'}</button><button class="btn secondary" data-fav="${p.id}">${state.favs.includes(p.id)?'Retirer des favoris':'Ajouter aux favoris'}</button></div>`);bind()}function placeModal(p){modal(p.name,`<img src="${p.img}" style="width:100%;height:280px;object-fit:cover;border-radius:16px"><p><span class="chip">${p.type}</span> · ${p.city}</p><p>${p.desc}</p><div class="actions"><button class="btn" data-book="${p.id}">Simuler une réservation</button><button class="btn secondary" data-route="${p.id}">Itinéraire</button><button class="btn secondary" data-fav="place-${p.id}">Favori</button></div>`);bind()}function editProfile(){const p=state.profile;modal('Modifier notre profil',`<div class="notice">La sauvegarde simule la double validation du couple pour cette V1 de test.</div><div class="formgrid" style="margin-top:16px"><label class="field">Nom du profil<input id="fTitle" value="${p.title}"></label><label class="field">Ville<input id="fCity" value="${p.city}"></label><label class="field" style="grid-column:1/-1">Notre philosophie<textarea id="fBio" rows="5">${p.bio}</textarea></label><label class="field" style="grid-column:1/-1">Nos recherches<textarea id="fSearch" rows="4">${p.search}</textarea></label><label class="field">Pratiques<textarea id="fPractices" rows="4">${p.practices}</textarea></label><label class="field">Limites<textarea id="fLimits" rows="4">${p.limits}</textarea></label><label class="field">Visibilité<select id="fVisibility"><option>Membres vérifiés</option><option>Profils compatibles</option><option>Invisible en mode discret</option></select></label></div><div class="actions" style="margin-top:18px"><button class="btn" id="saveProfile">Valider ensemble et sauvegarder</button><button class="btn secondary" id="cancelEdit">Annuler</button></div>`);document.getElementById('saveProfile').onclick=()=>{state.profile={title:fTitle.value,city:fCity.value,bio:fBio.value,search:fSearch.value,practices:fPractices.value,limits:fLimits.value,visibility:fVisibility.value};save();document.getElementById('modal').classList.remove('open');toast('Profil sauvegardé après validation commune');go('me')};document.getElementById('cancelEdit').onclick=()=>document.getElementById('modal').classList.remove('open')}function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll('[data-profile]').forEach(b=>b.onclick=e=>{if(e.target.dataset.message||e.target.dataset.fav)return;profileModal(profiles.find(p=>p.id===b.dataset.profile))});document.querySelectorAll('[data-place]').forEach(b=>b.onclick=()=>placeModal(places.find(p=>p.id===b.dataset.place)));document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=e=>{e.stopPropagation();const id=b.dataset.fav;state.favs=state.favs.includes(id)?state.favs.filter(x=>x!==id):[...state.favs,id];save();toast(state.favs.includes(id)?'Ajouté aux favoris':'Retiré des favoris');render(document.querySelector('.nav button.active')?.dataset.go||'home')});document.querySelectorAll('[data-album]').forEach(b=>b.onclick=()=>{if(!state.albumRequests.includes(b.dataset.album))state.albumRequests.push(b.dataset.album);save();toast('Demande d’album envoyée');profileModal(profiles.find(p=>p.id===b.dataset.album))});document.querySelectorAll('[data-message]').forEach(b=>b.onclick=e=>{e.stopPropagation();document.getElementById('modal').classList.remove('open');go('messages');toast('Conversation ouverte')});document.querySelectorAll('[data-join]').forEach(b=>b.onclick=()=>{modal('Confirmation commune',`<p>La demande sera envoyée après confirmation des deux membres du couple.</p><label><input type="checkbox" id="c1"> Céline confirme</label><br><label><input type="checkbox" id="c2"> Cyril confirme</label><br><button class="btn" id="confirmJoin" style="margin-top:16px">Envoyer la demande</button>`);document.getElementById('confirmJoin').onclick=()=>{if(!c1.checked||!c2.checked)return toast('Les deux confirmations sont nécessaires');document.getElementById('modal').classList.remove('open');toast('Demande de participation envoyée')}});document.querySelectorAll('[data-chat-event]').forEach(b=>b.onclick=()=>{go('messages');toast('Chat de la soirée ouvert')});document.querySelectorAll('[data-book]').forEach(b=>b.onclick=()=>{modal('Réservation simulée',`<label class="field">Date<input type="date" id="bookDate"></label><label class="field">Type de profil<select><option>Couple</option><option>Femme seule</option><option>Homme seul</option></select></label><button class="btn" id="confirmBook" style="margin-top:16px">Confirmer</button>`);document.getElementById('confirmBook').onclick=()=>{document.getElementById('modal').classList.remove('open');toast('Réservation enregistrée dans la démo')}});document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>{const p=places.find(x=>x.id===b.dataset.route);window.open(`https://www.openstreetmap.org/?mlat=${p.lat}&mlon=${p.lon}#map=15/${p.lat}/${p.lon}`,'_blank')});if(document.getElementById('editProfile'))editProfile.onclick=editProfile;if(document.getElementById('shuffle'))shuffle.onclick=()=>{document.getElementById('discoverGrid').innerHTML=[...profiles].sort(()=>Math.random()-.5).slice(0,3).map(card).join('');bind()};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));const f=b.dataset.filter;document.getElementById('discoverGrid').innerHTML=profiles.filter(p=>f==='all'||p.type===f).map(card).join('');bind()});document.querySelectorAll('[data-mapfilter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mapfilter]').forEach(x=>x.classList.toggle('active',x===b));drawMap(b.dataset.mapfilter)});if(document.getElementById('locate'))locate.onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{mapObj.setView([p.coords.latitude,p.coords.longitude],12);L.circleMarker([p.coords.latitude,p.coords.longitude],{radius:8}).addTo(layer).bindPopup('Votre position approximative').openPopup()},()=>toast('Localisation non autorisée')):toast('Géolocalisation indisponible');if(document.getElementById('sendMsg'))sendMsg.onclick=()=>{const v=msgInput.value.trim();if(!v)return;state.messages.af=state.messages.af||[];state.messages.af.push(v);save();const d=document.createElement('div');d.className='bubble out';d.textContent=v;messagesBox.appendChild(d);msgInput.value='';messagesBox.scrollTop=messagesBox.scrollHeight};if(document.getElementById('attach'))attach.onclick=()=>modal('Partager',`<div class="g2 grid"><button class="btn" onclick="toast('Photo simulée ajoutée')">Photo</button><button class="btn" onclick="toast('Album partagé')">Album</button><button class="btn" onclick="toast('Invitation envoyée')">Invitation</button><button class="btn" onclick="toast('Position approximative partagée')">Position</button></div>`)}document.addEventListener('click',e=>{if(e.target.matches('[data-go]'))go(e.target.dataset.go)});document.getElementById('privacy').onclick=()=>{state.discreet=!state.discreet;save();toast(state.discreet?'Mode discret activé':'Mode discret désactivé')};document.getElementById('globalSearch').addEventListener('input',e=>{const q=e.target.value.toLowerCase().trim();if(q.length<2)return;const found=profiles.filter(p=>(p.name+p.city+p.type+p.tags.join(' ')).toLowerCase().includes(q));document.getElementById('content').innerHTML=profilesView(found);bind()});go('home');</script></body></html>
