function filterMembers(){const q=memberSearch.value.toLowerCase(),seg=memberSegment.value;memberResults.innerHTML=memberTable(MEMBERS.filter(m=>(!q||JSON.stringify(m).toLowerCase().includes(q))&&(!seg||m.tags.some(t=>t.includes(seg)))))}
function openMember(id){const m=member(id),history=S.bookings.filter(b=>b.member===id),note=S.memberNotes[id]??m.note;drawer.innerHTML=`<button class="btn ghost" onclick="closeDrawer()">Fermer</button><div class="drawer-hero" style="margin-top:14px"><img src="${m.img}"><div class="drawer-title"><div class="ey">${esc(m.type)} · ${esc(m.city)}</div><h2>${esc(m.name)}</h2></div></div><div class="kpis" style="grid-template-columns:repeat(3,1fr)"><div class="kpi"><small>Trust</small><b>${m.trust}</b></div><div class="kpi"><small>Visites</small><b>${m.visits}</b></div><div class="kpi"><small>Dépenses</small><b>${euro(m.spend)}</b></div></div><section class="card"><h3>Relation établissement</h3><p class="lead">${esc(note)}</p><div class="chips">${m.tags.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div></section><section class="card"><h3>Historique</h3>${history.length?history.map(b=>`<div class="check"><span>${esc(event(b.event).name)} · ${b.date}</span><b>${euro(b.total)}</b></div>`).join(''):'<p class="lead">Aucune réservation dans cet établissement.</p>'}</section><section class="card"><h3>Note interne</h3><textarea id="memberNote" style="width:100%;min-height:90px;background:#18181c;color:white;border:1px solid var(--line);border-radius:12px;padding:10px">${esc(note)}</textarea><button class="btn" style="margin-top:10px" onclick="saveMemberNote('${id}')">Enregistrer</button></section><div class="top-actions" style="margin-top:14px"><button class="btn secondary" onclick="closeDrawer();go('messages')">Écrire</button><button class="btn" onclick="openMemberInvite('${id}')">Inviter à une soirée</button></div>`;drawerBackdrop.classList.add('open')}
function saveMemberNote(id){S.memberNotes[id]=memberNote.value.trim();save();openMember(id);toastMsg('Note CRM enregistrée')}
function openSegmentCreator(){drawer.innerHTML=`<button class="btn ghost" onclick="closeDrawer()">Fermer</button><div class="ey" style="margin-top:16px">CRM</div><h2>Nouveau segment</h2><label class="field">Nom du segment<input id="segmentName" placeholder="Ex. Anniversaires août"></label><button class="btn" style="margin-top:14px" onclick="saveSegment()">Créer le segment</button>`;drawerBackdrop.classList.add('open')}
function saveSegment(){const name=segmentName.value.trim();if(!name)return;S.segments.push(name);save();closeDrawer();go('members');toastMsg('Segment créé')}
function openSegmentCampaign(){const seg=document.getElementById('memberSegment')?.value||'Tous les membres';drawer.innerHTML=`<button class="btn ghost" onclick="closeDrawer()">Fermer</button><div class="ey" style="margin-top:16px">Campagne ciblée</div><h2>${esc(seg)}</h2><label class="field">Objet<input id="campaignSubject" placeholder="Objet de la campagne"></label><label class="field" style="margin-top:12px">Message<textarea id="campaignMessage" placeholder="Votre message…"></textarea></label><button class="btn" style="margin-top:14px" onclick="sendSegmentCampaign('${esc(seg)}')">Envoyer la campagne</button>`;drawerBackdrop.classList.add('open')}
function sendSegmentCampaign(seg){const subject=campaignSubject.value.trim(),text=campaignMessage.value.trim();if(!subject||!text){toastMsg('Complétez l’objet et le message');return}S.campaigns.push({id:'c'+Date.now(),segment:seg,subject,text,date:new Date().toISOString()});save();closeDrawer();toastMsg('Campagne enregistrée et envoyée')}
function openMemberInvite(id){drawer.innerHTML=`<button class="btn ghost" onclick="openMember('${id}')">Retour</button><div class="ey" style="margin-top:16px">${esc(member(id).name)}</div><h2>Inviter à une soirée</h2>${venueEvents().map(e=>`<div class="check"><span><b>${esc(e.name)}</b><br>${e.day} ${e.month}</span><button class="btn secondary" onclick="inviteMember('${id}','${e.id}')">Inviter</button></div>`).join('')}`}
function inviteMember(memberId,eventId){if(!S.bookings.some(b=>b.member===memberId&&b.event===eventId)){S.bookings.push({id:'b'+Date.now(),event:eventId,member:memberId,people:member(memberId).type==='Couple'?2:1,total:0,payment:'invited',checkin:false,date:new Date().toLocaleDateString('fr-FR')});event(eventId).booked+=member(memberId).type==='Couple'?2:1;save()}openMember(memberId);toastMsg('Invitation enregistrée')}
function closeDrawer(){drawerBackdrop.classList.remove('open')}
function messagesPage(){
  const t=S.threads.find(x=>x.id===activeThread)||S.threads[0],m=member(t.member);t.unread=false;save();
  return `<div class="ey">Relation membres</div><h1>Questions & messages</h1><p class="lead">Répondez depuis Velvet et conservez le contexte de la réservation sans changer d’outil.</p><div class="inbox"><div class="threads">${S.threads.map(x=>{const mm=member(x.member);return `<div class="thread ${x.id===t.id?'active':''}" onclick="openThread('${x.id}')"><img src="${mm.img}"><div><b>${esc(mm.name)}</b><p>${esc(x.subject)}</p></div>${x.unread?'<span class="unread"></span>':''}</div>`}).join('')}</div><div class="conversation"><div class="chat-head"><div class="member"><img src="${m.img}"><div><b>${esc(m.name)}</b><small>${esc(t.subject)}</small></div></div><button class="btn secondary" onclick="openMember('${m.id}')">Voir le CRM</button></div><div class="chat-body">${t.messages.map(msg=>`<div class="bubble ${msg[0]==='Pro'?'out':''}">${esc(msg[1])}<small>${esc(msg[0])} · ${esc(msg[2])}</small></div>`).join('')}</div><div class="composer"><input id="reply" placeholder="Votre réponse…" onkeydown="if(event.key==='Enter')sendReply()"><button class="btn" onclick="sendReply()">Envoyer</button></div></div></div>`;
}
function openThread(id){activeThread=id;go('messages')}
function sendReply(){if(!reply.value.trim())return;const t=S.threads.find(x=>x.id===activeThread);t.messages.push(['Pro',reply.value.trim(),'À l’instant']);save();go('messages');toastMsg('Réponse envoyée')}
function financePage(){
  const events=venueEvents(),gross=events.reduce((n,e)=>n+e.revenue,0);
  return `<div class="ey">Transactions & reversements</div><h1>Paiements</h1><p class="lead">Suivez les encaissements, remboursements, commissions Velvet et reversements par établissement.</p><div class="kpis"><div class="kpi"><small>CA brut</small><b>${euro(gross)}</b><span class="trend">Période actuelle</span></div><div class="kpi"><small>Commission Velvet</small><b>${euro(gross*.08)}</b><span>8%</span></div><div class="kpi"><small>Net estimé</small><b>${euro(gross*.92)}</b></div><div class="kpi"><small>À reverser</small><b>${euro(gross*.62)}</b></div><div class="kpi"><small>Remboursements</small><b>${euro(165)}</b><span class="trend down">2 opérations</span></div></div>
    <div class="grid g2"><section class="card"><div class="section-head"><div><h2>Revenus par soirée</h2><p>Montants confirmés.</p></div><button class="btn secondary" onclick="exportFinance()">Exporter</button></div>${eventCards(events)}</section><section class="card"><h2>Prochain reversement</h2><div class="profile-score"><div class="ring"><b>03/08</b></div><div><b>${euro(gross*.62)}</b><p class="lead">Compte bancaire vérifié · IBAN se terminant par 4821.</p></div></div><div class="checklist"><div class="check"><span>Réservations encaissées</span><b>${euro(gross)}</b></div><div class="check"><span>Remboursements</span><b>− ${euro(165)}</b></div><div class="check"><span>Commission Velvet</span><b>− ${euro(gross*.08)}</b></div></div><button class="btn secondary" onclick="openTransfers()">Historique des virements</button></section></div>`;
}
function openTransfers(){const gross=venueEvents().reduce((n,e)=>n+e.revenue,0);drawer.innerHTML=`<button class="btn ghost" onclick="closeDrawer()">Fermer</button><div class="ey" style="margin-top:16px">Paiements</div><h2>Historique des virements</h2><div class="checklist"><div class="check"><span>03 juillet 2026<br><small>Virement confirmé</small></span><b>${euro(gross*.54)}</b></div><div class="check"><span>03 juin 2026<br><small>Virement confirmé</small></span><b>${euro(gross*.48)}</b></div><div class="check"><span>03 mai 2026<br><small>Virement confirmé</small></span><b>${euro(gross*.43)}</b></div></div>`;drawerBackdrop.classList.add('open')}
function visibilityPage(){
  return `<div class="ey">Acquisition et présence publique</div><h1>Visibilité</h1><p class="lead">Décidez précisément ce qui apparaît aux membres et mesurez l’effet de chaque publication.</p><div class="grid g2"><section class="card"><h2>Éléments visibles</h2>${[['publicPage','Fiche établissement','Rend votre mini-site accessible dans Velvet.'],['agenda','Agenda','Affiche les prochaines soirées et les places restantes.'],['prices','Tarifs','Affiche vos tarifs publics à jour.'],['participants','Participants','Montre uniquement les profils ayant accepté d’être visibles.'],['reviews','Avis','Affiche les recommandations certifiées.'],['map','Localisation approximative','Affiche la zone sans révéler l’adresse exacte.']].map(x=>`<div class="visibility-row"><div><b>${x[1]}</b><p>${x[2]}</p></div><button class="toggle ${S.visibility[x[0]]?'on':''}" onclick="toggleVisibility('${x[0]}')"></button></div>`).join('')}</section>
    <aside><section class="card"><div class="ey">30 derniers jours</div><h2>Impact de votre visibilité</h2><div class="checklist"><div class="check"><span>Apparitions dans Recherche</span><b>42 680</b></div><div class="check"><span>Visites de la fiche</span><b>${venue().views.toLocaleString('fr-FR')}</b></div><div class="check"><span>Clics sur l’agenda</span><b>3 214</b></div><div class="check"><span>Conversions en réservation</span><b>8,7%</b></div></div></section><section class="card"><h2>Publication maîtrisée</h2><p class="lead">Toute modification de contenu reste en brouillon jusqu’à ce que vous utilisiez « Publier sur Velvet ».</p><button class="btn" onclick="go('venue')">Modifier la fiche</button></section></aside></div>`;
}
function toggleVisibility(key){S.visibility[key]=!S.visibility[key];save();go('visibility');toastMsg('Préférence de visibilité enregistrée')}
function teamPage(){
  return `<div class="ey">Organisation multi-établissements</div><h1>Équipe & accès</h1><p class="lead">Attribuez les droits nécessaires par établissement sans partager vos identifiants administrateurs.</p><div class="table-wrap"><table class="table"><thead><tr><th>Collaborateur</th><th>Rôle</th><th>Établissements</th><th>Droits</th><th>Statut</th></tr></thead><tbody><tr><td><b>Émilie Martin</b><small class="muted">emilie@demo-velvet.fr</small></td><td>Administratrice</td><td>Tous les lieux</td><td>Accès complet</td><td><span class="status ok">Actif</span></td></tr><tr><td><b>Lucas Bernard</b><small class="muted">lucas@demo-velvet.fr</small></td><td>Responsable accueil</td><td>O’Pulsions</td><td>Réservations · Check-in</td><td><span class="status ok">Actif</span></td></tr><tr><td><b>Sarah Lefèvre</b><small class="muted">sarah@demo-velvet.fr</small></td><td>Communication</td><td>O’Pulsions · O’Relax</td><td>Fiche · Agenda · Messages</td><td><span class="status warn">Invitation envoyée</span></td></tr>${S.team.map(x=>`<tr><td><b>${esc(x.name)}</b><small class="muted">${esc(x.email)}</small></td><td>${esc(x.role)}</td><td>${esc(x.venues)}</td><td>${esc(x.rights)}</td><td><span class="status warn">Invitation envoyée</span></td></tr>`).join('')}</tbody></table></div><button class="btn" style="margin-top:15px" onclick="openTeamInvite()">Inviter un collaborateur</button>`;
}
function openTeamInvite(){drawer.innerHTML=`<button class="btn ghost" onclick="closeDrawer()">Fermer</button><div class="ey" style="margin-top:16px">Équipe & accès</div><h2>Inviter un collaborateur</h2><label class="field">Nom<input id="teamName"></label><label class="field">E-mail<input id="teamEmail" type="email"></label><label class="field">Rôle<select id="teamRole"><option>Responsable accueil</option><option>Communication</option><option>Comptabilité</option><option>Administrateur</option></select></label><label class="field">Établissements<select id="teamVenues"><option>${esc(venue().name)}</option><option>Tous les lieux</option></select></label><button class="btn" style="margin-top:14px" onclick="saveTeamInvite()">Envoyer l’invitation</button>`;drawerBackdrop.classList.add('open')}
function saveTeamInvite(){const name=teamName.value.trim(),email=teamEmail.value.trim();if(!name||!email){toastMsg('Complétez le nom et l’e-mail');return}S.team.push({name,email,role:teamRole.value,venues:teamVenues.value,rights:teamRole.value==='Administrateur'?'Accès complet':'Droits liés au rôle'});save();closeDrawer();go('team');toastMsg('Invitation enregistrée')}
function openPublicPreview(useDraft=false){
  const base=venue(),v=useDraft&&S.drafts[base.id]?S.drafts[base.id]:base,events=venueEvents().filter(e=>e.status==='published');
  drawer.innerHTML=`<button class="btn ghost" onclick="closeDrawer()">Fermer l’aperçu</button><div class="ey" style="margin-top:17px">Vue membre · ${useDraft?'Brouillon non publié':'Version actuellement publiée'}</div><div class="preview" style="margin-top:10px"><div class="preview-hero"><img src="${v.hero}"><div class="preview-copy"><div class="ey">${esc(v.type)} · ${esc(v.city)} · Vérifié Velvet</div><h2>${esc(v.name)}</h2><div class="chips"><span class="chip">★ 4,8 · 128 avis</span><span class="chip">${events.length} soirées à venir</span></div></div></div><div class="preview-body"><h3>Une expérience, pas une simple adresse</h3><p class="lead">${esc(v.description)}</p><div class="chips">${v.equipment.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div><h3>Prochaines soirées</h3>${events.length?events.map(e=>`<div class="check"><span><b>${esc(e.name)}</b><br>${e.day} ${e.month} · ${e.capacity-e.booked} places disponibles</span><button class="btn secondary" onclick="closeDrawer();openEvent('${e.id}')">Voir</button></div>`).join(''):'<p class="lead">Aucune soirée publique actuellement.</p>'}<h3>Informations pratiques</h3><div class="checklist"><div class="check"><span>Horaires</span><b>${esc(v.hours)}</b></div><div class="check"><span>Localisation</span><b>${esc(v.address)}</b></div></div></div></div>${useDraft?'<button class="btn" style="margin-top:14px;width:100%" onclick="closeDrawer();publishVenue()">Publier cette version</button>':''}`;drawerBackdrop.classList.add('open')
}
render();
</script>
</body>
</html>
