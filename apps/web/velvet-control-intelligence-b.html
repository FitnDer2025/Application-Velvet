<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Velvet Control — Intelligence Version B</title>
<style>
:root{--bg:#0d0d0d;--panel:#171719;--panel2:#202024;--line:#ffffff15;--txt:#f4f4f2;--muted:#aaa6a1;--gold:#c6a96a;--wine:#641b36;--green:#6fd2a1;--orange:#e2a35f;--red:#e27b93;--blue:#78a9ff;--violet:#a48cff}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font-family:Inter,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.shell{height:100%;display:grid;grid-template-rows:68px 1fr}.top{display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid var(--line);background:#0b0b0ef2;backdrop-filter:blur(18px);z-index:30}.brand{font:20px Georgia;letter-spacing:.21em;color:var(--gold)}.tag{font-size:9px;letter-spacing:.14em;border:1px solid #c6a96a55;border-radius:99px;padding:5px 8px}.tabs{display:flex;gap:6px;margin-left:18px}.tab{border:1px solid transparent;background:transparent;color:var(--muted);border-radius:99px;padding:9px 13px}.tab.active{color:#fff;background:#ffffff0c;border-color:var(--line)}.spacer{flex:1}.live{display:flex;align-items:center;gap:7px;color:var(--green);font-size:11px}.live:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 15px var(--green);animation:pulse 1.5s infinite}@keyframes pulse{50%{opacity:.35}}.view{min-height:0;position:relative}.frame{border:0;width:100%;height:100%;background:#0d0d0d}.page{display:none;height:100%;overflow:auto;padding:24px}.page.active{display:block}
.wrap{max-width:1540px;margin:auto}.ey{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}h1,h2,h3{font-family:Georgia}h1{font-size:clamp(40px,5vw,65px);line-height:1;margin:8px 0 12px}.lead{color:var(--muted);line-height:1.6;max-width:880px}.head{display:flex;justify-content:space-between;gap:20px;align-items:end}.head-actions{display:flex;gap:8px}.btn{border:0;border-radius:99px;padding:10px 14px;color:white;background:linear-gradient(135deg,#96395f,var(--wine));font-weight:700}.btn.secondary{background:transparent;color:var(--gold);border:1px solid #c6a96a55}.btn.ghost{background:#ffffff08;color:#ddd}
.card{border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,#ffffff09,#ffffff03);padding:18px}.card h2,.card h3{margin:4px 0 14px}.grid{display:grid;gap:13px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:19px 0}.kpi{border:1px solid var(--line);border-radius:17px;background:#ffffff05;padding:14px}.kpi small{color:var(--muted)}.kpi b{display:block;color:var(--gold);font-size:27px;margin:6px 0}.trend{font-size:10px;color:var(--green)}.trend.warn{color:var(--orange)}
.section-head{display:flex;justify-content:space-between;gap:14px;align-items:end;margin:22px 0 12px}.section-head h2{font-size:30px;margin:0}.section-head p{margin:4px 0 0;color:var(--muted)}
.noc{display:grid;grid-template-columns:250px 1fr;gap:16px;align-items:center}.brain{width:220px;height:220px;border-radius:50%;display:grid;place-items:center;position:relative;margin:auto;background:conic-gradient(var(--green) 0 99.4%,#ffffff12 99.4%)}.brain:before{content:"";position:absolute;inset:13px;border-radius:50%;background:radial-gradient(circle,#381328 0%,#18151a 50%,#101012 72%);border:1px solid #c6a96a24}.brain:after{content:"";position:absolute;inset:35px;border:1px solid #a48cff55;border-radius:50%;box-shadow:0 0 35px #a48cff24;animation:brainPulse 2.2s ease-in-out infinite}@keyframes brainPulse{50%{transform:scale(1.08);opacity:.45}}.brain-copy{position:relative;text-align:center}.brain-copy b{display:block;font-size:37px;color:var(--gold)}.brain-copy span{font-size:10px;color:var(--muted)}.services{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.service{padding:10px;border:1px solid var(--line);border-radius:13px;background:#ffffff04}.service div{display:flex;justify-content:space-between;gap:7px}.service small{display:block;color:var(--muted);margin-top:4px}.dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--green);box-shadow:0 0 9px currentColor}.dot.warn{background:var(--orange)}
.agents-layout{display:grid;grid-template-columns:1fr 360px;gap:13px}.agents{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.agent{border:1px solid var(--line);border-radius:18px;background:#ffffff04;padding:15px;text-align:left;color:white;transition:.2s}.agent:hover,.agent.active{border-color:#c6a96a55;transform:translateY(-2px);background:#c6a96a08}.agent-top{display:flex;justify-content:space-between;gap:8px}.agent-icon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:#641b3638;color:var(--gold);font-size:20px}.state{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:5px 7px;font-size:9px}.state:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.ok{color:var(--green)}.warning{color:var(--orange)}.paused{color:#aaa}.agent h3{margin:12px 0 4px}.agent p{margin:0;color:var(--muted);font-size:11px;line-height:1.45}.agent-stats{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}.agent-stats div{padding:8px;border-radius:10px;background:#ffffff06}.agent-stats small{display:block;color:var(--muted);font-size:8px}.agent-stats b{font-size:13px}.agent-detail{position:sticky;top:0}.agent-detail .hero-icon{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;background:#641b3640;color:var(--gold);font-size:27px}.detail-list{display:grid;gap:0}.detail-list div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #ffffff0c}.detail-list span{color:var(--muted)}.toggle{width:43px;height:24px;border:0;border-radius:99px;background:#ffffff18;position:relative}.toggle:after{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;border-radius:50%;background:#aaa;transition:.2s}.toggle.on{background:var(--wine)}.toggle.on:after{left:22px;background:#fff}
.autonomy{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}.autonomy button{border:1px solid var(--line);background:#ffffff04;color:var(--muted);border-radius:12px;padding:10px}.autonomy button.active{border-color:#c6a96a66;color:var(--gold);background:#c6a96a0c}
.matrix{display:grid;gap:8px}.risk{display:grid;grid-template-columns:190px 1fr 60px 220px;gap:12px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:14px;background:#ffffff04}.risk input{accent-color:var(--wine);width:100%}.risk output{color:var(--gold);font-weight:800}.risk select{border:1px solid var(--line);border-radius:10px;background:#1b1b1f;color:white;padding:8px}.risk small{display:block;color:var(--muted);margin-top:3px}
.stream{height:520px;overflow:auto}.stream-row{display:grid;grid-template-columns:68px 90px 1fr auto;gap:10px;align-items:start;padding:11px 0;border-bottom:1px solid #ffffff0c}.stream-row time,.stream-row small{color:var(--muted);font-size:10px}.stream-row p{margin:0;font-size:12px;line-height:1.45}.agent-label{color:var(--gold);font-size:10px}.score{font-size:10px;border:1px solid var(--line);border-radius:99px;padding:5px 7px}
.impact{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.impact-card{border:1px solid var(--line);border-radius:16px;padding:14px;background:#ffffff04}.impact-card h3{margin:4px 0 9px}.impact-card p{color:var(--muted);font-size:11px;line-height:1.5}.impact-card b{color:var(--gold)}
.road-hero{display:flex;justify-content:space-between;gap:20px;align-items:end}.progress-card{min-width:270px;border:1px solid var(--line);border-radius:20px;padding:18px;background:#ffffff06}.progress-card b{font-size:38px;color:var(--gold)}.bar{height:9px;border-radius:99px;background:#ffffff10;overflow:hidden;margin-top:11px}.bar i{display:block;height:100%;width:64%;background:linear-gradient(90deg,var(--wine),var(--gold))}.road-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:22px 0}.road-card{border:1px solid var(--line);border-radius:20px;padding:17px;background:#ffffff04}.road-card h3{margin:7px 0 12px}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:10px}.task{display:grid;grid-template-columns:17px 1fr auto;gap:8px;padding:10px 0;border-top:1px solid #ffffff0d}.task p{margin:3px 0;color:var(--muted);font-size:10px;line-height:1.4}.tick{width:15px;height:15px;border-radius:50%;border:1px solid var(--line)}.tick.done{background:var(--green);border-color:var(--green);box-shadow:inset 0 0 0 4px #171719}.tick.run{background:var(--orange);border-color:var(--orange);box-shadow:inset 0 0 0 4px #171719}.percent{font-size:10px;color:var(--gold)}.log{display:grid;grid-template-columns:1fr 1fr;gap:13px}.timeline{border:1px solid var(--line);border-radius:20px;padding:18px;background:#ffffff04}.log-row{display:grid;grid-template-columns:95px 12px 1fr;gap:9px}.log-row time{color:var(--muted);font-size:10px;padding-top:3px}.log-row i{width:8px;height:8px;border-radius:50%;background:var(--gold);margin-top:4px;position:relative}.log-row i:after{content:"";position:absolute;left:3px;top:11px;width:1px;height:40px;background:var(--line)}.log-row:last-child i:after{display:none}.log-row p{margin:0 0 17px;font-size:12px}.log-row small{display:block;color:var(--muted);margin-top:3px}
.toast{position:fixed;right:20px;bottom:20px;z-index:100;border:1px solid #c6a96a55;border-radius:14px;background:#1b1b1f;padding:13px 17px;opacity:0;transform:translateY(10px);transition:.2s}.toast.show{opacity:1;transform:none}
@media(max-width:1200px){.kpis{grid-template-columns:repeat(3,1fr)}.agents{grid-template-columns:repeat(2,1fr)}.services{grid-template-columns:repeat(3,1fr)}.road-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:850px){.top{padding:0 9px}.brand{font-size:15px}.tag,.live{display:none}.tabs{margin-left:0;overflow:auto}.tab{font-size:11px;padding:8px 9px;white-space:nowrap}.page{padding:15px 12px}.head,.road-hero{display:block}.head-actions{margin-top:13px}.noc,.agents-layout,.g2,.g3,.log{grid-template-columns:1fr}.agent-detail{position:static}.kpis{grid-template-columns:1fr 1fr}.services,.impact{grid-template-columns:1fr 1fr}.risk{grid-template-columns:1fr}.road-grid{grid-template-columns:1fr}.stream-row{grid-template-columns:58px 78px 1fr}.stream-row .score{display:none}}
</style>
</head>
<body>
<div class="shell">
  <header class="top"><div class="brand">VELVET</div><span class="tag">CONTROL</span><nav class="tabs"><button class="tab" data-view="console" onclick="showView('console',this)">Console V1</button><button class="tab active" data-view="intelligence" onclick="showView('intelligence',this)">Velvet Intelligence B</button><button class="tab" data-view="roadmap" onclick="showView('roadmap',this)">Avancement</button></nav><div class="spacer"></div><div class="live">Monitoring simulé actif</div></header>
  <main class="view">
    <iframe id="consoleView" class="frame" style="display:none" title="Velvet Control V1" src="./velvet-control-v1.html"></iframe>
    <section id="intelligenceView" class="page active"><div id="intelligenceRoot" class="wrap"></div></section>
    <section id="roadmapView" class="page"><div id="roadmapRoot" class="wrap"></div></section>
  </main>
</div>
<div id="toast" class="toast"></div>
<script>
const AGENTS=[
  {id:'guardian',icon:'♢',name:'Guardian',role:'Sécurité, fraude et consentement',state:'Actif',health:99.8,latency:182,decisions:4280,queue:4,autonomy:'Semi-automatique',version:'guardian-3.2'},
  {id:'moderator',icon:'⚑',name:'Moderator',role:'Préparation des dossiers',state:'Actif',health:99.5,latency:326,decisions:1842,queue:12,autonomy:'Assistance',version:'moderator-2.8'},
  {id:'cupid',icon:'♡',name:'Cupid',role:'Compatibilité et recommandations',state:'Actif',health:99.9,latency:144,decisions:5630,queue:2,autonomy:'Automatique',version:'cupid-4.1'},
  {id:'host',icon:'◇',name:'Host',role:'Assistant établissements',state:'Actif',health:99.2,latency:405,decisions:918,queue:7,autonomy:'Assistance',version:'host-2.4'},
  {id:'support',icon:'?',name:'Support',role:'Synthèse et réponses',state:'Actif',health:98.9,latency:512,decisions:724,queue:9,autonomy:'Assistance',version:'support-2.1'},
  {id:'analyst',icon:'↗',name:'Analyst',role:'Prévisions et performance',state:'Apprentissage',health:97.8,latency:680,decisions:286,queue:3,autonomy:'Observation',version:'analyst-1.9'},
  {id:'creator',icon:'✦',name:'Creator',role:'Contenus et campagnes',state:'Actif',health:99.1,latency:438,decisions:412,queue:0,autonomy:'Assistance',version:'creator-2.0'}
];
const RISKS=[
  {id:'consent',name:'Non-respect du consentement',desc:'Messages et comportements à risque',value:99,action:'Suspendre temporairement'},
  {id:'identity',name:'Usurpation d’identité',desc:'Visages, documents et signaux croisés',value:98,action:'Bloquer la publication'},
  {id:'scam',name:'Arnaques et chantage',desc:'Paiement, extorsion et liens suspects',value:97,action:'Suspendre temporairement'},
  {id:'fake',name:'Faux profils',desc:'Cohérence, photos et comportement',value:95,action:'Demander une vérification'},
  {id:'duplicates',name:'Doublons de comptes',desc:'Appareils, images et habitudes',value:92,action:'Transférer au modérateur'},
  {id:'spam',name:'Spam et prospection',desc:'Répétition et volume anormal',value:90,action:'Masquer temporairement'},
  {id:'aiimage',name:'Images générées par IA',desc:'Détection et provenance des médias',value:85,action:'Transférer au modérateur'},
  {id:'harassment',name:'Harcèlement',desc:'Insistance, agressivité et récidive',value:80,action:'Transférer au modérateur'}
];
const BASE_STREAM=[
  ['07:48:22','Guardian','Profil m_3842 placé en vérification renforcée','96%'],
  ['07:47:58','Cupid','Compatibilité recalculée pour 214 profils','94%'],
  ['07:47:41','Moderator','Dossier c_184 préparé — validation humaine requise','91%'],
  ['07:47:16','Host','Prévision de remplissage O’Pulsions actualisée','89%'],
  ['07:46:52','Support','Réponse proposée pour ticket T-2841','97%'],
  ['07:46:24','Guardian','Photo dupliquée détectée sur deux comptes','98%'],
  ['07:45:59','Analyst','Alerte conversion Premium Hauts-de-France','84%'],
  ['07:45:31','Creator','Campagne été — trois variantes générées','92%']
];
let S=JSON.parse(localStorage.getItem('velvetIntelligenceB')||'{}');
S.selected=S.selected||'guardian';S.autonomy=S.autonomy||'Semi-automatique';S.enabled=S.enabled||Object.fromEntries(AGENTS.map(a=>[a.id,true]));S.risks=S.risks||Object.fromEntries(RISKS.map(r=>[r.id,{value:r.value,action:r.action}]));S.stream=S.stream||BASE_STREAM;S.decisions=S.decisions||12842;S.queue=S.queue||37;
const save=()=>localStorage.setItem('velvetIntelligenceB',JSON.stringify(S));
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function toastMsg(text){toast.textContent=text;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)}
function showView(view,button){
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===button));
  consoleView.style.display=view==='console'?'block':'none';
  intelligenceView.classList.toggle('active',view==='intelligence');roadmapView.classList.toggle('active',view==='roadmap');
}
function stateClass(state){return state==='Actif'?'ok':state==='Apprentissage'?'warning':'paused'}
function intelligence(){
  const a=AGENTS.find(x=>x.id===S.selected)||AGENTS[0],enabled=S.enabled[a.id];
  return `<div class="head"><div><div class="ey">Version B · Données opérationnelles simulées</div><h1>Velvet Intelligence</h1><p class="lead">Supervision des sept agents qui relient Velvet Membres, Velvet Pro et Velvet Control. Les décisions sensibles restent traçables et gouvernées par les équipes humaines.</p></div><div class="head-actions"><button class="btn secondary" onclick="exportAudit()">Exporter l’audit</button><button class="btn" onclick="deployPolicy()">Déployer la politique</button></div></div>
  <div class="kpis"><div class="kpi"><small>Décisions aujourd’hui</small><b id="decisionKpi">${S.decisions.toLocaleString('fr-FR')}</b><span class="trend">+18,4%</span></div><div class="kpi"><small>File globale</small><b id="queueKpi">${S.queue}</b><span class="trend warn">14 prioritaires</span></div><div class="kpi"><small>Latence médiane</small><b>318 ms</b><span class="trend">−42 ms</span></div><div class="kpi"><small>Validation humaine</small><b>98,6%</b><span class="trend">+0,4 pt</span></div><div class="kpi"><small>Automatisation</small><b>67%</b><span class="trend">+8 pt</span></div><div class="kpi"><small>Temps économisé</small><b>312 h</b><span class="trend">Ce mois</span></div></div>
  <section class="card noc"><div class="brain"><div class="brain-copy"><b>99,4%</b><span>SANTÉ GLOBALE</span></div></div><div><div class="section-head" style="margin-top:0"><div><div class="ey">NOC Intelligence</div><h2>Infrastructure des modèles</h2></div><span class="state ok">Tous les services critiques répondent</span></div><div class="services">${[['Gateway IA','99,99%'],['Guardian API','99,98%'],['Vector Store','99,94%'],['File événements','37 tâches'],['Audit Ledger','Intègre'],['Modèles vision','99,82%'],['Modèles langage','99,91%'],['Chiffrement','Actif'],['Anonymisation','Active'],['Feature Store','À jour']].map((x,i)=>`<div class="service"><div><b>${x[0]}</b><span class="dot ${i===5?'warn':''}"></span></div><small>${x[1]}</small></div>`).join('')}</div></div></section>
  <div class="section-head"><div><h2>Flotte d’agents</h2><p>Cliquez sur un agent pour inspecter son activité et ses droits.</p></div><span class="state ok">6 actifs · 1 en apprentissage</span></div>
  <div class="agents-layout"><div class="agents">${AGENTS.map(agent=>`<button class="agent ${agent.id===a.id?'active':''}" onclick="selectAgent('${agent.id}')"><div class="agent-top"><span class="agent-icon">${agent.icon}</span><span class="state ${stateClass(S.enabled[agent.id]?agent.state:'Pause')}">${S.enabled[agent.id]?agent.state:'Pause'}</span></div><h3>${agent.name}</h3><p>${agent.role}</p><div class="agent-stats"><div><small>SANTÉ</small><b>${agent.health}%</b></div><div><small>LATENCE</small><b>${agent.latency} ms</b></div><div><small>DÉCISIONS</small><b>${agent.decisions.toLocaleString('fr-FR')}</b></div><div><small>FILE</small><b>${agent.queue}</b></div></div></button>`).join('')}</div>
    <aside class="card agent-detail"><div style="display:flex;justify-content:space-between;gap:12px"><div class="hero-icon">${a.icon}</div><button class="toggle ${enabled?'on':''}" onclick="toggleAgent('${a.id}')" aria-label="Activer ou désactiver"></button></div><div class="ey" style="margin-top:15px">${a.version}</div><h2>${a.name}</h2><p class="lead">${a.role}. Chaque recommandation conserve ses signaux, sa règle et son niveau de confiance.</p><div class="detail-list"><div><span>État</span><b class="${stateClass(enabled?a.state:'Pause')}">${enabled?a.state:'Pause'}</b></div><div><span>Santé</span><b>${a.health}%</b></div><div><span>Latence P95</span><b>${a.latency+174} ms</b></div><div><span>File courante</span><b>${a.queue} tâches</b></div><div><span>Niveau autorisé</span><b>${a.autonomy}</b></div><div><span>Dernier déploiement</span><b>27/07 · 22:14</b></div></div><button class="btn secondary" style="width:100%;margin-top:13px" onclick="toastMsg('Journal de ${a.name} filtré')">Ouvrir son journal</button></aside></div>
  <div class="section-head"><div><h2>Politique de modération</h2><p>Niveau global et seuils par risque. Les sanctions définitives restent humaines.</p></div><span class="state warning">Brouillon non déployé</span></div>
  <section class="card"><div class="ey">Autonomie globale</div><div class="autonomy">${['Observation','Assistance','Semi-automatique','Automatique'].map(x=>`<button class="${S.autonomy===x?'active':''}" onclick="setAutonomy('${x}')">${x}</button>`).join('')}</div><div class="matrix" style="margin-top:15px">${RISKS.map(r=>{const cfg=S.risks[r.id];return `<div class="risk"><div><b>${r.name}</b><small>${r.desc}</small></div><input type="range" min="50" max="100" value="${cfg.value}" oninput="setRisk('${r.id}',this.value,this.nextElementSibling)"><output>${cfg.value}%</output><select onchange="setRiskAction('${r.id}',this.value)">${['Signaler uniquement','Masquer temporairement','Demander une vérification','Bloquer la publication','Suspendre temporairement','Transférer au modérateur'].map(x=>`<option ${x===cfg.action?'selected':''}>${x}</option>`).join('')}</select></div>`}).join('')}</div></section>
  <div class="grid g2" style="margin-top:14px"><section class="card"><div class="section-head" style="margin-top:0"><div><div class="ey">Temps réel</div><h2>Flux des décisions IA</h2></div><span class="state ok">Live</span></div><div id="stream" class="stream">${streamRows()}</div></section><aside class="card"><div class="ey">Impact transversal</div><h2>Trois produits, une intelligence</h2><div class="impact"><div class="impact-card"><div class="ey">Velvet</div><h3>Membres</h3><p><b>214</b> profils recommandés<br><b>8</b> contrôles préventifs<br><b>96%</b> pertinence Cupid</p></div><div class="impact-card"><div class="ey">Velvet Pro</div><h3>Établissements</h3><p><b>3</b> prévisions ajustées<br><b>18</b> réponses préparées<br><b>+7%</b> remplissage estimé</p></div><div class="impact-card"><div class="ey">Control</div><h3>Opérations</h3><p><b>14</b> dossiers prioritaires<br><b>92%</b> prétraités<br><b>38 min</b> économisées</p></div></div><h3 style="margin-top:20px">Alertes à traiter</h3><div class="detail-list"><div><span>Pic de faux profils · Belgique</span><b class="warning">Moyen</b></div><div><span>Latence modèle vision</span><b class="warning">+18%</b></div><div><span>Deux décisions contestées</span><b>À revoir</b></div></div><button class="btn secondary" style="width:100%;margin-top:13px" onclick="toastMsg('Centre d’alertes ouvert')">Ouvrir le centre d’alertes</button></aside></div>`;
}
function streamRows(){return S.stream.slice(0,18).map(x=>`<div class="stream-row"><time>${x[0]}</time><span class="agent-label">${x[1]}</span><p>${x[2]}</p><span class="score">${x[3]}</span></div>`).join('')}
function selectAgent(id){S.selected=id;save();renderIntelligence()}
function toggleAgent(id){S.enabled[id]=!S.enabled[id];save();renderIntelligence();toastMsg(S.enabled[id]?`${id} réactivé`:`${id} mis en pause`)}
function setAutonomy(value){S.autonomy=value;save();renderIntelligence();toastMsg(`Mode ${value} sélectionné — non déployé`)}
function setRisk(id,value,output){S.risks[id].value=Number(value);output.textContent=value+'%';save()}
function setRiskAction(id,value){S.risks[id].action=value;save();toastMsg('Action enregistrée dans le brouillon')}
function deployPolicy(){save();toastMsg('Politique déployée avec journal d’audit')}
function exportAudit(){toastMsg('Export d’audit préparé')}
function renderIntelligence(){intelligenceRoot.innerHTML=intelligence()}
function roadmap(){
  return `<div class="road-hero"><div><div class="ey">Avancement réel · Velvet Control V1.1</div><h1>Roadmap Intelligence</h1><p class="lead">Cette vue représente uniquement les fonctionnalités présentes dans ce livrable testable. Aucun développement ne progresse en arrière-plan entre deux versions publiées.</p></div><div class="progress-card"><div class="ey">Progression fonctionnelle</div><b>64%</b><div class="bar"><i></i></div><p class="lead" style="font-size:11px;margin-bottom:0">Version B publiée : cockpit, agents, monitoring et premiers réglages.</p></div></div>
  <div class="road-grid"><article class="road-card"><div class="meta"><span>Sprint 0</span><span class="state ok">Livré</span></div><h3>Velvet Control V1</h3>${tasks([['Centre de commandement',100],['Bureaux métiers',100],['Entités et timelines',100]])}</article>
  <article class="road-card"><div class="meta"><span>Sprint 1</span><span class="state ok">Livré</span></div><h3>NOC Intelligence</h3>${tasks([['Sept agents IA',100],['Santé et charge',100],['Flux temps réel simulé',100]])}</article>
  <article class="road-card"><div class="meta"><span>Sprint 2</span><span class="state warning">Partiel</span></div><h3>Modération IA</h3>${tasks([['Niveau d’autonomie',100],['Sensibilité par risque',100],['Actions autorisées',75]])}</article>
  <article class="road-card"><div class="meta"><span>Sprint 3</span><span class="state paused">Planifié</span></div><h3>Simulation & Audit</h3>${tasks([['Simulation d’impact',15],['Journal explicable détaillé',35],['Retour de version',0]])}</article>
  <article class="road-card"><div class="meta"><span>Sprint 4</span><span class="state paused">Planifié</span></div><h3>Connexion aux socles</h3>${tasks([['Velvet Membres',20],['Velvet Pro',20],['Velvet Control',65]])}</article>
  <article class="road-card"><div class="meta"><span>Qualité</span><span class="state warning">En cours</span></div><h3>Finitions V1.1</h3>${tasks([['Design desktop',95],['Responsive',80],['Tests fonctionnels',85]])}</article></div>
  <div class="log"><section class="timeline"><div class="ey">Changelog</div><h2>Livraisons vérifiables</h2><div class="log-row"><time>28/07/2026</time><i></i><p><b>Version B — Cockpit Intelligence</b><small>Agents, NOC, monitoring, autonomie, sensibilités et impact transversal.</small></p></div><div class="log-row"><time>27/07/2026</time><i></i><p><b>Roadmap intégrée</b><small>Suivi visuel des versions publiées.</small></p></div><div class="log-row"><time>27/07/2026</time><i></i><p><b>Velvet Control V1</b><small>Centre de commandement et modules métiers.</small></p></div></section><aside class="timeline"><div class="ey">Étape suivante</div><h2>Version C</h2><p class="lead">Simulation comparative des seuils, journal d’audit explicable, restauration de politique et propagation visible des décisions dans Velvet Membres et Velvet Pro.</p><div class="detail-list"><div><span>Simulation avant/après</span><b>À construire</b></div><div><span>Dossier IA explicable</span><b>À enrichir</b></div><div><span>Versioning des politiques</span><b>À construire</b></div></div></aside></div>`;
}
function tasks(items){return items.map(x=>`<div class="task"><span class="tick ${x[1]===100?'done':x[1]>0?'run':''}"></span><div><b>${x[0]}</b><p>${x[1]===100?'Fonction disponible dans cette version.':x[1]===0?'Non développé dans cette version.':'Socle visible, fonctions restantes à compléter.'}</p></div><span class="percent">${x[1]}%</span></div>`).join('')}
function renderRoadmap(){roadmapRoot.innerHTML=roadmap()}
function pushLiveEvent(){
  const samples=[['Guardian','Contrôle de cohérence terminé pour profil m_'+Math.floor(Math.random()*9000),'95%'],['Moderator','Dossier c_'+Math.floor(Math.random()*900)+' enrichi par six signaux','91%'],['Cupid','Suggestions mises à jour pour '+(120+Math.floor(Math.random()*180))+' membres','94%'],['Host','Prévision de fréquentation recalculée','88%'],['Support','Résumé de conversation généré','97%']];
  const x=samples[Math.floor(Math.random()*samples.length)],now=new Date().toLocaleTimeString('fr-FR');
  S.stream.unshift([now,x[0],x[1],x[2]]);S.stream=S.stream.slice(0,24);S.decisions+=1+Math.floor(Math.random()*4);S.queue=Math.max(20,Math.min(58,S.queue+(Math.random()>.52?1:-1)));save();
  if(intelligenceView.classList.contains('active')){const el=document.getElementById('stream');if(el)el.innerHTML=streamRows();const d=document.getElementById('decisionKpi'),q=document.getElementById('queueKpi');if(d)d.textContent=S.decisions.toLocaleString('fr-FR');if(q)q.textContent=S.queue}
}
renderIntelligence();renderRoadmap();setInterval(pushLiveEvent,3500);
</script>
</body>
</html>
