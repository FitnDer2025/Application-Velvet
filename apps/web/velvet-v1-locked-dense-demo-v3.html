<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Velvet — V1 verrouillée enrichie</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>:root{--bg:#09090b;--p:#151518;--p2:#1d1d21;--line:#ffffff16;--txt:#f7f3ef;--muted:#aaa5a0;--gold:#c9a86a;--burg:#712440}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#71244033,transparent 32rem),var(--bg);color:var(--txt);font-family:Arial,sans-serif}button,input,select,textarea{font:inherit}.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{position:sticky;top:0;height:100vh;padding:22px 16px;border-right:1px solid var(--line);background:#0c0c0ff2}.brand{font-family:Georgia;font-size:23px;letter-spacing:.25em;color:var(--gold);padding:10px}.nav{display:grid;gap:6px;margin-top:20px}.nav button{border:0;background:transparent;color:var(--muted);padding:13px;border-radius:13px;text-align:left;cursor:pointer}.nav button.active,.nav button:hover{background:#ffffff0d;color:#fff}.me{position:absolute;bottom:18px;left:16px;right:16px;padding:14px;border:1px solid var(--line);border-radius:15px;background:#ffffff08;cursor:pointer}.top{height:72px;position:sticky;top:0;z-index:8;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--line);background:#0b0b0ddd;backdrop-filter:blur(16px)}.search{width:min(600px,60vw);border:1px solid var(--line);border-radius:999px;background:#17171a;color:#fff;padding:12px 16px}.content{padding:26px}.ey{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}h1,h2,h3{font-family:Georgia}.hero{font-size:clamp(42px,5vw,68px);margin:8px 0}.muted{color:var(--muted)}.grid{display:grid;gap:17px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.card{border:1px solid var(--line);border-radius:21px;background:linear-gradient(145deg,#ffffff0c,#ffffff04);overflow:hidden}.pad{padding:18px}.cover{height:230px;background-size:cover;background-position:center;position:relative}.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,#000d)}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.btn{border:0;border-radius:999px;padding:11px 16px;color:#fff;background:linear-gradient(135deg,#8a3055,var(--burg));cursor:pointer}.btn.secondary{background:transparent;color:var(--gold);border:1px solid #c9a86a66}.chip{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:11px}.chips{display:flex;flex-wrap:wrap;gap:7px}.tabs{display:flex;gap:8px;overflow:auto;padding:14px 0}.tabs button{white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:10px 13px;background:#17171a;color:var(--muted);cursor:pointer}.tabs button.active{color:var(--gold);border-color:#c9a86a66}.filters{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:16px 0}.filters input,.filters select,.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:#1a1a1e;color:#fff;padding:11px}.person{cursor:pointer}.person:hover{transform:translateY(-2px);transition:.2s}.feed{display:grid;gap:10px}.feeditem{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:13px;border:1px solid var(--line);border-radius:15px;background:#ffffff05}.avatar{width:52px;height:52px;border-radius:50%;object-fit:cover}.chat{height:calc(100vh - 125px);min-height:620px;display:grid;grid-template-columns:320px 1fr;border:1px solid var(--line);border-radius:22px;overflow:hidden;background:#111113}.threads{border-right:1px solid var(--line);overflow:auto}.thread{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:13px;border-bottom:1px solid #ffffff0b;cursor:pointer}.thread.active,.thread:hover{background:#ffffff0d}.chatmain{display:flex;flex-direction:column}.chathead{height:70px;padding:10px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.messages{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:9px}.who{font-size:10px;color:var(--gold);margin-bottom:4px}.bubble{max-width:72%;padding:10px 13px;border-radius:16px}.in{align-self:flex-start;background:#232326}.out{align-self:flex-end;background:#5c2038}.composer{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px;border-top:1px solid var(--line)}.composer input{border:1px solid var(--line);border-radius:999px;background:#1c1c20;color:#fff;padding:11px 14px}.profilehero{min-height:390px;border-radius:24px;background-size:cover;background-position:center;position:relative;overflow:hidden}.profilehero:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 25%,#000e)}.herocopy{position:absolute;left:26px;right:26px;bottom:24px;z-index:2}.gallery{display:grid;grid-template-columns:2fr 1fr 1fr;grid-auto-rows:160px;gap:9px}.gallery div{border-radius:14px;background-size:cover;background-position:center}.private{position:relative;filter:blur(3px)}.private:after{content:'Album privé · demander l’accès';position:absolute;inset:0;display:grid;place-items:center;background:#0008;filter:none;color:#fff;font-weight:bold}.map{height:650px;border-radius:21px;overflow:hidden;border:1px solid var(--line)}.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.toast{position:fixed;right:20px;bottom:20px;background:#1d1d20;border:1px solid #c9a86a66;border-radius:13px;padding:13px 17px;opacity:0;transition:.2s;z-index:50}.toast.show{opacity:1}.mobile{display:none}@media(max-width:950px){.g4,.g3{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.app{grid-template-columns:1fr}.side{display:none}.content{padding:14px 14px 85px}.g2,.g3,.g4,.filters,.formgrid{grid-template-columns:1fr}.chat{grid-template-columns:1fr}.threads{max-height:230px;border-right:0;border-bottom:1px solid var(--line)}.search{width:72vw}.mobile{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:#101013f2;border-top:1px solid var(--line);justify-content:space-around;padding:8px}.mobile button{border:0;background:transparent;color:var(--muted);font-size:11px}.gallery{grid-template-columns:1fr 1fr}}</style></head><body><div class="app"><aside class="side"><div class="brand">VELVET</div><nav id="nav" class="nav"></nav><div class="me" onclick="go('me')"><b>Camille & Julien</b><br><small class="muted">Couple vérifié · Trust 88</small></div></aside><main><header class="top"><input id="global" class="search" placeholder="Rechercher un membre, une sortie, un lieu…"><button class="btn secondary" onclick="go('notifications')">Notifications</button></header><div id="content" class="content"></div></main></div><div id="mobile" class="mobile"></div><div id="toast" class="toast"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const I={c1:'https://images.unsplash.com/photo-1522673607200-164d1b6ce486?auto=format&fit=crop&w=1200&q=80',c2:'https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=1200&q=80',w1:'https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=700&q=80',w2:'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=700&q=80',m1:'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=700&q=80',m2:'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=700&q=80',club:'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=1200&q=80',spa:'https://images.unsplash.com/photo-1540555700478-4be289fbecef?auto=format&fit=crop&w=1200&q=80',room:'https://images.unsplash.com/photo-1611892440504-42a792e24d32?auto=format&fit=crop&w=1200&q=80',party:'https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=1200&q=80'};const P=[{id:'af',name:'Emma & Nicolas',type:'Couple',city:'Lille',dist:18,compat:94,ages:'38 & 41',orient:'Elle bi · Lui hétéro',smoke:'Non-fumeurs',morph:'Sportifs',height:'168 / 182 cm',search:'Couples et femmes',tags:['Mélangisme','Spa','Trios F'],img:I.c1,lat:50.632,lon:3.058},{id:'em',name:'Léa & Hugo',type:'Couple',city:'Arras',dist:22,compat:89,ages:'36 & 39',orient:'Elle bi-curieuse · Lui hétéro',smoke:'Occasionnel',morph:'Naturels',height:'165 / 178 cm',search:'Couples suivis',tags:['Massage','Soft','Dîner'],img:I.c2,lat:50.289,lon:2.776},{id:'cl',name:'Chloé',type:'Femme',city:'Lens',dist:5,compat:91,ages:'35',orient:'Bisexuelle',smoke:'Non-fumeuse',morph:'Élancée',height:'170 cm',search:'Couples complices',tags:['Trios F','Spa','Dîner'],img:I.w1,lat:50.431,lon:2.832},{id:'jm',name:'Sarah & Anaïs',type:'Couple femmes',city:'Lille',dist:19,compat:86,ages:'33 & 35',orient:'Bisexuelles',smoke:'Non-fumeuses',morph:'Féminines',height:'164 / 171 cm',search:'Femmes et couples',tags:['Femmes','Soirées','Voyages'],img:I.w2,lat:50.646,lon:3.071},{id:'nt',name:'Laura & Maxime',type:'Couple',city:'Douai',dist:31,compat:84,ages:'40 & 42',orient:'Elle bi · Lui hétéro',smoke:'Non-fumeurs',morph:'Épicuriens',height:'169 / 180 cm',search:'Couples',tags:['Clubs','Dîner','Voyages'],img:I.c1,lat:50.371,lon:3.08},{id:'sa',name:'Éva & Romain',type:'Couple',city:'Béthune',dist:24,compat:81,ages:'37 & 43',orient:'Hétéroflexibles',smoke:'Fumeurs extérieurs',morph:'Ronds',height:'162 / 176 cm',search:'Couples discrets',tags:['Love room','Spa','Soft'],img:I.c2,lat:50.531,lon:2.641},{id:'luc',name:'Théo',type:'Homme',city:'Lille',dist:20,compat:72,ages:'39',orient:'Hétéro',smoke:'Non-fumeur',morph:'Athlétique',height:'184 cm',search:'Couples au coup de cœur',tags:['Sport','Dîner','Clubs'],img:I.m1,lat:50.64,lon:3.04}];const E=[{id:'e1',name:'Nuit Velours',date:'Vendredi 31 juillet · 22h',place:'O’Pulsions',img:I.party,participants:['af','cl','nt']},{id:'e2',name:'Évasion Spa',date:'Samedi 8 août · 20h',place:'O’Relax',img:I.spa,participants:['em','jm','sa']},{id:'e3',name:'Dîner confidentiel',date:'Samedi 15 août · 19h30',place:'Arras',img:I.room,participants:['af','em','cl','jm']}];const C=[{id:'af',last:'On se retrouve vendredi ?',msgs:[['Emma','On a beaucoup aimé votre profil.'],['Nicolas','Et la soirée de vendredi vous tente ?'],['Vous','Oui, on regarde ça ensemble ce soir.']]},{id:'em',last:'Merci pour votre message',msgs:[['Léa','Merci pour votre message, il nous ressemble beaucoup.'],['Hugo','On sort peu mais on privilégie les belles connexions.']]},{id:'cl',last:'Avec plaisir pour échanger',msgs:[['Chloé','Avec plaisir pour échanger avant une prochaine sortie.'],['Vous','On aime beaucoup ta façon de voir les choses.']]}];let S=JSON.parse(localStorage.getItem('velvetDenseDemoV3')||'{}');S.profile=S.profile||{coupleBio:'Couple très complice, fusionnel et profondément amoureux.',story:'Ensemble depuis de nombreuses années, nous explorons cet univers avec douceur, confiance et curiosité.',search:'Couples et femmes bienveillants, naturels et respectueux.',camilleBio:'Féminine, spontanée, bi-curieuse et sensible au charme autant qu’à la personnalité.',julienBio:'Calme, protecteur, ouvert et attaché à ce que chacun se sente respecté.',camilleHeight:'168',camilleWeight:'61',camilleMorph:'Féminine et naturelle',julienHeight:'181',julienWeight:'79',julienMorph:'Sportif',city:'Lille',smoke:'Non-fumeurs'};S.messages=S.messages||{};function save(){localStorage.setItem('velvetDenseDemoV3',JSON.stringify(S))}const menu=[['home','Accueil'],['discover','Découvrir'],['maps','Maps'],['conversations','Conversations'],['events','Sorties'],['venues','Établissements'],['notifications','Notifications'],['me','Mon profil']];let route='home',param=null;function go(r,p){route=r;param=p;render();scrollTo(0,0)}function nav(){navEl.innerHTML=menu.map(x=>`<button class="${route==x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');mobile.innerHTML=menu.slice(0,5).map(x=>`<button onclick="go('${x[0]}')">${x[1]}</button>`).join('')}function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}function card(p){return `<article class="card person" onclick="go('member','${p.id}')"><div class="cover" style="background-image:url('${p.img}')"></div><div class="pad"><div class="row"><h3>${p.name}</h3><b style="color:var(--gold)">${p.compat}%</b></div><p class="muted">${p.type} · ${p.city} · ${p.dist} km</p><div class="chips">${p.tags.map(t=>`<span class="chip">${t}</span>`).join('')}</div></div></article>`}function home(){return `<div class="ey">Votre espace privé</div><h1 class="hero">Bonsoir Camille & Julien</h1><p class="muted">Des nouvelles rencontres, des sorties et une communauté active autour de vous.</p><div class="grid g4">${[['12','nouveaux profils'],['7','messages récents'],['4','sorties proches'],['18','visites cette semaine']].map(x=>`<div class="card pad"><b style="font-size:30px;color:var(--gold)">${x[0]}</b><div class="muted">${x[1]}</div></div>`).join('')}</div><h2>Compatibilités du moment</h2><div class="grid g3">${P.slice(0,6).map(card).join('')}</div><h2>La communauté bouge</h2><div class="feed">${P.slice(0,6).map((p,i)=>`<div class="feeditem" onclick="go('member','${p.id}')"><img class="avatar" src="${p.img}"><div><b>${p.name}</b><div class="muted">${['a ajouté 3 photos à son album public','participe à Évasion Spa','a mis à jour sa recherche','a recommandé O’Pulsions','sera présent au Dîner confidentiel','vient de consulter votre profil'][i]}</div></div><span class="chip">Il y a ${i+1} h</span></div>`).join('')}</div><h2>Sorties à ne pas manquer</h2><div class="grid g3">${E.map(eventCard).join('')}</div>`}function discover(){return `<div class="ey">Recherche avancée</div><h1 class="hero">Découvrir</h1><p class="muted">Tous les critères renseignés par les membres peuvent être croisés.</p><div class="filters"><input id="dq" placeholder="Nom, ville, pratique…"><select id="dtype"><option value="">Tous les types</option><option>Couple</option><option>Couple femmes</option><option>Femme</option><option>Homme</option></select><select id="dcity"><option value="">Toutes les villes</option>${[...new Set(P.map(p=>p.city))].map(v=>`<option>${v}</option>`).join('')}</select><select id="dsearch"><option value="">Toutes les recherches</option><option>Couples</option><option>Femmes</option><option>Couples et femmes</option></select><select id="dsmoke"><option value="">Tabac indifférent</option><option>Non-fumeurs</option><option>Occasionnel</option></select><select id="dmorph"><option value="">Toutes morphologies</option><option>Sportifs</option><option>Naturels</option><option>Élancée</option><option>Féminines</option><option>Ronds</option><option>Athlétique</option></select><select id="dorient"><option value="">Toutes orientations</option><option>bi</option><option>hétéro</option><option>bisexuelle</option></select><input id="dmin" type="number" value="70" min="0" max="100" placeholder="Compatibilité min"><input id="dmaxdist" type="number" value="50" placeholder="Distance max km"><button class="btn" onclick="applyFilters()">Appliquer les filtres</button></div><div id="results" class="grid g3">${P.map(card).join('')}</div>`}function applyFilters(){let q=dq.value.toLowerCase(),type=dtype.value,city=dcity.value,s=dsearch.value.toLowerCase(),sm=dsmoke.value.toLowerCase(),m=dmorph.value.toLowerCase(),o=dorient.value.toLowerCase(),min=+dmin.value||0,max=+dmaxdist.value||999;let a=P.filter(p=>(!q||JSON.stringify(p).toLowerCase().includes(q))&&(!type||p.type==type)&&(!city||p.city==city)&&(!s||p.search.toLowerCase().includes(s))&&(!sm||p.smoke.toLowerCase().includes(sm))&&(!m||p.morph.toLowerCase().includes(m))&&(!o||p.orient.toLowerCase().includes(o))&&p.compat>=min&&p.dist<=max);results.innerHTML=a.length?a.map(card).join(''):'<div class="card pad">Aucun profil ne correspond exactement à ces filtres.</div>'}function maps(){setTimeout(initMap,50);return `<div class="ey">Autour de vous</div><h1 class="hero">Maps</h1><div id="map" class="map"></div>`}function initMap(){if(!window.L||!document.getElementById('map'))return;let m=L.map('map').setView([50.45,2.88],9);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(m);P.forEach(p=>{let ic=L.divIcon({className:'',html:`<img src="${p.img}" style="width:48px;height:48px;border-radius:50%;object-fit:cover;border:3px solid #c9a86a">`,iconSize:[48,48]});L.marker([p.lat,p.lon],{icon:ic}).addTo(m).on('click',()=>go('member',p.id))})}function conversations(){let id=param||C[0].id,c=C.find(x=>x.id==id),p=P.find(x=>x.id==id),extra=S.messages[id]||[];return `<div class="ey">Messages privés</div><h1 class="hero">Conversations</h1><div class="chat"><div class="threads">${C.map(x=>{let pp=P.find(p=>p.id==x.id);return `<div class="thread ${id==x.id?'active':''}" onclick="go('conversations','${x.id}')"><img class="avatar" src="${pp.img}"><div><b>${pp.name}</b><div class="muted">${x.last}</div></div></div>`}).join('')}</div><div class="chatmain"><div class="chathead"><img class="avatar" src="${p.img}" onclick="go('member','${p.id}')" style="cursor:pointer"><div><b>${p.name}</b><div class="muted">Cliquer sur la photo pour ouvrir la fiche</div></div></div><div class="messages">${c.msgs.concat(extra).map(x=>`<div class="bubble ${x[0]=='Vous'?'out':'in'}"><div class="who">${x[0]}</div>${x[1]}</div>`).join('')}</div><div class="composer"><input id="msg" placeholder="Votre message…" onkeydown="if(event.key==='Enter')sendMsg('${id}')"><button class="btn" onclick="sendMsg('${id}')">Envoyer</button></div></div></div>`}function sendMsg(id){if(!msg.value.trim())return;S.messages[id]=S.messages[id]||[];S.messages[id].push(['Vous',msg.value.trim()]);save();go('conversations',id)}function eventCard(e){return `<article class="card"><div class="cover" style="background-image:url('${e.img}')"></div><div class="pad"><h3>${e.name}</h3><p class="muted">${e.date}<br>${e.place}</p><button class="btn secondary" onclick="event.stopPropagation();go('participants','${e.id}')">Voir les participants</button></div></article>`}function events(){return `<div class="ey">Agenda communautaire</div><h1 class="hero">Sorties</h1><div class="grid g3">${E.map(eventCard).join('')}</div>`}function participants(){let e=E.find(x=>x.id==param),people=e.participants.map(id=>P.find(p=>p.id==id));return `<button class="btn secondary" onclick="go('events')">← Retour aux sorties</button><div class="ey" style="margin-top:20px">${e.place}</div><h1 class="hero">Participants — ${e.name}</h1><p class="muted">${e.date} · ${people.length} profils visibles dans cette démonstration.</p><div class="grid g3">${people.map(card).join('')}</div>`}function venues(){return `<div class="ey">Adresses sélectionnées</div><h1 class="hero">Établissements</h1><div class="grid g3">${[['O’Pulsions',I.club,'Club · Lille'],['O’Relax',I.spa,'Spa · Hauts-de-France'],['Suite Velours',I.room,'Love room · Arras']].map(x=>`<div class="card"><div class="cover" style="background-image:url('${x[1]}')"></div><div class="pad"><h3>${x[0]}</h3><p class="muted">${x[2]}</p><button class="btn" onclick="toast('Mini-site ouvert dans la version verrouillée précédente')">Ouvrir le mini-site</button></div></div>`).join('')}</div>`}function notifications(){return `<div class="ey">Activité récente</div><h1 class="hero">Notifications</h1><div class="feed">${[['af','Emma & Nicolas ont aimé votre dernière photo'],['cl','Chloé a consulté votre profil'],['em','Nouveau message de Léa & Hugo'],['jm','Sarah & Anaïs participent à Évasion Spa'],['nt','Laura & Maxime vous recommandent O’Pulsions']].map((x,i)=>{let p=P.find(p=>p.id==x[0]);return `<div class="feeditem" onclick="go('${i==2?'conversations':'member'}','${p.id}')"><img class="avatar" src="${p.img}"><div><b>${x[1]}</b><div class="muted">Il y a ${i+1} heure(s)</div></div><span>›</span></div>`}).join('')}</div>`}function member(){let p=P.find(x=>x.id==param)||P[0],tab=S.memberTab||'overview';return `<button class="btn secondary" onclick="go('discover')">← Retour</button><div class="profilehero" style="margin-top:16px;background-image:url('${p.img}')"><div class="herocopy"><div class="ey">${p.type} · ${p.city}</div><h1 class="hero">${p.name}</h1><p>${p.compat}% compatible · ${p.ages} ans · ${p.orient}</p></div></div><div class="tabs">${[['overview','Présentation'],['albums','Albums'],['events','Sorties'],['reco','Recommandations'],['activity','Activité']].map(x=>`<button class="${tab==x[0]?'active':''}" onclick="S.memberTab='${x[0]}';save();go('member','${p.id}')">${x[1]}</button>`).join('')}</div>${tab=='overview'?`<div class="grid g2"><div class="card pad"><h2>Profil</h2><p><b>Recherche :</b> ${p.search}</p><p><b>Morphologie :</b> ${p.morph}</p><p><b>Taille :</b> ${p.height}</p><p><b>Tabac :</b> ${p.smoke}</p><div class="chips">${p.tags.map(t=>`<span class="chip">${t}</span>`).join('')}</div></div><div class="card pad"><h2>Dernières informations</h2><p>Album public mis à jour il y a 2 jours.</p><p>Participe à une sortie prochainement.</p><button class="btn" onclick="go('conversations','${p.id}')">Écrire</button></div></div>`:tab=='albums'?`<div class="gallery"><div style="background-image:url('${p.img}')"></div><div style="background-image:url('${I.party}')"></div><div style="background-image:url('${I.spa}')"></div><div class="private" style="background-image:url('${I.room}')" onclick="toast('Demande d’ouverture envoyée')"></div><div class="private" style="background-image:url('${p.img}')" onclick="toast('Demande d’ouverture envoyée')"></div></div>`:tab=='events'?`<div class="grid g3">${E.filter((e,i)=>e.participants.includes(p.id)||i<2).map(eventCard).join('')}</div>`:tab=='reco'?`<div class="grid g2"><div class="card pad"><h3>Recommandation reçue</h3><p>« Un profil élégant, respectueux et très agréable dans les échanges. »</p></div><div class="card pad"><h3>Lieux recommandés</h3><p>O’Pulsions · O’Relax · Suite Velours</p></div></div>`:`<div class="feed"><div class="feeditem"><img class="avatar" src="${p.img}"><div>A ajouté des photos à son album public</div><span class="chip">2 j</span></div><div class="feeditem"><img class="avatar" src="${p.img}"><div>S’est inscrit à une nouvelle sortie</div><span class="chip">4 j</span></div></div>`}`}
function me(){let t=S.meTab||'couple';return `<div class="ey">Votre identité Velvet</div><h1 class="hero">Camille & Julien</h1><div class="tabs">${[['couple','Le couple'],['camille','Camille'],['julien','Julien'],['albums','Albums']].map(x=>`<button class="${t==x[0]?'active':''}" onclick="S.meTab='${x[0]}';save();go('me')">${x[1]}</button>`).join('')}</div>${t=='albums'?`<div class="card pad"><h2>Vos albums</h2><p class="muted">Les visiteurs voient clairement que vous possédez aussi des albums privés, sans en voir le contenu.</p><div class="gallery"><div style="background-image:url('${I.c1}')"></div><div style="background-image:url('${I.party}')"></div><div style="background-image:url('${I.spa}')"></div><div class="private" style="background-image:url('${I.room}')"></div><div class="private" style="background-image:url('${I.c2}')"></div></div><button class="btn" onclick="toast('Création d’un album simulée')" style="margin-top:15px">Créer un album</button></div>`:`<div class="card pad"><div class="row"><div><div class="ey">${t=='couple'?'Profil commun':t=='camille'?'Profil individuel féminin':'Profil individuel masculin'}</div><h2>${t=='couple'?'Camille & Julien':t=='camille'?'Camille':'Julien'}</h2></div><button class="btn" onclick="editMe('${t}')">Modifier</button></div>${t=='couple'?`<p>${S.profile.coupleBio}</p><p><b>Notre histoire :</b> ${S.profile.story}</p><p><b>Recherche :</b> ${S.profile.search}</p><p><b>Ville :</b> ${S.profile.city}</p><p><b>Tabac :</b> ${S.profile.smoke}</p>`:t=='camille'?`<p>${S.profile.camilleBio}</p><p><b>Taille :</b> ${S.profile.camilleHeight} cm</p><p><b>Poids :</b> ${S.profile.camilleWeight} kg</p><p><b>Morphologie :</b> ${S.profile.camilleMorph}</p><p><b>Orientation :</b> bi-curieuse</p><p><b>Recherche personnelle :</b> femmes et couples au feeling</p>`:`<p>${S.profile.julienBio}</p><p><b>Taille :</b> ${S.profile.julienHeight} cm</p><p><b>Poids :</b> ${S.profile.julienWeight} kg</p><p><b>Morphologie :</b> ${S.profile.julienMorph}</p><p><b>Orientation :</b> hétéro</p><p><b>Recherche personnelle :</b> couples respectueux et connexions naturelles</p>`}</div>`}`}
function editMe(t){let labels=t=='couple'?[['coupleBio','Présentation'],['story','Notre histoire'],['search','Recherche'],['city','Ville'],['smoke','Tabac']]:t=='camille'?[['camilleBio','Présentation'],['camilleHeight','Taille'],['camilleWeight','Poids'],['camilleMorph','Morphologie']]:[['julienBio','Présentation'],['julienHeight','Taille'],['julienWeight','Poids'],['julienMorph','Morphologie']];content.innerHTML=`<button class="btn secondary" onclick="go('me')">← Annuler</button><h1 class="hero">Modifier ${t}</h1><div class="formgrid">${labels.map(x=>`<label class="field"><span>${x[1]}</span><textarea id="f_${x[0]}">${S.profile[x[0]]||''}</textarea></label>`).join('')}</div><button class="btn" onclick='saveMe(${JSON.stringify(labels.map(x=>x[0]))})' style="margin-top:15px">Enregistrer</button>`}function saveMe(keys){keys.forEach(k=>S.profile[k]=document.getElementById('f_'+k).value);save();toast('Profil enregistré');go('me')}function render(){nav();let html=route=='home'?home():route=='discover'?discover():route=='maps'?maps():route=='conversations'?conversations():route=='events'?events():route=='participants'?participants():route=='venues'?venues():route=='notifications'?notifications():route=='member'?member():me();content.innerHTML=html}const navEl=document.getElementById('nav');global.addEventListener('keydown',e=>{if(e.key=='Enter'&&document.activeElement==global){let q=global.value.toLowerCase(),p=P.find(x=>JSON.stringify(x).toLowerCase().includes(q));if(p)go('member',p.id);else toast('Aucun résultat')}});render();</script></body></html>
