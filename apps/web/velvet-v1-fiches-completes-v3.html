  w.go = function(route, parameter){
    if(route==='me'){
      renderMe();
      w.scrollTo(0,0);
      return;
    }
    if(route==='member'){
      if(w.param!==parameter){
        memberIdentity='couple';
        memberSection='profile';
        memberCircleOpen=false;
      }
      renderMember(parameter);
      w.scrollTo(0,0);
      return;
    }
    if(route==='circles'){
      renderCirclesStandalone();
      w.scrollTo(0,0);
      return;
    }
    oldGo(route,parameter);
  };

      w.S.demoProfileV3[element.dataset.profile]=element.value;
    });
    w.save(); editing=false; renderMe(); w.toast('Fiche enregistrée · validation du couple prise en compte');
  };
  window.velvetAlbumVisibility = (key,value) => {
    w.S.albumVisibility[key]=value; w.save(); renderMe(); w.toast('Audience de l’album mise à jour');
  };
  window.velvetProfileVisibility = (key,value) => {
    w.S.profileVisibility[key]=value; w.save(); renderMe(); w.toast('Visibilité mise à jour');
  };
  window.velvetCreateCircle = () => {
    const input=d.getElementById('newCircleName');
    const name=input?.value.trim();
    if(!name){ w.toast('Donnez un nom au cercle'); return; }
    w.S.circles.private.push({id:'circle-'+Date.now(),name,members:[]});
    w.save(); renderMe(); w.toast('Cercle privé créé');
  };
  window.velvetBubbleToCircle = id => {
    const index=w.S.circles.bubbles.findIndex(b=>b.id===id);
    if(index<0) return;
    const bubble=w.S.circles.bubbles[index];
    w.S.circles.private.push({id:'circle-'+Date.now(),name:bubble.name.replace('Bulle · ','Cercle · '),members:[]});
    w.S.circles.bubbles.splice(index,1);
    w.save(); renderMe(); w.toast('La Bulle est devenue un Cercle privé');
  };
  window.velvetOpenEvent = id => oldGo('participants',id);

  window.velvetMemberIdentity = identity => {
    memberIdentity=identity; memberSection='profile'; memberCircleOpen=false;
    renderMember(w.param); w.scrollTo(0,0);
  };
  window.velvetMemberSection = section => {
    memberSection=section; memberCircleOpen=false; renderMember(w.param); w.scrollTo(0,0);
  };
  window.velvetCirclePicker = () => {
    memberCircleOpen=!memberCircleOpen; renderMember(w.param);
  };
  window.velvetAddToCircle = (id,type) => {
    const list=w.S.circles[type];
    const index=list.indexOf(id);
    if(index>=0) list.splice(index,1); else list.push(id);
    memberCircleOpen=false; w.save(); renderMember(id);
    w.toast(index>=0?'Profil retiré du cercle':'Profil ajouté au cercle');
  };
  window.velvetAddToPrivateCircle = (id,circleId) => {
    const circle=w.S.circles.private.find(c=>c.id===circleId);
    if(!circle) return;
    const index=circle.members.indexOf(id);
    if(index>=0) circle.members.splice(index,1); else circle.members.push(id);
    memberCircleOpen=false; w.save(); renderMember(id);
    w.toast(index>=0?'Profil retiré du cercle privé':'Profil ajouté au cercle privé');
  };
  window.velvetMeet = id => {
    if(w.S.encounters[id]==='confirmed'){ w.toast('Rencontre déjà certifiée par les deux profils'); return; }
    w.S.encounters[id]='pending'; w.save(); renderMember(id);
    w.toast('Confirmation envoyée à l’autre profil');
  };
  window.velvetConfirmMeet = id => {
    w.S.encounters[id]='confirmed';
    if(!w.S.circles.trust.includes(id)) w.S.circles.trust.push(id);
    w.save(); renderMember(id);
    w.toast('Rencontre certifiée · lien ajouté au Cercle de confiance');
  };
  window.velvetOpenConversation = id => oldGo('conversations',id);
  window.velvetBackToDiscover = () => oldGo('discover');

});
</script>
</body>
</html>
